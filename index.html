<h1>Preamble</h1>
<h2>About This Manual</h2>
<p>This Owner's Manual applies to the VICTORIS series produced by MARUTI SUZUKI INDIA LIMITED.</p>
<img src="victoris-vehicle-overview.jpg" alt="Victoris — Front and Rear View">
<p>NOTE: The illustrated model is one of the VICTORIS series. Accessories shown in the picture are not part of standard equipment.</p>
<p>© Copyright 2025 <strong>Maruti Suzuki India Limited.</strong> All rights reserved. No part of this manual can be reproduced in any manner whatsoever or transmitted in any form or by any means without prior written consent of Maruti Suzuki India Limited.</p>
<h2>Foreword</h2>
<p>This manual is an essential part of your vehicle and should remain with the vehicle when resold or otherwise transferred to a new owner or operator. Please read this manual carefully before operating your new MARUTI SUZUKI and review the manual from time to time. It contains important information on safety, operation and maintenance. You are invited to avail the three Free Inspection Services as described in the manual. Three free inspection coupons are attached to this manual. Please show this manual to your dealer workshop while you take your MARUTI SUZUKI for any Service.</p>
<p>To prolong the life of your vehicle and reduce maintenance cost, the periodic maintenance must be carried out according to "PERIODIC MAINTENANCE SCHEDULE" described in "INSPECTION AND MAINTENANCE" section of this manual. It is essential for preventing trouble and accidents to ensure your satisfaction and safety.</p>
<p>Daily inspection and care as per "DAILY INSPECTION CHECKLIST" described in the "OPERATING YOUR VEHICLE" section of this manual is essential for prolonging the life of the vehicle and for safe driving.</p>
<p>Vehicle and the available features/accessories therein should be used and plied by the owner/user in accordance with the applicable legal requirements.</p>
<p>MARUTI SUZUKI INDIA LIMITED believes in conservation and protection of Earth's natural resources. To that end, we encourage every vehicle owner to recycle, trade-in or properly dispose of, as appropriate, used Engine Oil, coolant and other fluids, batteries and tyres etc.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>All information in this manual is based on the latest product information available at the time of publication. Due to improvements or other changes, there may be discrepancies between information in this manual and your vehicle. MARUTI SUZUKI INDIA LIMITED reserves the right to make production changes at any time, without notice and without incurring any obligation to make the same or similar changes to vehicles previously built or sold.</p>
<p>This vehicle may not comply with standards or regulations of other countries. Before attempting to register this vehicle in any other country, check all applicable regulations and make any necessary modifications.</p>
</div>
<p><strong>MARUTI SUZUKI INDIA LIMITED</strong></p>
<h2>Important — Signal Words</h2>
<p>Please read this manual and follow its instructions carefully. To emphasize special information, the symbol and the words <strong>WARNING</strong>, <strong>CAUTION</strong>, <strong><em>NOTICE</em></strong> and <em>NOTE</em> have special meanings. Pay particular attention to messages highlighted by these signal words:</p>
<p><strong>⚠ WARNING</strong> — Indicates a potential hazard that could result in death or serious injury.</p>
<p><strong>⚠ CAUTION</strong> — Indicates a potential hazard that could result in minor or moderate injury.</p>
<p><strong><em>NOTICE</em></strong> — Indicates a potential hazard that could result in vehicle damage.</p>
<p><em>NOTE — Indicates special information to make maintenance easier or instructions clearer.</em></p>
<p>The circle with a slash in this manual means "Don't do this" or "Don't let this happen."</p>
<p>NOTE:</p>
<ul>
<li>Words like car, model/variant are invariably used in this manual to denote the "Vehicle".</li>
<li>Pictorial representations used in this manual are for reference purposes only.</li>
</ul>
<h2>Modification Warning</h2>
<p><strong>⚠ WARNING:</strong> Do not modify your vehicle. Modification could adversely affect safety, handling, performance, or durability and may violate governmental regulations. In addition, damage or performance problems resulting from modification may not be covered under warranty.</p>
<p><strong><em>NOTICE:</em></strong> Improper installation of mobile communication equipment such as cellular telephones, CB (Citizen's Band) radios may cause electronic interference with your vehicle's ignition system, resulting in vehicle performance problems. Consult your Maruti Suzuki authorised workshop or qualified service technician for advice on installing such mobile communication equipment.</p>
<p><strong><em>NOTICE:</em></strong> The diagnostic connector of your vehicle is prepared only for the specific diagnostic tool for inspection and service purpose. Connecting any other tool or device may interfere with electronic parts operations and cause running out of batteries.</p>
<h2>Warning — Illustrated</h2>
<img src="preamble-warning-illustrated.jpg" alt="Illustrated warning panels — fire/breakdown and waterlogging">
<p><strong>Vehicle may break-down, meet with an accident or catch fire due to:</strong></p>
<ol>
<li>Installation of high wattage bulbs, non genuine lamps/horns, modified suspension/wheels, or non genuine parts/accessories.</li>
<li>Retrofitment of LPG/CNG fuel systems/kits.</li>
<li>Usage of domestic LPG.</li>
<li>Short circuiting due to tampering of wiring harness.</li>
</ol>
<p>CAUTION: Do not store or carry inflammable materials in the vehicle.</p>
<p><strong>Avoid driving into or starting the vehicle in a heavily water logged area. Vehicle may break-down or engine may fail due to:</strong></p>
<ol>
<li>Water entry into the engine (which may lead to hydrostatic lock).</li>
<li>Short circuiting of the electrical systems.</li>
</ol>
<p><strong>If the vehicle is stuck in deep water, do not start/crank the vehicle until the level of water drops below the level of exhaust pipe.</strong></p>
<p>NOTE: If the vehicle is submerged in water, report to the nearest authorized workshop.</p>
<h2>Caution</h2>
<ol>
<li>Retro-fitment of LPG/CNG kit may deteriorate vehicle performance, reduce engine &amp; engine related component's life and also warranty will be null and void for such vehicles.</li>
<li>Do not use domestic LPG/LPG cylinder for your factory fitted LPG vehicles.</li>
<li>Usage of domestic LPG for running vehicles is prohibited as per law.</li>
<li>Do not remove company fitted LPG/CNG kit to install some other kit. It may affect vehicle performance and may cause fire.</li>
<li>Drive slowly on wet roads. Tyres may slip while braking at higher speeds due to aquaplaning (reduced contact area between tyre and road due to presence of water).</li>
<li>Do not leave engine running in garages or confined areas, with passengers inside. This may result in accumulation of carbon-monoxide in cabin and may lead to suffocation or breathing problems.</li>
<li>Do not park vehicle on dry leaves or grass. This may lead to fire due to hot catalytic converter, igniting the dry leaves/grass.</li>
<li>If the vehicle is equipped with CNG/LPG, ensure availability of fire extinguisher in the vehicle all the time.</li>
<li>Always wear seat belt at all times.</li>
<li>Do not use mobile phone while driving.</li>
<li>Avoid smoking in the car; live bud thrown in car may cause fire.</li>
<li>Do not put any body part under the vehicle when it is supported on a Jack.</li>
<li>Do not use non-genuine accessories in your vehicle.</li>
<li>Do not fit accessories from unauthorized workshops/sources.</li>
<li>Usage of non-approved electrical accessories in your vehicle may result in spark, fire or personal injury.</li>
<li>Do not use camphor, incense sticks inside cabin room. Doing so may cause fire.</li>
<li>Avoid usage of cellular phones while refueling. Electric current and/or electronic interference from cellular phones can potentially ignite fuel vapors and cause fire.</li>
<li>Avoid entry inside vehicle immediately once after you have begun refueling. You can generate a build up of static electricity by touching, rubbing or sliding against any item or fabric capable of producing static electricity. Static electricity discharge can ignite fuel vapors and may causing a fire.</li>
<li>Do not check the engine room/open the hood near the fire area (outside the vehicle). Fuel, washer fluid, etc. are flammable oils that may cause fire.</li>
<li>Avoid driving when vehicle has met with an accident. Before driving, please contact with authorized MSIL dealership.</li>
</ol>
<h2>Digital Owner's Manual</h2>
<p>To experience and use the Digital Owner's Manual, download the Maruti Suzuki Rewards app.</p>
<p>The <strong>Maruti Suzuki Rewards</strong> app ensures a hassle free car ownership experience. Get easy access to all the services and information you need by downloading the app (available on Google Play and the App Store).</p>
<p><strong>How to download Owner's Manual from Maruti Suzuki application:</strong></p>

<h2>Warranty Policy</h2>
<p>Maruti Suzuki India Limited (hereinafter called "Maruti Suzuki"), warrants that each new Maruti Suzuki vehicle distributed in India by Maruti Suzuki and sold by a Maruti Suzuki authorized dealer will be free, under normal use and service, from any defects in material and workmanship at the time of manufacture SUBJECT TO THE FOLLOWING TERMS AND CONDITIONS:</p>
<h3>(1) Qualification</h3>
<p>To qualify for this warranty the vehicle must be delivered by a Maruti Suzuki authorized dealer and set-up, and serviced by a Maruti Suzuki authorized workshop.</p>
<h3>(2) Term</h3>
<p>The term of the warranty shall be Thirty-Six (36) months or 1,00,000 kilometers (whichever occurs first) from the date of invoice to the first owner.</p>

<template id="tpl-faq">
<h1>FAQ</h1>
<h2>Door Opening / Closing</h2>
<p><strong>Q. The keyless entry system does not work. What should I do?</strong></p>
<p>A. There is a possibility that something is interfering with the function of the keyless entry system. Refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in the "BEFORE DRIVING" section.</p>
<p>A. If the battery of the keyless push start system remote controller is dead, replace it. Refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">"Battery replacement"</a> in the "BEFORE DRIVING" section.</p>
<p><strong>Q. A loud alarm sounds when opening the door. What does this mean?</strong></p>
<p>A. The security system has been activated. Press the engine switch to change the ignition mode to ON to stop the alarm. For the correct method of handling, refer to <a onclick="navigate('security-system')" href="javascript:void(0)">03-04 Security System</a> in the "BEFORE DRIVING" section.</p>
<h2>Window Glass</h2>
<p><strong>Q. How can I clear fog on the inside of the windshield and door glass areas?</strong></p>
<p>A. Use the defroster switch. Refer to <a onclick="navigate('auto-hvac')" href="javascript:void(0)">07-22 Automatic Heating and Air Conditioning System</a> in the "OTHER CONTROLS AND EQUIPMENT" section.</p>
<p><strong>Q. How can I clear fog on the inside of the rear window glass?</strong></p>
<p>A. Use the heated rear window switch. Refer to <a onclick="navigate('heated-rear-window')" href="javascript:void(0)">03-12 Heated Rear Window Switch</a> in the "BEFORE DRIVING" section.</p>
<h2>Tyres</h2>
<p><strong>Q. I get a flat tyre. What should I do?</strong></p>
<p>A. Depending on the tyre conditions, you can repair the flat tyre using the <a onclick="navigate('flat-tyre-repair')" href="javascript:void(0)">10-06 Flat Tyre Repair Kit</a>, or change the flat tyre with a spare tyre (optional) using the <a onclick="navigate('tyre-changing')" href="javascript:void(0)">10-04 Tyre Changing Tool</a>.</p>
<h2>Running Out of Battery</h2>
<p><strong>Q. The battery runs out and the engine does not start. What should I do?</strong></p>
<p>A. Connect the battery of a vehicle for assistance to jump leads and start the engine. Refer to <a onclick="navigate('jump-starting')" href="javascript:void(0)">10-07 Jump-starting Instructions</a>.</p>
<h2>Engine Oil</h2>
<p><strong>Q. I would like to change the engine oil. What should I do?</strong></p>
<p>A. Refer to <a onclick="navigate('engine-oil')" href="javascript:void(0)">09-04 Engine Oil and Filter</a> in the "INSPECTION AND MAINTENANCE" section and "Specifications" in the "SPECIFICATIONS" section.</p>
<h2>ENG A-STOP System (if equipped)</h2>
<p><strong>Q. The ENG A-STOP system does not work. What should I do?</strong></p>
<p>A. Refer to <a onclick="navigate('eng-a-stop')" href="javascript:void(0)">05-15 ENG A-STOP System</a> in the "OPERATING YOUR VEHICLE" section.</p>
<h2>Electrical Equipment</h2>
<p><strong>Q. The headlights or brake lights do not light up. What should I do?</strong></p>
<p>A. Check the light bulbs. Refer to <a onclick="navigate('bulbs')" href="javascript:void(0)">09-16 Bulb Replacement</a> in the "INSPECTION AND MAINTENANCE" section and "Specifications" in the "SPECIFICATIONS" section.</p>
<p><strong>Q. I cannot use an electrical device. What should I do?</strong></p>
<p>A. Check the fuses. Refer to <a onclick="navigate('fuses')" href="javascript:void(0)">09-15 Fuses</a> in the "INSPECTION AND MAINTENANCE" section.</p>
<h2>Suzuki Safety Support</h2>
<p><strong>Q. How can I know when Suzuki Safety Support operates and does not operate?</strong></p>
<p>A. Refer to <a onclick="navigate('suzuki-safety-support')" href="javascript:void(0)">05-18-00 Suzuki Safety Support</a> in the "OPERATING YOUR VEHICLE" section.</p>

<template id="tpl-seat-floor">
<h1>Driver's Seat Floor</h1>
<h2>Floor Mats</h2>
<p>To prevent the driver's side floor mat from sliding forward and possibly interfering with the operation of the pedals, Maruti Suzuki genuine floor mats are recommended.</p>
<p>Whenever you put the driver's side floor mat back in the vehicle after it has been removed, hook the floor mat grommets to the fasteners and position the floor mat properly in the footwell.</p>
<p>When you replace the floor mats with a different type such as all-weather floor mats, we highly recommend using Maruti Suzuki genuine floor mats for proper fitting.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Failure to take the following precautions may result in the driver's side floor mat interfering with the pedals and causing a loss of vehicle control or an accident.</p>
<ul>
<li>Check that the floor mat grommets are hooked to the fasteners.</li>
<li>Never stack floor mats.</li>
<li>Never use a floor mat which does not fit the floor, as this may cause hindrance or damage to the vehicle and its functioning.</li>
<li>Never use damaged floor mats.</li>
</ul>
</div>
<h2>Clearing the Floor</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not leave empty cans or other objects at your feet. These objects may interfere with pedal operation and cause accidents.</p>
</div>
</template>

<template id="tpl-front-seats">
<h1>Front Seats</h1>
<h2>Seat Adjustment</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never attempt to adjust the driver's seat or seatback while driving. The seat or seatback could move unexpectedly, causing loss of control. Check that the driver's seat and seatback are properly adjusted before driving.</li>
<li>To avoid excessive seat belt slack, check that the seats are adjusted before the seat belts are fastened.</li>
<li>All seatbacks should always be in an upright position when driving, or seat belt effectiveness may be reduced. Seat belts are designed to offer maximum protection when seatbacks are in the upright position.</li>
<li>If you recline the seatback more than necessary, the seat belt and SRS airbag system may not function properly in the event of an accident, resulting in serious injury. When driving, do not recline the seatback more than necessary.</li>
<li>Do not place a cushion between the seatback and your back. You may not be able to drive in a correct posture, and the seat belt and head restraint may not provide their best performance, possibly causing severe injury in an accident.</li>
<li>Do not place any object under the front seat. If an object gets stuck under the seat, the seat may not latch properly and may cause injury. An object caught under the seat may also cause the following: the seat will not latch; parts under the seat may be damaged; a cigarette lighter or spray can on the floor may ignite accidentally.</li>
</ul>
<p><strong>CAUTION:</strong> When adjusting the seat, observe the following:</p>
<ul>
<li>Your hands or feet may get caught and be injured. Do not put your hands or feet under the seat or near the moving parts.</li>
<li>Passengers may be injured by a moving seat. Check your surroundings and ensure the safety of passengers.</li>
</ul>
</div>
<h2>Manual Seat (if equipped)</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If the seat is not securely latched, it may move unexpectedly while driving and result in an accident. After adjusting the seat, check it by moving it back and forth to ensure it is securely latched.</p>
<p><strong>CAUTION:</strong> If you operate the reclining lever while away from the seatback, the seatback may suddenly spring up, resulting in injury. Do not operate the reclining lever while away from the seatback. When operating it, make sure to support it with your hand.</p>
</div>
<p><strong>Seat position adjustment lever (1):</strong> Pull the lever up and slide the seat.</p>
<p><strong>Seatback angle adjustment lever (2):</strong> Pull the lever up and move the seatback.</p>
<p><strong>Seat height adjustment lever (3) (if equipped):</strong> Pull the lever up to raise the seat. Push the lever down to lower the seat. After adjustment, move the seat and seatback back and forth to check that it is securely latched.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>To operate the seatback smoothly, pull the seatback adjustment lever (2) in the upward direction. Ensure you move the seatback only after the lever is fully up. After adjusting the seatback, release the lever gently and check that the seatback is locked by moving it forward and backward.</p>
</div>
<h2>Power Seat (if equipped)</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>If you adjust the power seat for a long time with the engine off, the battery may discharge.</li>
<li>The power seat is driven by electric motors. Stop operating the seat once the adjustment is done. Continuous operation may cause the motors to stop temporarily; they will resume normal operation after some time.</li>
</ul>
</div>
<p><strong>Seat position adjustment (1) — driver's seat:</strong> Operate the switch and slide the seat.</p>
<p><strong>Seat height adjustment (2) — driver's seat:</strong> Operate the switch and raise or lower the entire seat.</p>
<p><strong>Cushion angle adjustment (3) — driver's seat:</strong> Operate the switch and raise or lower the front of the cushion.</p>
<p><strong>Seatback angle adjustment (4) — driver's seat:</strong> Operate the switch and adjust the angle of the seatback.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not leave children unattended in the vehicle. Children can be injured if part of their body gets caught by the seat during operation.</li>
<li>Before operating the power seat, check that there are no obstacles or belongings under the seat that could get caught during movement. Failure to do so may cause damage to belongings or the seat.</li>
</ul>
</div>
<h2>Head Restraints</h2>
<p>Head restraints are designed to help reduce the risk of neck injuries in the case of an accident. Adjust the head restraint so that the centre of the restraint is level with the top of your ears. If this is not possible for very tall passengers, adjust the head restraint as high as possible.</p>
<p>To raise the front head restraint, pull it upward until it clicks. To lower it, push down the head restraint while holding in the lock button (1). To remove it entirely (for cleaning, replacement, etc.), push in the lock button (1) and pull the head restraint all the way out.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>It may be necessary to recline the seatback to provide enough overhead clearance to remove the head restraint.</p>
<p><strong>WARNING:</strong></p>
<ul>
<li>Never drive with the head restraints removed. Without the head restraint, a passenger's backward tilting cannot be prevented in a collision, and the impact to the head cannot be reduced during sudden braking or a collision. This may cause severe injury.</li>
<li>If the head restraint is installed back to front or not installed securely, it may not provide best performance in an emergency, resulting in severe injury. If installed back to front, you cannot adjust the height or install it securely. Always install the head restraint securely in the correct direction.</li>
<li>Do not attempt to adjust the head restraint while driving. Being distracted by head restraint adjustment could lead to an accident.</li>
</ul>
</div>
</template>

<template id="tpl-steering-lock">
<h1>Tilt / Telescoping Steering Lock Lever (if equipped)</h1>
<p>The lock lever is located under the steering column. To adjust the steering wheel height and fore-aft position:</p>
<ol>
<li>Push down the lock lever to unlock the steering column.</li>
<li>Adjust the steering wheel to the desired height and fore-aft position, then lock the steering column by pulling the lock lever up.</li>
<li>Try moving the steering wheel up, down, and back and forth to check that it is securely locked in position.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Never attempt to adjust the steering wheel while the vehicle is moving. Doing so could cause you to lose control of the vehicle.</p>
</div>
</template>

<template id="tpl-mirrors">
<h1>Mirrors</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Always unfold all the outside rearview mirrors and adjust them properly before driving.</li>
<li>Do not place objects in the rear of the vehicle which may hinder visibility or interfere with your vision from the rear window glass.</li>
</ul>
</div>
<h2>Inside Rearview Mirror</h2>
<p>You can adjust the inside rearview mirror by hand to see the rear of your vehicle. To adjust the mirror, set the selector tab (3) to the day position, then move the mirror up, down, or sideways to obtain the best view. When driving at night, you can move the selector tab (3) to the night position to reduce glare from the headlights of vehicles behind you.</p>
<ul>
<li>(1) Night driving</li>
<li>(2) Day driving</li>
<li>(3) Selector tab</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>If you adjust the inside rearview mirror while driving, you could lose control of the vehicle, resulting in an accident. Adjust the inside rearview mirror before driving.</li>
<li>Only use the night position if it is necessary to reduce glare from the headlights of vehicles behind you. Be aware that in this position you may not be able to see some objects that could be seen in the day position.</li>
</ul>
<p><strong>CAUTION:</strong> Do not modify the inside rearview mirror or install a non-genuine wide mirror. It could result in injury during an accident.</p>
</div>
<h3>Auto Dimming Rearview Mirror</h3>
<p>You can adjust the auto dimming rearview mirror by hand to see the rear of your vehicle. This mirror automatically reduces glare from the lights of vehicles behind you. The function works when the ignition mode is ON.</p>
<p>When the switch (2) is pushed, the green indicator (1) lights up, confirming the mirror is in automatic dimming mode. To cancel automatic dimming mode, push the switch (2) again; the indicator (1) will go out.</p>
<p>The auto dimming function is automatically deactivated while the gearshift lever is in the "R" position.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>The electrolyte may come out if the mirror is broken. Do not allow it to come into contact with your skin or eyes. If it accidentally does, flush with water immediately and consult a doctor.</p>
<p><strong>NOTICE:</strong> Do not hook anything heavy on the mirror, as the mirror may break under the weight.</p>
<p><strong>NOTE:</strong> The auto dimming system may not work in the following cases:</p>
<ul>
<li>Light from the rear is not directly focused on the sensor (3).</li>
<li>The rear window glass is not transparent enough or is dark tinted.</li>
</ul>
</div>
<h2>Outside Rearview Mirrors</h2>
<p>Adjust the outside rearview mirrors so you can just see the side of your vehicle in the mirrors.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you adjust the outside rearview mirror while driving, you could lose control of the vehicle, resulting in an accident. Adjust the outside rearview mirrors before driving.</p>
</div>
<h3>Electric Mirrors</h3>
<p>The switch to control the electric mirrors is located on the driver's door panel. You can adjust the mirrors when the ignition mode is ACC or ON.</p>
<ol>
<li>Move the selector switch (a) to the left or right to select the mirror you wish to adjust.</li>
<li>Press the outer part of the switch (a) in the direction you wish to move the mirror.</li>
<li>Return the selector switch (a) to the centre position to help prevent unintended adjustment.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>The electric outside rearview mirror operates even when the ignition switch is in the ACC position. To prevent unnecessary battery discharge, do not adjust the mirrors longer than necessary while the engine is not running.</li>
<li>The mirrors stop moving when they reach the maximum adjusting angle, but the motor continues to operate while the switch is pressed. Do not continue pressing the switch in this situation, as the motor may be damaged.</li>
<li>Do not attempt to adjust the outside rearview mirror by hand, as this may cause damage to the motor.</li>
<li>Do not fold the electrically foldable outside rearview mirror by hand. It could cause motor failure.</li>
</ul>
</div>
<h3>Outside Rearview Mirror Folding Switch</h3>
<p>You can fold the mirrors when parking in a narrow space. Push the folding switch to fold and unfold the mirrors. Make sure the mirrors are completely unfolded before you start driving.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not drive the vehicle with the outside rearview mirrors folded. Doing so may result in an accident.</p>
<p><strong>CAUTION:</strong> Moving mirrors can pinch and injure a hand. Do not allow anyone's hand to get near the mirrors when folding and unfolding them.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>If you press the folding switch to open the mirrors and simultaneously start the engine, the mirrors may get stuck momentarily. If this happens, press the folding switch again after starting the engine.</li>
<li>A slight time difference in the opening of both mirrors is normal and is due to the angular positioning of the driver's seat.</li>
</ul>
</div>
</template>

<p>Head restraints are designed to help reduce the risk of neck injuries in the case of an accident.</p>
<p>To raise a rear head restraint, pull it upward until it clicks. To lower it, push down the head restraint while holding in the lock button (1). To remove it entirely (for cleaning, replacement, etc.), push in the lock button (1) and pull the head restraint all the way out.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>It may be necessary to fold the seatback forward to provide enough overhead clearance to remove the head restraint.</p>
<p><strong>WARNING:</strong></p>
<ul>

<li>If the head restraint is installed back to front or not installed securely, it may not provide best performance in an emergency, resulting in severe injury. If installed back to front, you cannot adjust the height or install it securely. Always install the head restraint securely in the correct direction.</li>

<p>When using the rear centre head restraint, pull it up and lock it securely before driving.</p>
<div class="box warning">

</div>

<template id="tpl-seat-utility">
<h1>Seat Utility</h1>
<h2>Folding Rear Seats</h2>
<p>The rear seats can be folded forward to provide additional cargo space.</p>
<p>To fold the rear seats forward:</p>
<ol>
<li>Lower the head restraint fully.</li>
<li>Move the outboard lap-shoulder belts to the rear door side trims.</li>
<li>Slide the release lever (1) on the top of each split seat in the arrow direction and fold the seatbacks forward.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you need to carry cargo in the passenger compartment with the seatback folded forward, secure the cargo or it may be thrown about, causing injury. Never pile cargo higher than the seatbacks.</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>After folding the rear seatback forward, do not allow any foreign material to enter the lock opening. This may cause damage to the inside of the lock and prevent the seatback from being locked securely when returned.</li>
<li>When moving a seatback, make sure the seat belts are placed on the rear door side trims so the seat belts and buckles are not caught by the seatback, seat hinge, or seat latch. This helps prevent damage to the belt system.</li>
<li>Make sure the belt webbing is not twisted.</li>
</ul>
</div>
<h2>Returning the Seat to Normal Position</h2>
<p>Raise the seatback until it locks into place. After returning the seat, move the seatback back and forth to check that it is securely latched.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<ul>
<li>When returning the rear seatback to the normal position, be careful that your fingers are not caught between the lock and the striker.</li>
<li>Do not put your hand into the rear seatback lock opening, or your finger may get caught and be injured.</li>
</ul>
<p><strong>CAUTION:</strong> After securing the rear seatback, check that it is locked securely. If it is not, the red indicator (2) will appear beside the release lever (1).</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>When returning the rear seatback to the normal position, do not allow any foreign material to enter the lock opening. This may prevent the seatback from being locked securely.</li>
<li>Handle the seatback carefully by hand to avoid any damage to the lock itself. Do not push it using an object or by applying excessive force.</li>
<li>The lock is designed exclusively for securing the rear seatback. Do not use it for any other purpose, as incorrect use may cause damage to the inside of the lock.</li>
<li>Before returning the seatback, check that there is nothing around the striker. Any foreign material may prevent the seatback from locking securely.</li>
</ul>
</div>
</template>

<template id="tpl-child-safety">
<h1>Safety for Child</h1>
<p>For safety, carefully drive at lower speed than usual when children are in the vehicle.</p>
<h2>Place a Child in the Rear Seat</h2>
<ul>
<li>Seat a child next to an adult when possible, and ensure that the child can be visually monitored.</li>
<li>Select an appropriate child restraint system suitable for the child's age and physical size.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>If you do not use the child-proof lock, a child may open a door and be thrown out, resulting in severe injury. Use the child-proof lock when children are in the vehicle.</li>
<li>When it is necessary to seat a child who does not need a child restraint system in the front passenger's seat, slide the front passenger's seat all the way back. If the front passenger's seat is in a forward position, there is a risk of serious injury due to major impact if the front passenger's seat airbag deploys.</li>
<li>If a child puts a hand out of the window or leans on a door, the child may be severely injured by the impact of side or curtain airbag activation. Do not allow a child to put a hand out of the window or lean on a door.</li>
<li>Do not allow the hands or feet of a child near movable parts inside the vehicle, such as armrests and seat rails. Otherwise, there is a possibility of injury.</li>
</ul>
</div>
<h2>A Child Needs to Wear Seat Belt</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not drive with a child on your lap. Even if you hold the child tightly, proper support is not possible, and in the event of a collision the child may be seriously injured.</li>
<li>If a child does not wear a seat belt, in a sudden braking or a collision the child may be seriously injured. Always have a child wear a seat belt.</li>
<li>Do not allow two or more people to use a single seat belt. In a sudden braking or collision, the seat belt may not provide best performance, resulting in severe injury.</li>
<li>The seat belts of this vehicle are designed for occupants of adult size. If the shoulder strap rests on the neck or chin of a child rather than the shoulder, or if the lap portion of the belt does not rest securely on the hipbone, ensure that the child is seated in a child restraint system placed in the rear seat. Failure to properly use a seat belt may result in serious injury to the child.</li>
<li>Use a child restraint system securely fastened to the rear seat for any child that cannot hold their head upright or sit on their own.</li>
</ul>
</div>
<h2>Do not Let a Child Play with Seat Belt</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If a child plays with a seat belt and the child's body becomes wrapped by the belt, it may cause severe injury such as suffocation. In case of emergency, cut the seat belt with scissors.</p>
</div>
<h2>Using the Child Restraint System</h2>
<p>Refer to <a onclick="navigate('child-restraint-systems')" href="javascript:void(0)">02-13 Child Restraint Systems</a> for instructions on securing a child restraint system using the seat belt.</p>
<h2>An Adult Needs to Open or Close Each Door, Window, Tailgate, and Adjust Seats</h2>
<p>Only an adult should open or close each door or window and adjust seats, to prevent a child's hands, arms, legs, or neck from getting caught.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>If the windows are not locked, a child may operate them by mistake, or other passengers may get caught in the windows. Use the window lock switch to prevent unintended operation of the power windows by a child.</li>
<li>If you leave the power window in a ready condition, a child may cause unintended operation, resulting in an accident. When leaving the vehicle, press the engine switch to change the ignition mode to OFF and keep the key with you.</li>
</ul>
</div>
<h2>Do not Let a Child Stick Head or Hands out of the Window</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Ensure that a child does not put their hands or head out of the windows. Serious injuries due to falling out or sudden braking may occur. A child could also be seriously injured by coming into contact with objects outside the vehicle.</p>
</div>
<h2>Do not Leave a Child Unattended in the Vehicle</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When getting out of the vehicle, do not allow a child to stay in the vehicle without you. Unintended operations by a child may cause a fire or an accident. The inside temperature of the vehicle will become hot under the blazing sun; a child may suffer from heat stroke or dehydration, resulting in severe health problems or death in the worst case. Even if you turn on the air conditioner, do not leave a child alone in the vehicle.</li>
<li>Never leave children unattended in the vehicle and never allow children to have or use the key. Children may be able to start the vehicle or shift it into neutral. There is also a danger that children may injure themselves by playing with the windows or other features of the vehicle.</li>
</ul>
</div>
<h2>Do not Place a Child in the Luggage Compartment</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>The luggage area does not feature a structure that can accommodate people. Do not allow a child to ride in this area. Otherwise, there is a danger of accidents due to sudden braking. Do not let a child play in the luggage area even while the vehicle is stopped.</li>
<li>Do not let small children operate equipment which may catch or pinch body parts, such as the power window, hood, tailgate, or seats. Do not allow children to play in the luggage compartment. If a child is accidentally locked in the luggage compartment, they could suffer heat exhaustion or other injuries.</li>
</ul>
</div>
</template>

<template id="tpl-seat-belts-overview">
<h1>Seat Belts and Child Restraint Systems</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Wear your seat belts at all times.</li>
<li>An airbag supplements or adds to the frontal collision protection offered by seat belts. The driver and all passengers must be properly restrained by wearing seat belts at all times, even if driving for a very short distance, whether or not an airbag is mounted at their seating position, to minimise the risk of severe injury or death in the event of a collision.</li>
<li>Do not modify, remove, or disassemble seat belts. Doing so may prevent them from functioning properly and cause the risk of severe injury or death in the event of a collision.</li>
<li>Never allow persons to ride in the cargo area of a vehicle. In the event of an accident, there is a much greater risk of injury for persons who are not riding in a seat with their seat belt securely fastened.</li>
<li>Ensure that all seat belts are worn correctly. An improperly worn seat belt increases the risk of injury or death if a collision occurs.</li>
<li>Seat belts should always be adjusted as follows:</li>
<li>The lap portion of the belt should be worn low across the pelvis, not across the waist.</li>
<li>The shoulder straps should be worn on the outside shoulder only, and never under the arm.</li>
<li>The shoulder straps should be away from your face and neck, but not falling off your shoulder.</li>
<li>Seat belts should never be worn with the straps twisted, and should be adjusted as tightly as is comfortable to provide the protection for which they have been designed. A slack belt will provide less protection than a snug belt.</li>
<li>Check that the seat belt latch plate (tongue) is inserted into the proper buckle, especially in the rear seats. It is not possible to insert the latch plate into the wrong buckles in the rear seats.</li>
<li>Pregnant women should use seat belts, although specific recommendations about driving should be made by the woman's medical advisor. The lap portion of the belt should be worn as low as possible across the hips.</li>
<li>Do not wear seat belts over hard, fragile, or sharp items such as pens, keys, or eyeglasses in pockets or on clothing. The pressure from the seat belt on such items can cause injury in the event of an accident.</li>
<li>Do not hold a child on a passenger's lap. Even if the passenger holds the child tightly, he/she would not be supported enough in the event of an accident, and it could result in serious injury to the child.</li>
<li>Never use the same seat belt for more than one occupant, and never attach a seat belt over an infant or child being held on an occupant's lap. Such use could cause serious injury in the event of an accident.</li>
<li>Periodically inspect seat belt assemblies for excessive wear and damage. Seat belts should be replaced if the webbing becomes frayed, contaminated, or damaged in any way. It is essential to replace the entire seat belt assembly after it has been worn in a severe impact, even if damage to the assembly is not obvious.</li>
<li>Children aged 12 and under should ride properly restrained in the rear seat.</li>
<li>Infants and small children should never be transported unless they are properly restrained. Restraint systems for infants and small children can be purchased locally. Check that the system you purchase meets applicable safety standards, and read and follow all directions provided by the manufacturer.</li>
<li>If the seat belt irritates a child's neck or face, use a child restraint system appropriate for the child. The seat belts of this vehicle are principally designed for persons of adult size.</li>
<li>Avoid contamination of seat belt webbing by polishes, oils, chemicals, and particularly battery acid. Cleaning may safely be carried out using mild soap and water.</li>
<li>Do not insert any items such as coins or clips into the seat belt buckles, and be careful not to spill liquids into these parts. If foreign materials get into a seat belt buckle, the seat belt may not work properly.</li>
<li>All seatbacks should always be in an upright position when driving, or seat belt effectiveness may be reduced. Seat belts are designed to offer maximum protection when seatbacks are in the upright position.</li>
</ul>
</div>
<h2>Adjustment before Driving</h2>
<p>Make all necessary adjustments to the seat, steering wheel, and mirrors before driving.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When driving, do not adjust the steering wheel (on adjustable-type columns), the seat, the inside rearview mirror, or the outside rearview mirrors. Otherwise, there is a risk of mistaken operation of the steering wheel or reduced awareness of what is in front of you, possibly leading to an accident.</li>
<li>Do not tilt the seatback further back than necessary. If the seatback is reclined too far, the head restraint and seat belt cannot function as intended.</li>
</ul>
</div>
<h2>Correct Use of Seat Belt</h2>
<ul>
<li>Adjust the seat to the correct position and sit your body fully into the seat.</li>
<li>Make sure that the seat belt is not twisted.</li>
<li>Place the lap portion of the belt as low as possible across the pelvis.</li>
<li>The upper belt should rest on the area midway between the shoulder and the base of the neck.</li>
<li>Confirm that the belt is not twisted in any way, and remove any slack.</li>
</ul>
</template>

<template id="tpl-seat-belt">
<h1>Seat Belt</h1>
<div class="box note">
<div class="box-label">Note</div>
<p>For information on children and seat belts, refer to <a onclick="navigate('child-safety')" href="javascript:void(0)">02-08 Safety for Child</a>.</p>
</div>
<h2>Information for Pregnant Women and People with Medical Conditions</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Those that are pregnant or sick/disabled must also wear their seat belts. However, in the event of a collision, there is the danger of heavy pressure focused on certain body areas. Consultation with a physician is recommended.</li>
<li>For those that are pregnant, ensure that the lap portion of the belt is as low as possible across the pelvis, avoiding touching the abdomen. Make sure the shoulder strap rests halfway between the shoulder and the base of the neck, crossing the chest and avoiding touching the abdomen.</li>
</ul>
</div>
<h2>Lap-Shoulder Belt</h2>
<h3>Emergency Locking Retractor (ELR)</h3>
<p>The seat belt has an emergency locking retractor (ELR), which is designed to lock the seat belt only during a sudden stop or impact. It also may lock if you pull the belt across your body very quickly. If this happens, let the belt go back to unlock it, then pull the belt across your body more slowly.</p>
<h3>Fastening and Unfastening</h3>
<p>To fasten the seat belt, sit up straight and far back into the seat. Pull the latch plate across your body and press it straight into the buckle until you hear a click. After pressing the latch plate into the buckle, pull the seat belt to make sure it is securely latched.</p>
<p>To unfasten the seat belt, push the red "PRESS" button on the buckle and retract the belt slowly while holding the belt and/or the latch plate.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>If the seat belt cannot be pulled from its fully retracted position, firmly pull the belt and release it, then smoothly pull the belt out of the retractor.</li>
<li>The word "CENTER" is marked on the buckle for the rear centre belt. The buckles are designed so that a latch plate cannot be inserted into the wrong buckle.</li>
</ul>
<p><strong>WARNING:</strong> To minimise the risk of severe injury or death in the event of a collision, always wear the seat belt with both latches buckled.</p>
</div>
<h2>Rear Centre Lap-Shoulder Belt with Detachable Connector</h2>
<p>The rear centre lap-shoulder belt has a buckle, a latch plate, and a detachable connector. The buckle is marked "CENTER" to distinguish it from the rear left seat belt buckle. The buckle and connector are designed so that a wrong latch plate cannot be inserted.</p>
<p>When the rear seatback is in the upright position, keep the detachable connector latched. Only unlatch the detachable connector when the rear seatback will be folded down.</p>
<p><strong>Fastening:</strong> Before fastening the rear centre lap-shoulder belt, make sure the detachable connector (1) is securely latched and the webbing is not twisted. Sit up straight and well back in the seat, pull the latch plate (2) across your body and press it straight into the buckle (3) until you hear a click.</p>
<p><strong>Unfastening:</strong> Push the button on the buckle (3) and retract the belt slowly while holding the belt and/or the latch plate.</p>
<h3>Unlatching and Latching the Detachable Connector</h3>
<p><strong>Unlatching:</strong></p>
<ol>
<li>Insert a latch plate into the slot (1) on the connector and allow the belt to retract.</li>
<li>Once the belt has completely retracted, stow the belt in the holder (see Stowing the Rear Centre Lap-Shoulder Belt below).</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>When the rear seatback is folded forward, be sure to unlatch the connector of the rear centre lap-shoulder belt. Otherwise, the seat belt webbing can be damaged.</p>
</div>
<p><strong>Latching:</strong></p>
<ol>
<li>Pull the belt out from the holder.</li>
<li>Insert the connector latch plate (2) into the connector (3) until you hear a click.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Make sure the detachable connector is securely latched and the webbing is not twisted.</p>
</div>
<h3>Stowing the Rear Centre Lap-Shoulder Belt</h3>
<p>Stow the belt after it is completely retracted. To stow the belt, insert the latch plate into the slit (1), then insert the connector latch plate (2) into the roof holder slot (3).</p>
<h2>Seat Belt Length Adjustment</h2>
<p>The seat belt does not require length adjustment. It extends and retracts according to the movement of the body. If the seat belt receives a strong impact, the belt locks its tension automatically to secure the body.</p>
<h2>Correct Use of Seat Belt</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Use the seat belt correctly. Otherwise, in a sudden braking or a collision, the body may not be restrained, resulting in severe injury.</li>
<li>If the seat belt is twisted or contains excessive slack, there is a danger of heavy pressure focused on certain body areas.</li>
<li>If the seat belt rests on the abdomen, this area may sustain heavy pressure in a strong impact.</li>
<li>If the seat belt does not rest firmly over the shoulder, you may be thrown forward in a strong impact.</li>
</ul>
</div>
<h2>Seat Belt Reminder</h2>
<p>The seat belt reminder indicators in the instrument cluster are:</p>
<ul>
<li><strong>(1)</strong> Driver's and front passenger's seat belt reminder light</li>
<li><strong>(2)</strong> Rear passenger's seat belt reminder light (rear left)</li>
<li><strong>(3)</strong> Rear passenger's seat belt reminder light (rear centre)</li>
<li><strong>(4)</strong> Rear passenger's seat belt reminder light (rear right)</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>It is absolutely essential that the driver, front passenger, and all rear passengers fasten their seat belts at all times. Persons who are not fastening seat belts have a much greater risk of injury if an accident occurs. Make a regular habit of buckling your seat belt before starting the engine.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>Along with the seat belt reminder light, a reminder message will also appear on the information display for an unrestrained driver and/or front passenger.</li>
<li>The driver's seat belt reminder light (1) covers both the driver and front passenger.</li>
</ul>
</div>
<h3>Driver's Seat Belt Reminder</h3>
<p>If the driver's seat belt remains unbuckled when the ignition mode is changed to ON, the reminder works as follows:</p>
<ol>
<li>The driver's seat belt reminder light comes on.</li>
<li>After the vehicle's speed reaches about 15 km/h, the reminder light blinks and a buzzer sounds for about 95 seconds.</li>
<li>The reminder light remains on until the driver's seat belt is buckled.</li>
</ol>
<p>If the driver buckles the seat belt and then later unbuckles it, the reminder activates from Step 1 or Step 2 depending on vehicle speed: below 15 km/h it starts from Step 1; above 15 km/h it starts from Step 2.</p>
<p>The reminder is automatically cancelled when the driver's seat belt is buckled or the ignition mode is changed to LOCK (OFF).</p>
<h3>Front Passenger's Seat Belt Reminder</h3>
<p>If a person is sitting in the front passenger's seat and the front passenger's seat belt is unbuckled when the ignition mode is changed to ON, the front passenger's seat belt reminder activates in the same manner as the driver's seat belt reminder.</p>
<p>The seat belt reminder sensor detects whether a person is sitting in the front seat. The sensor is located in the seat cushion.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>The sensor of the front passenger's seat belt reminder is located in the seat cushion. If heavy or sharp objects are placed on the seat cushion, or if the passenger's seat is removed, disassembled, or modified, the sensor may not work properly or may be damaged. Do not put heavy or sharp objects on the seat cushion. Do not remove, disassemble, or modify the passenger's seat.</li>
<li>Depending on the type of seat cover used, operation of the sensor may be adversely affected. Maruti Suzuki highly recommends using genuine Maruti Suzuki seat covers. If a non-genuine seat cover is installed, consult a Maruti Suzuki authorised workshop.</li>
<li>If you spill liquid such as soft drinks or juice on the front passenger's seat cushion, the sensor can be damaged. Immediately wipe it dry with a soft cloth.</li>
<li>When sitting on the front passenger's seat, it is very important that the passenger sits upright, leaning against the seat backrest and centred on the seat cushion for the seat belt reminder system to function effectively. An occupant sitting improperly (slouching, turning sideways, sitting forward or sideways) may hamper the functioning of this system as it may not detect the occupant.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>If you place an object on the passenger's seat, the weight of the object will be sensed by the sensor and the front passenger's seat belt reminder light may come on and the interior buzzer may beep.</li>
<li>If a child or a small-sized person sits on the front passenger's seat, or if a cushion is placed on the seat, the weight may not be sensed by the sensor and the interior buzzer may not beep.</li>
</ul>
</div>
<h3>Rear Passenger's Seat Belt Reminder</h3>
<p>When the ignition mode is turned ON, the rear seat belt reminder works as follows:</p>
<ol>
<li>The reminder light turns ON for non-buckled seats and continues for vehicle speed below 15 km/h.</li>
<li>When vehicle speed is above 15 km/h, the reminder light remains ON for the non-buckled seats for about 65 seconds and then turns OFF.</li>
<li>When a buckled seat belt is subsequently unbuckled, the corresponding reminder light turns ON. Above 15 km/h, the reminder light blinks (about 65 seconds) along with a buzzer sound (about 35 seconds). The reminder light remains ON until the seat belt is buckled.</li>
</ol>
<p>If a rear door is opened while the vehicle is stationary, the reminder system starts from Step 1. The reminder is automatically cancelled when all rear seat belts are buckled or the ignition mode is changed to LOCK (OFF).</p>
</template>

<template id="tpl-seat-belt-care">
<h1>Handling and Care for Seat Belt</h1>
<h2>Seat Belt Handling</h2>
<p>Periodically inspect the seat belts to make sure they work properly and are not damaged. Check the webbing, buckles, latch plates, retractors, anchorages, and guide loops. Replace any seat belts which do not work properly or are damaged.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Inspect all seat belt assemblies after any collision. Any seat belt assembly which was in use during a collision (other than a very minor one) should be replaced, even if damage to the assembly is not obvious. Any seat belt assembly which was not in use during a collision must also be replaced if the seat belt pretensioners were activated. The pretensioners and the load limiter function only once. If they did not activate, consult a Maruti Suzuki authorised workshop.</li>
<li>If frays, scratches, or cuts are found on a seat belt, replace it with a new one.</li>
<li>If a buckle does not work properly, have it inspected at a Maruti Suzuki authorised workshop.</li>
<li>If strong force was applied to a seat belt in a collision, the seat belt function may be damaged even though its appearance is normal. Replace the seat belt with a new one.</li>
<li>As the seat belt may not provide best performance and may result in severe injury in an emergency, observe the following:</li>
<li>If foreign material enters a buckle or you spill a drink on it, the seat belt may not work properly. Have it inspected at a Maruti Suzuki authorised workshop.</li>
<li>Be careful not to get the seat belt caught in a door. Before closing the door, check that the seat belt is fully retracted without any slack.</li>
<li>Do not modify or remove the seat belt.</li>
</ul>
</div>
<h2>Rear Seat Belt Handling</h2>
<p>Place the outboard lap-shoulder belts on the rear door side trims when the rear seat belts are not in use.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>When moving a seatback, make sure the seat belts are placed on the rear door side trims so the seat belts and buckles are not caught by the seatback, seat hinge, or seat latch. This helps prevent damage to the belt system.</p>
</div>
<h2>Seat Belt Care</h2>
<p>Caring for seat belts is the same as caring for any type of regular cloth material.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not use bleach, solvent, or dyes on seat belts. Doing so may cause stains, discolouration, and strength deterioration, and the seat belt may not function properly.</p>
</div>
<h2>Shoulder Anchor Height Adjuster (Only for Front Seat)</h2>
<p>Adjust the shoulder anchor height so that the shoulder belt rides on the centre of the outboard shoulder. To move the anchor up, slide it up. To move it down, slide the anchor down while pulling the lock knob out. After adjustment, check that the anchor is securely locked.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Check that the shoulder belt is positioned on the centre of the outside shoulder. The belt should be away from your face and neck, but not falling off your shoulder. Misadjustment of the belt could reduce the effectiveness of the seat belt in a collision.</p>
</div>
</template>

<template id="tpl-seat-belt-pretensioner">
<h1>Seat Belt Pretensioner System (Only for Front Seat)</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>This section describes your Maruti Suzuki vehicle's seat belt pretensioner system. Read and follow all these instructions carefully to minimise your risk of severe injury or death.</p>
</div>
<p>Your vehicle is equipped with the seat belt pretensioner system at the front seating positions. You can confirm this by checking the label on the seat belt retractor at the bottom — if the letter "p" appears on the label, the pretensioner system is fitted. You can use the pretensioner seat belts in the same manner as ordinary seat belts.</p>
<p>Read this section together with the Supplemental Restraint System (Airbags) section to fully understand the pretensioner system.</p>
<h2>How the System Works</h2>
<p>The seat belt pretensioner system works in conjunction with the supplemental restraint system (airbags). The crash sensors and the electronic controller of the airbag system also control the seat belt pretensioners. The pretensioners are triggered only when there is a frontal or side collision severe enough to trigger the airbags and the seat belts are fastened.</p>
<p>The pretensioner is located in each front seat belt retractor. Upon activation, the pretensioner tightens the seat belt so the belt fits the occupant's body more snugly, helping reduce the risk of injury in a frontal or side collision. The retractors remain locked after the pretensioners are activated.</p>
<p>Upon activation, some noise will occur and some smoke may be released. These conditions are not harmful and do not indicate a fire in the vehicle.</p>
<p>The pretensioners along with the airbags will activate in severe frontal or side collisions. They are not designed to activate in rear impacts, roll-overs, or minor frontal side collisions.</p>
<p>The pretensioners can be activated only once. If the pretensioners are activated, have the pretensioner system serviced by a Maruti Suzuki authorised workshop as soon as possible.</p>
<h2>Proper Use</h2>
<p>The driver and all passengers must be properly restrained by fastening seat belts at all times, whether or not a pretensioner is equipped at their seating position, to minimise the risk of severe injury or death in the event of a collision.</p>
<p>Sit fully back in the seat and sit up straight; do not lean forward or sideways. Adjust the belt so the lap portion is worn low across the pelvis, not across the waist. Refer to <a onclick="navigate('front-seats')" href="javascript:void(0)">02-03 Front Seats</a> and <a onclick="navigate('seat-belts-overview')" href="javascript:void(0)">02-02 Seat Belts and Child Restraint Systems</a> for details on proper seat and seat belt adjustment.</p>
<h2>Signs of Malfunction</h2>
<p>The pretensioner system or the airbag system may not work properly if any of the following conditions occurs:</p>
<ol>
<li>The airbag warning light on the instrument cluster does not come on briefly when the engine switch is pressed to change the ignition mode to ON.</li>
<li>The airbag warning light comes on and stays on for more than 10 seconds when the engine switch is pressed to change the ignition mode to ON.</li>
<li>The airbag warning light comes on while driving.</li>
</ol>
<p>If any of these conditions occur, have both systems inspected by a Maruti Suzuki authorised workshop as soon as possible.</p>
<h2>Service Precautions</h2>
<p>Service on or around the pretensioner system components or wiring must be performed only by a Maruti Suzuki authorised workshop with specially trained staff. Improper service could result in unintended activation of pretensioners or render the pretensioner inoperative, either of which may result in personal injury.</p>
<p>Do not touch pretensioner system components or wiring. The wires are wrapped with yellow tape or yellow tubing, and the couplers are yellow.</p>
<p>To prevent damage or unintended activation of the pretensioners, check that the lead-acid battery is disconnected and the ignition mode has been in LOCK (OFF) for at least 90 seconds before performing any electrical service work on the vehicle.</p>
<h2>For Proper Operation</h2>
<p>Do not modify any parts that can affect the functionality of the seat belt pretensioner system. The seat belt may retract unexpectedly, or may not retract properly when necessary.</p>
<h2>Disposal and Scrapping</h2>
<p>Seat belt pretensioners that have not been activated must be activated according to a predetermined procedure before disposal.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you do not handle a pretensioner properly for disposal, the pretensioner system may activate unexpectedly, resulting in severe injury. When disposing of a pretensioner or scrapping a vehicle equipped with a pretensioner, consult a Maruti Suzuki authorised workshop, body repair shop, or scrap yard for assistance.</p>
</div>
</template>

<template id="tpl-seat-belt-force-limiter">
<h1>Seat Belt Force Limiter System (Only for Front Seat)</h1>
<p>The seat belt force limiter system is designed to operate together with the seat belt pretensioner system. In a frontal impact of sufficient severity, the pretensioner retracts the seat belt, and then the force limiter operates in one stage to reduce the force applied by the shoulder strap on the occupant's chest.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If the shoulder anchor or tongue plate become very hot due to heavy friction, the resin may melt and soften. This may cause the belt to malfunction in a collision. If the shoulder anchor or tongue plate shows signs of abnormal heat or damage, have the seat belt replaced at a Maruti Suzuki authorised workshop.</p>
</div>

<template id="tpl-child-restraint-systems">
<h1>Child Restraint Systems</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Always secure children in an appropriate child restraint system. Children who are not properly restrained can be severely injured in a collision or sudden braking.</li>
<li>Infants and small children should always be seated in the rear seats. If an infant or small child must be placed in the front passenger's seat, move the seat as far back as possible and ensure the child is properly secured in a child restraint system. A child restraint system used in the front seat could be struck by a deploying airbag, causing serious injury or death.</li>
<li>Never put a rear-facing child restraint system in the front passenger's seat. A deploying airbag can strike it with great force, causing serious or fatal injury to the child.</li>
<li>Always follow the child restraint system manufacturer's instructions when installing and using a child restraint system.</li>
<li>Never hold a child in your arms while in a moving vehicle. In a collision, the child can be torn from your arms and seriously injured.</li>
<li>Do not allow children to ride in the luggage area. In a collision or sudden stop, they may be seriously injured.</li>
</ul>
</div>
<h2>Types of Child Restraint Systems</h2>
<p>Child restraint systems are categorised by the age and size of the child they are designed to protect:</p>
<p><strong>Infant seat:</strong> Designed for infants from birth. Infant seats are always installed facing the rear of the vehicle. Infants should remain in a rear-facing seat as long as possible, until they reach the maximum weight or height allowed by the seat manufacturer.</p>
<p><strong>Child seat:</strong> Designed for children who have outgrown their infant seat. Child seats may be installed facing the front or rear of the vehicle, depending on the child's weight and the seat manufacturer's instructions.</p>
<p><strong>Booster seat:</strong> Designed for children who have outgrown their forward-facing child seat but are not yet large enough to use an adult seat belt safely. A booster seat raises the child so that the seat belt fits properly.</p>
