<template id="tpl-fuel-economy">
<h1>Improving Fuel Economy</h1>
<div class="box note">
<div class="box-label">Note</div>
<p>Fuel economy (mileage) of the vehicle may vary due to several factors: driving habits, gear change pattern, usage of A/C, air pressure in the tyres, wind speed, traffic conditions, fuel quality, maintenance of vehicle, road conditions, braking, etc.</p>
</div>
<h2>Keep Tyre Pressures Correct</h2>
<p>Under-inflation of the tyres can waste fuel due to increased running resistance. Keep your tyres inflated to the correct pressure shown on the label on the driver's side door or the driver's door lock pillar.</p>
<h2>Keep Weight to a Minimum</h2>
<p>The heavier the load is, the more fuel the vehicle consumes. Unload any unnecessary luggage or cargo.</p>
<h2>Avoid Excessive Idling</h2>
<p>If you park your vehicle for more than one minute, stop the engine and start it again later. When warming up a cold engine, do not allow the engine to idle or apply full throttle until the engine has reached operating temperature. Allow the engine to warm up by driving.</p>
<h2>Avoid Fast Starts, Rapid Acceleration and Hard Braking</h2>
<p><strong>Avoid fast starts:</strong> Fast starts away from lights or stop signs will consume fuel unnecessarily and shorten engine life. Start off slowly.</p>
<p><strong>Avoid unnecessary stops:</strong> Avoid unnecessary deceleration and stopping. Try to maintain a moderate, steady speed whenever possible. Slowing down and then accelerating again uses more fuel.</p>
<p><strong>Keep a steady cruising speed:</strong> Drive at a constant speed that road and traffic conditions will permit.</p>
<h2>Do not Race the Engine</h2>
<p>Revving the engine only consumes extra fuel and has no benefit.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Immediately after starting, the engine is often not yet fully warmed up. Therefore, revving the engine, starting to drive suddenly, or rapid acceleration can cause engine failure.</p>
</div>
<h2>Drive with an Appropriate Gear for Vehicle Speed</h2>
<p>Running the vehicle at a high engine rotation speed by using a low-speed gear will result in poor fuel economy. Use the correct gear according to the vehicle speed.</p>
<h2>Keep the Air Cleaner Clean</h2>
<p>If the air cleaner is clogged with dust, there will be greater intake resistance, resulting in decreased power output and increased fuel consumption.</p>
</template>

<template id="tpl-stuck-vehicle">
<h1>Stuck Vehicle</h1>
<p>If your vehicle gets stuck in snow, mud or sand, follow the directions below:</p>
<ol>
<li>Shift the transmission back and forth between "D" (Drive) and "R" (Reverse). This will create a rocking motion which may give you enough momentum to free the vehicle. Press gently on the accelerator to keep wheel spinning to a minimum wheel rpm. Remove your foot from the accelerator while shifting. Do not race the engine. Excessive wheel spin will cause the tyres to dig deeper, making it more difficult to free the vehicle.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>You may have to turn the ESP system off in order to allow spinning the wheels.</p>
</div>
<ol start="2">
<li>If your vehicle remains stuck after a few minutes of rocking, consult a Maruti Suzuki authorized workshop or a roadside assistance service. If a towing service is not available in an emergency, your vehicle may be temporarily towed by a towing cable or chain secured to the towing eye either on the front or rear of the vehicle. Refer to <a onclick="navigate('towing-eye')" href="javascript:void(0)">10-02 Towing by Using Towing Eye</a> in the "Emergency Service" section.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not continue rocking the vehicle for more than a few minutes. Prolonged rocking can cause engine overheating or transmission damage.</p>
<p><strong>WARNING:</strong></p>
<ul>
<li>Do not allow anyone to stand near the vehicle when you are rocking it, and do not spin the wheels faster than an indicated 40 km/h on the speedometer. Personal injury and/or vehicle damage may result from spinning the wheels too fast.</li>
<li>Check that your tyres are in good condition and always maintain the specified tyre pressure. Refer to <a onclick="navigate('tyres')" href="javascript:void(0)">09-13 Tyres</a> for details.</li>
<li>Do not use tyres other than those specified by Maruti Suzuki. Never use different sizes or types of tyres on the front and rear wheels. For information regarding the specified tyres, refer to the tyre information label located on the driver's door lock pillar.</li>
<li>Never use oversized tyres or special shock absorbers and springs to raise (jack up) your vehicle. This will change the handling characteristics. Oversized tyres may also rub against the fender over bumps, causing vehicle damage or tyre failure.</li>
<li>After driving through water, test the brakes while driving at a slow speed to see if they have maintained their normal effectiveness. If the brakes are less effective than normal, dry them by repeatedly applying the brakes while driving slowly until the brakes have regained their normal effectiveness.</li>
</ul>
</div>
</template>

<h2>When Spilling Drinks or Liquids</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not allow liquids to spill, splash or spray inside the vehicle. The following items could malfunction, or fire could result. In the case of spilling drinks, etc., promptly consult a Maruti Suzuki authorized workshop.</p>
<ul>
<li>SRS airbag system</li>
<li>Audio equipment</li>
<li>Electrical parts such as switches and wiring</li>
<li>Movable parts such as the gearshift lever or seat belt buckles</li>
</ul>
<p><strong>NOTICE:</strong> The sensor of the seat belt reminder is built into the front passenger's seat cushion. If you spill liquid such as soft drinks or juice, the sensor of the seat belt reminder may be damaged. If you spill any liquid on the seat cushion, immediately wipe it with a soft cloth.</p>
</div>
<h2>When Replacing Engine Oil</h2>
<p>Replace engine oil regularly:</p>
<ul>
<li>If the vehicle is normally used, replace the engine oil and filter every 10,000 km or every 12 months, whichever is earlier.</li>
<li>When the vehicle is used under severe driving conditions, the engine oil and filter replacement is required earlier.</li>

<div class="box notice">

<template id="tpl-running-in">
<h1>Running-in</h1>
<div class="box notice">
<div class="box-label">Notice</div>
<p>The future performance and reliability of the engine depends on the care and restraint exercised during its early life. It is especially important to observe the following precautions during the first 960 km of vehicle operation.</p>
<ul>
<li>After starting, do not race the engine. Warm it up gradually.</li>
<li>Avoid prolonged vehicle operation at a constant speed. Moving parts will break in better if you vary your speed.</li>
<li>Start off from a stop slowly. Avoid full throttle starts.</li>
<li>Avoid hard braking, especially during the first 320 km of driving.</li>
<li>Do not drive slowly with the transmission in a high gear.</li>
<li>Drive the vehicle at moderate engine speeds.</li>
<li>Do not tow a trailer during the first 960 km of vehicle operation.</li>
</ul>
</div>

<template id="tpl-catalytic-converter">
<h1>Catalytic Converter</h1>
<p>The purpose of the catalytic converter is to minimize the amount of harmful pollutants in your vehicle's exhaust. Use of leaded fuel in vehicles equipped with catalytic converters is prohibited, because lead deactivates the pollutant-reducing components of the catalyst system.</p>
<p>The converter is designed to last the life of the vehicle under normal usage and when unleaded fuel is used. No special maintenance is required on the converter. However, it is very important to keep the engine properly tuned. Engine misfiring, which can result from an improperly tuned engine, may cause overheating of the catalytic converter. This may result in permanent heat damage to the catalytic converter and other vehicle components.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>To minimize the possibility of catalytic converter or other vehicle damage:</p>
<ul>
<li>Maintain the engine in the proper operating condition.</li>
<li>In the event of an engine malfunction, particularly one involving engine misfire or other apparent loss of performance, have the vehicle serviced promptly.</li>
<li>Do not turn off the engine or interrupt the ignition when the transmission is in gear and the vehicle is in motion.</li>
<li>Do not try to start the engine by pushing or towing the vehicle, or coasting down a hill.</li>
<li>Do not idle the engine with any spark plug wires disconnected or removed, such as during diagnostic testing.</li>
<li>Do not idle the vehicle for prolonged periods if idling seems rough or there are other malfunctions.</li>
<li>Do not allow the fuel tank to get near the empty level.</li>
</ul>
</div>
</template>

<h1>Fuel Filler Opening</h1>
<p>The fuel filler door is located on the left rear side of the vehicle. Pull up the opener lever located on the outboard lower side of the driver's seat to unlock it. The door locks automatically when closed.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Observe the following points when refueling to prevent fire:</p>
<ul>
<li>Always stop the engine first.</li>
<li>Close all doors and windows when refueling.</li>
<li>As gasoline is highly flammable, open sparks such as lit cigarettes are strictly prohibited.</li>
</ul>
</div>
<h2>Opening and Closing the Fuel Filler Cap</h2>
<p>Turn the cap counter-clockwise to open. Turn it clockwise to close until you hear more than 2 clicks.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When refueling, the cap holder hooks onto the groove of the fuel filler cap to keep it secure while you work.</p>
</div>

<template id="tpl-refueling">
<h1>Refueling</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Observe the following points when refueling to prevent fire:</p>
<ul>
<li>Always stop the engine first.</li>
<li>Close all doors and windows when refueling.</li>
<li>As gasoline is highly flammable, open sparks such as lit cigarettes are strictly prohibited.</li>
<li>If you open the fuel filler cap suddenly, fuel may be under pressure and spray out. Loosen the cap slowly and wait for the air-deflating sound to stop before opening fully.</li>
<li>Insert the fuel filler nozzle securely into the fuel filler opening until it stops.</li>
<li>Pull the gas pump filler nozzle lever until it stops.</li>
<li>When the automatic stop function of the gas pump nozzle activates, stop refueling. Do not continue to fill beyond this point.</li>
<li>If fuel spills out, wipe it off immediately with a soft cloth. Spilled fuel can cause paint staining, discoloration, or cracking, and is a fire hazard.</li>
<li>After refueling, close the fuel filler cap until you hear more than 2 clicks.</li>
<li>Fuel contains substances harmful to the human body. Do not breathe in vaporized fuel.</li>
<li>Follow all warnings posted at the gas station.</li>
</ul>
</div>
<h2>At a Self-Service Gas Station</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Before opening the fuel filler cap, discharge any static electricity by touching a metal part of the vehicle body or the gas pump machine. Do not re-enter the vehicle while refueling, as static electricity may re-accumulate in your body. Do not allow others who have not discharged their static electricity to come near the fuel filler opening.</p>
<p><strong>NOTE:</strong> Take special care when the air is dry, as this increases the likelihood of static electricity buildup. Wearing multiple layers of clothing can also generate static electricity through fiber friction.</p>
</div>
<h2>Use Unleaded Gasoline Only</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Using leaded gasoline, low-quality gasoline, or other fuel types such as alcohol or diesel can cause harmful effects to the engine and fuel delivery system. Use only unleaded gasoline.</p>
</div>
</template>

<template id="tpl-interior-light">
<h1>Interior Light</h1>
<p>Your vehicle has several interior lights: footwell lights, front and center overhead lights, a luggage compartment light, door ambient lights, and a vanity mirror light.</p>
<h2>Footwell Lights</h2>
<p>A footwell light is provided in the leg space in front of each front seat. The light comes on when a door is opened. After all doors are closed, it remains on for about 15 seconds and then fades out. If the ignition is changed to ACC or ON during this time, the light begins to fade out immediately. After changing the ignition to LOCK (OFF), the light turns on for about 15 seconds and then fades out.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When the ignition is LOCK (OFF) and a door is left open, the light will automatically turn off after about 15 minutes to prevent battery discharge.</p>
</div>
<h2>Instrument Panel Assistant Ornament Ambient Light (if equipped)</h2>
<p>This light illuminates the design patterns on the panel on the front passenger seat side.</p>
<ul>
<li>When you unlock the door, the light comes on for 15 seconds.</li>
<li>When you open the door, the light remains on for 15 minutes.</li>
<li>With the ignition in LOCK (OFF), if you close the door, the light turns on for 15 seconds and then fades out.</li>
<li>When all doors are closed, the ignition is ON, and exterior lights are off, the light comes on at 100% brightness.</li>
<li>When all doors are closed, the ignition is ON, and exterior lights are on, the brightness can be adjusted.</li>
<li>When the ignition is ON, you can turn the light off/on, change the colour, and adjust brightness.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>You can change the ambient light settings from the Ambient Lighting screen on the infotainment unit.</p>
</div>
<h2>Front Interior Light</h2>
<p>The front interior light switch (located on the light unit itself) has the following positions:</p>
<p><strong>ON:</strong> The light stays on regardless of whether a door is open or closed.</p>
<p><strong>DOOR:</strong> The light comes on when a door is opened. After all doors are closed, it remains on for about 15 seconds and then fades out. If the ignition is changed to ACC or ON during this time, the light begins to fade immediately. After the ignition is changed to LOCK (OFF), the light turns on for about 15 seconds and fades out.</p>
<p><strong>OFF:</strong> The light remains off even when a door is opened.</p>
<p><strong>Spot light:</strong> When the switch is in DOOR or OFF position, press the switch to turn on the spot light. Press again to turn it off.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The light will turn off automatically after a set period when left illuminated, to prevent battery discharge.</li>
<li>The light will automatically turn off when all of the following are true: the ignition is LOCK (OFF), the hazard warning lights, position lights, and headlights are all off, and 15 minutes have passed since the light was turned on.</li>
<li>For a short while after the ignition is changed to LOCK (OFF), the light may not come on even if the switch is turned on. This is normal behavior to prevent battery discharge.</li>
</ul>
</div>
<h2>Center Light</h2>
<p>The center interior light has a push-type switch. Press to turn on; press again to turn off.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When the ignition is LOCK (OFF) and a door is left open, the light will automatically turn off after about 15 minutes to prevent battery discharge.</p>
</div>
<h2>Luggage Compartment Light (if equipped)</h2>
<p>When the tailgate is opened with the luggage compartment light switch in the ON position, the light comes on for about 15 minutes. When the switch is in the OFF position, the light remains off regardless of whether the tailgate is open or closed.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>To prevent battery discharge, do not leave the luggage compartment light on longer than necessary.</p>
</div>
<h2>Door Ambient Light (if equipped)</h2>
<p>A door ambient light illuminates the door handle area inside the vehicle.</p>
<ul>
<li>When you unlock the door, the light comes on for 15 seconds.</li>
<li>When you open the door, the light remains on for 15 minutes.</li>
<li>With the ignition in LOCK (OFF), if you close the door, the light turns on for 15 seconds and then fades out.</li>
<li>When all doors are closed, the ignition is ON, and exterior lights are off, the light comes on at 100% brightness.</li>
<li>When all doors are closed, the ignition is ON, and exterior lights are on, the brightness can be adjusted.</li>
<li>When the ignition is ON, you can turn the light off/on, change the colour, and adjust brightness.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>You can change the door ambient light settings from the Ambient Lighting screen on the infotainment unit.</p>
</div>
<h2>Vanity Mirror Light (if equipped)</h2>
<p>The vanity mirror light comes on when the mirror cover on the sun visor is opened.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>To prevent battery discharge, do not leave the vanity mirror light on for extended periods.</p>

<template id="tpl-wireless-charger">
<h1>Wireless Charger</h1>
<p>The wireless charger supports smartphones that are Qi 1.3 certified (see the Wireless Power Consortium website for a certified product list). It uses inductive charging technology, which is less efficient than wired charging and may cause the device to run warmer than usual.</p>
<h2>Using the Wireless Charger</h2>
<ol>
<li>Place your Qi-certified smartphone at the centre of the charging area with its charging surface facing down.</li>
<li>Close all doors (including the tailgate) and change the ignition to ACC or ON to activate the charger.</li>
<li>Keep the charging area completely clean and free of foreign objects such as coins, metal, paper, pins, or dust — between the phone, the charger surface, and the air vent.</li>
<li>For best results, remove the phone cover or case before charging.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Do not operate your smartphone while charging and driving.</li>
<li>Do not use the wireless charger with a smartphone larger than the charging area.</li>
<li>Do not spill liquid on the charger or clean it with any liquid or cleaning agent.</li>
<li>Do not bring precision instruments such as wristwatches close to the charger, as they may malfunction.</li>
<li>Do not use the wireless charger for extended periods with the engine off, as prolonged charging in this condition may impact battery health.</li>
<li>If your device becomes unusually hot while charging, remove it from the charger immediately.</li>
<li>Do not place external objects on the charger or spill liquid on it or the phone, as this may cause fire, equipment failure, or burns.</li>
<li>Do not bring magnetic cards (such as credit cards) or magnetic recording media close to the charger while it is in use — data may be erased due to magnetic interference.</li>
<li>The wireless charger supports only one smartphone at a time.</li>
<li>Charging performance may vary by phone type and background apps. Charging will resume automatically once the temperature returns to the operating range.</li>
</ul>
</div>

<p><strong>CAUTION:</strong> Handle the luggage board carefully when removing or installing, as careless handling may cause injury.</p>

<template id="tpl-roof-rails">
<h1>Roof Rails</h1>
<p>The roof rails can be used to attach an optional roof rack, available from a Maruti Suzuki authorised workshop. If using a roof rack, follow the instructions provided with it in addition to the precautions below.</p>
<h2>Loading on a Roof Rack</h2>
<ul>
<li>Check that the roof rack is securely installed before use.</li>
<li>To mount cargo such as skis or bicycles, use suitable attachments available from a Maruti Suzuki authorised workshop. Do not mount cargo directly on the roof panel.</li>
<li>The maximum permissible gross weight of the roof rack plus cargo is <strong>75 kg</strong>. Do not exceed this limit, and ensure the gross vehicle weight does not exceed the GVWR listed in the Specifications section.</li>
<li>Mount the heaviest items at the bottom and distribute cargo as evenly as possible.</li>
<li>Secure the front and rear ends of long items such as wood panels and surfboards to both the front and rear of the vehicle. Protect painted surfaces from scuffing caused by tie-down ropes.</li>
<li>Do not carry large items that hang over the bumpers or the sides of the vehicle, as they may block your view.</li>
<li>Check periodically that cargo is securely fastened and that the roof rack is free from damage.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Abrupt manoeuvres or improperly secured cargo can allow cargo to fly off the vehicle and hit others, causing personal injury or property damage. Avoid jackrabbit starts, sharp turns, fast cornering, and sudden braking when carrying roof cargo.</li>
<li>Large, bulky, long, or flat items can affect vehicle aerodynamics or be caught by the wind, reducing vehicle control and risking an accident. Drive cautiously at a reduced speed when carrying this type of cargo.</li>
</ul>

<template id="tpl-hvac">
<h1>Heating and Air Conditioning System</h1>
<p>Your vehicle has the following air outlets: windshield defroster outlet, side defroster outlet, side outlet, center outlet, floor outlet, and rear outlet.</p>
<h2>Adjusting the Center Outlet</h2>
<p>Move the knob on the center outlet vertically or horizontally to adjust the direction of airflow.</p>
<h2>Adjusting the Side and Rear Outlets</h2>
<p>Move the direction knob vertically or horizontally to adjust the airflow direction. Use the dial to open or close the outlet:</p>
<ul>
<li><strong>Side outlet:</strong> Turn the dial upward to open; downward to close.</li>
<li><strong>Rear outlet:</strong> Move the dial to the right to open; to the left to close.</li>
</ul>
<p>When open, air comes out of the side and rear outlets regardless of the air flow selector position.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Prolonged exposure to hot air from the heater or air conditioner could result in low-temperature burns. All vehicle occupants — particularly children, the elderly, those with special needs, individuals with delicate skin, and sleeping individuals — should maintain sufficient distance from the air outlets.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>To quickly clear fog from the front door windows, direct airflow from the side outlets toward them.</li>
<li>Airflow from the rear outlet can be increased by fully moving the center outlet knob to the inner side.</li>
</ul>
</div>
</template>

<template id="tpl-auto-hvac">
<h1>Automatic Heating and Air Conditioning System (Climate Control)</h1>
<p>The climate control system maintains a set cabin temperature automatically by controlling the blower speed, air intake, and air flow. The controls are labelled as follows: (1) Temperature selector, (2) Blower speed selector, (3) Air intake selector, (4) Air flow selector, (5) Defrost switch, (6) Air conditioning switch, (7) OFF switch, (8) AUTO switch, (9) Display.</p>
<h2>Temperature Selector (1)</h2>
<p>Push the upper part to increase and the lower part to decrease the set temperature. The selected temperature appears on the display. When "HI" or "LO" appears, the system is operating at maximum heating or cooling — the outlet air temperature may change suddenly at these settings, but this is normal.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>The temperature unit (°C/°F) can be changed from the information display. Refer to <a onclick="navigate('instrument-cluster-overview')" href="javascript:void(0)">04-00 Instrument Cluster</a> for details.</p>
</div>
<h2>Blower Speed Selector (2)</h2>
<p>Press to turn on the blower and select the speed. In AUTO mode, blower speed is controlled automatically.</p>
<h2>Air Intake Selector (3)</h2>
<p>Press to toggle between the two modes:</p>
<p><strong>Recirculated Air:</strong> Inside air is recirculated. The indicator light turns on. Use this when driving through polluted air (e.g. tunnels), to cool the cabin quickly, or to reduce unwanted odours from entering.</p>
<p><strong>Fresh Air:</strong> Outside air is introduced. The indicator light turns off.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Do not use recirculated air for extended periods — the cabin air may become stale and windows may mist. Switch to fresh air whenever possible.</p>
</div>
<h2>Air Flow Selector (4)</h2>
<p>Press to cycle through the following modes. The selected mode appears on the display. In AUTO mode, the air flow is controlled automatically — but will not automatically switch to the defrost position.</p>
<p><strong>Ventilation (c):</strong> Temperature-controlled air from the center, side, and rear outlets.</p>
<img src="ac-airflow-ventilation.png" alt="Ventilation airflow mode">
<p><strong>Bi-level (d):</strong> Temperature-controlled air from the floor outlets, and cooler air from the center, side, and rear outlets. When the temperature selector is at fully COLD or fully HOT, both sets of outlets deliver air at the same temperature.</p>
<img src="ac-airflow-bilevel.png" alt="Bi-level airflow mode">
<p><strong>Heat (e):</strong> Temperature-controlled air from the floor outlets and side outlets; air also comes from the windshield defroster outlets, and slightly from the side defroster outlets.</p>
<img src="ac-airflow-heat.png" alt="Heat airflow mode">
<p><strong>Heat and Defrost (f):</strong> Temperature-controlled air from the floor outlets, windshield defroster outlets, side defroster outlets, and side outlets. Use this to simultaneously warm the cabin and clear the windshield.</p>
<img src="ac-airflow-heat-defrost.png" alt="Heat and defrost airflow mode">
<h2>Defrost Switch (5)</h2>
<p>Push to activate the defroster. The indicator light turns on. Air comes from the windshield defroster outlets, side defroster outlets, and side outlets. When activated, the AC system turns on and fresh air mode is selected automatically (in very cold weather, the AC system will not turn on).</p>
<img src="ac-airflow-defrost.png" alt="Defrost airflow mode">
<div class="box note">
<div class="box-label">Note</div>
<p>Extended use of cool air in Defrost or Heat and Defrost mode may cause the outside of the windows to fog due to the temperature difference between the cabin and outside air. Avoid using the cooling function in these positions.</p>
</div>
<h2>Air Conditioning Switch (6)</h2>
<p>Push to turn the air conditioning system on or off (only works when the blower is running). The indicator light shows its status. When the AC is off, the climate control system cannot lower the cabin temperature below the outside temperature.</p>
<h2>OFF Switch (7)</h2>
<p>Turns the climate control system off entirely.</p>
<h2>Automatic Operation</h2>
<ol>
<li>Start the engine.</li>
<li>Push the AUTO switch (8).</li>
<li>Set the desired temperature using the temperature selector (1).</li>
</ol>
<p>The system will automatically control blower speed, air intake, and air flow to maintain the set temperature.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Selecting recirculated air mode deactivates the automatic operation of the AUTO switch. You can still manually turn the AC on or off using switch (6) regardless of AUTO mode.</p>
</div>
<h2>When the Engine Stops Automatically (ENG A-STOP)</h2>
<p>When the engine stops automatically, the air conditioner switches to the ventilation position.</p>
<ul>
<li>If cooling or heating performance becomes insufficient, press the ENG A-STOP OFF switch to restart the engine.</li>
<li>If the windshield or door windows fog while the engine is stopped, deactivate ENG A-STOP to restart the engine, then set the air flow selector to Heat and Defrost or Defrost to clear the windows.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Do not place anything on the instrument panel that may cover the defrost air outlets — this will obstruct airflow and prevent the windshield from defogging. Remove snow and ice from the outside of windows before driving.</p>
</div>
<h2>Preventing and Clearing Window Fog</h2>
<p>When outside temperature and humidity are high (e.g. in summer), fog may form on the outside of the windshield:</p>
<ul>
<li>Switch on the windshield wipers.</li>
<li>Increase the cabin temperature using the temperature selector (1).</li>
<li>Reduce blower speed using the blower speed selector (2).</li>
</ul>
<h2>Maintenance</h2>
<p>To maintain optimum performance and durability, run the air conditioner for at least one minute per month with the engine idling, even during winter. This circulates the refrigerant and oil and protects the internal components.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Use R-134a refrigerant only. Do not mix or replace it with other refrigerants, as this may damage the air conditioning system.</p>
</div>
</template>

<template id="tpl-suzuki-connect">
<h1>Suzuki Connect</h1>
<p>Suzuki Connect is an advanced telematics solution that provides connected car features including vehicle alerts and notifications, safety and security functions, trip tracking, and remote vehicle operation.</p>
<p>For full details on feature availability, terms and conditions, FAQs, the Suzuki Connect app manual, and contact information, refer to the Maruti Suzuki website.</p>
<h2>Remote AC</h2>
<p>The Remote AC feature allows you to set the cabin temperature remotely (18–32 °C) for up to 10 minutes to pre-condition the car before you board. You can also turn the defroster and rear defogger on or off remotely. The remote request is authenticated through your preset mPIN after your consent is given.</p>
<p>The feature can be operated from the Suzuki Connect app, a compatible smartwatch, or the Suzuki Connect skill for Amazon Alexa.</p>
<h3>Operating Conditions</h3>
<p>The Remote AC request will only be processed when <strong>all</strong> of the following conditions are met:</p>
<ul>
<li>Ignition is OFF</li>
<li>Parking brake is engaged</li>
<li>All doors are locked properly</li>
<li>Hood is closed properly</li>
<li>Brake pedal is not depressed</li>
<li>Gearshift lever is in "P" (Park) position</li>
<li>Key fob is not detected inside the vehicle</li>
<li>Steering lock is engaged</li>
<li>Vehicle is in a good cellular network area</li>
<li>Less than 9 days have passed since the last ignition OFF</li>
<li>No malfunction was present in the vehicle before ignition OFF</li>
</ul>
<h3>Terminating Conditions</h3>
<p>The Remote AC session will end if any of the following occur:</p>
<ul>
<li>Telematics device loses communication with the vehicle</li>
<li>Battery voltage is low</li>
<li>Any door, hood, or tailgate is opened</li>
<li>Key fob is detected inside the vehicle</li>
<li>Vehicle moves or ignition is turned ON</li>
<li>Brake pedal is applied</li>
<li>Gearshift lever is moved out of "P"</li>
<li>AC malfunction is detected</li>
<li>Engine stalls</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Accumulation of exhaust gases in an enclosed area may cause serious health issues or death. Ensure there are no passengers in the vehicle before using this feature. Park only in areas where it is safe to use, and avoid enclosed spaces such as garages or multi-level car parks. Ensure ventilation openings and the exhaust muffler are not blocked. Do not use if flammable material such as dry leaves or oil is near the vehicle, and do not use if the vehicle is covered with a body cover.</li>
<li>Never use this feature when there are passengers in the vehicle. The sudden engine start, change in cabin temperature, and unexpected operation may cause anxiety, panic, or discomfort.</li>
<li>Never use this feature while the vehicle is under inspection or maintenance at a service centre or fuel station. A sudden engine start during maintenance is a safety hazard.</li>
</ul>
<p><strong>CAUTION:</strong></p>
<ul>
<li>The following may activate as a side effect of Remote AC: windscreen wipers (if left in ON position), audio system.</li>
<li>The desired temperature may not be achieved if any window is open.</li>
</ul>
<p><strong>NOTICE:</strong></p>
<ul>
<li>Do not use this feature on public roads.</li>
<li>Depending on local regulations, idling may be prohibited or restricted. Check before use.</li>
<li>Use the feature only when you are ready to board promptly, for effective fuel efficiency.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>Application services are subject to change. Install the latest updates from the Google Play Store or Apple App Store for the best experience.</li>
<li>Application functioning depends on network availability and smartphone hardware and OS performance.</li>
</ul>
</div>
</template>

<template id="tpl-vehicle-loading">
<h1>Vehicle Loading</h1>
<p>Your vehicle was designed for specific weight capacities. The weight capacities of your vehicle are indicated by the Gross Vehicle Weight Rating (GVWR) and the Permissible maximum Axle Weight (PAW, front and rear). The GVWR and PAW are listed in the <a onclick="navigate('specs-overview')" href="javascript:void(0)">Specifications</a> section.</p>
<p><strong>GVWR</strong> – Maximum permissible overall weight of the fully loaded vehicle (including all occupants, accessories and cargo, plus the trailer nose weight if towing a trailer).</p>
<p><strong>PAW (Front and Rear)</strong> – Maximum permissible weight on an individual axle.</p>
<p>For the K15C A/T (your vehicle):</p>
<table>
<thead>
<tr><th>Parameter</th><th>Value</th></tr>
</thead>
<tbody>
<tr><td>Gross Vehicle Weight Rating (GVWR)</td><td>1685 kg</td></tr>
<tr><td>Permissible maximum Axle Weight – Front (PAW)</td><td>895 kg</td></tr>
<tr><td>Permissible maximum Axle Weight – Rear (PAW)</td><td>915 kg</td></tr>
</tbody>
</table>
<p>Actual weight of the loaded vehicle and actual loads at the front and rear axles can only be determined by weighing the vehicle. Compare these weights to the GVWR and PAW. If the gross vehicle weight or the load on either axle exceeds these ratings, you must remove enough weight to bring the load down to the rated capacity.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never overload your vehicle. The gross vehicle weight (sum of the weights of the vehicle, all occupants, accessories and cargo, plus trailer nose weight if towing) must never exceed the GVWR. In addition, never distribute a load so that the weight on either the front or rear axle exceeds the PAW.</li>
<li>Always distribute cargo evenly. To avoid personal injury or damage to your vehicle, always secure cargo to prevent it from shifting if the vehicle moves suddenly. Place heavier objects on the floor and as far forward in the cargo area as possible. Never pile cargo higher than the top of the seat backs.</li>
</ul>
</div>
</template>

<p><strong>Recommended grade:</strong> SAE 0W-16 (preferred — best for fuel economy and cold-weather starting)</p>
<p><strong>Quality classification:</strong> API SN or SP</p>

</tbody>
</table>
<h2>Oil Level Check</h2>
<p>Check the oil level with the vehicle on a level surface. The reading will be inaccurate if the vehicle is on a slope.</p>
<p>Check either <strong>before starting the engine</strong> or at least <strong>5 minutes after stopping</strong> the engine.</p>
<ol>
<li>Pull out the oil dipstick and wipe it clean with a cloth.</li>
<li>Reinsert the dipstick all the way into the engine.</li>
<li>Pull it out again and read the level.</li>
<li>The oil should be between the <strong>Upper</strong> and <strong>Lower</strong> marks on the dipstick.</li>
<li>If the level is near the Lower mark, add enough oil to bring it up to the Upper mark.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Failure to check the oil level regularly could lead to serious engine trouble due to insufficient oil.</p>
</div>
<h2>Service Tasks — Workshop Only</h2>
<p>The following require special procedures and must be performed at a Maruti Suzuki authorised workshop:</p>
<ul>
<li>Refilling with oil</li>
<li>Changing engine oil</li>
<li>Oil filter replacement</li>
<li>Oil leakage check</li>
</ul>

<template id="tpl-engine-coolant">
<h1>Engine Coolant</h1>
<h2>Specified Coolant — K15C Engine</h2>
<p><strong>Coolant colour: Blue</strong></p>
<p>Use Maruti Suzuki genuine coolant or equivalent. This coolant maintains proper engine temperature and protects against freezing, boiling, corrosion, and rust.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>To avoid damaging your cooling system:</p>
<ul>
<li>Mix ratio must be <strong>50/50 coolant to distilled water</strong>. Do not exceed 50/50 concentration — higher concentrations cause overheating.</li>
<li>Do not use straight coolant or plain water.</li>
<li>Do not add extra inhibitors or additives — they may be incompatible with the cooling system.</li>
<li>Do not mix different types of base coolants — this can accelerate seal wear and cause severe overheating or transmission damage.</li>
<li>The coolant supplied is already pre-diluted. Do <strong>not</strong> dilute further with distilled water.</li>
</ul>
</div>
<h2>Maintenance Schedule</h2>
<table>
<thead>
<tr><th>Item</th><th>First replacement</th><th>Subsequent replacements</th></tr>
</thead>
<tbody>
<tr><td>Engine coolant (SUZUKI LLC Super Blue)</td><td>100,000 km or 60 months (whichever first)</td><td>Every 40,000 km or 24 months (whichever first)</td></tr>
</tbody>
</table>
<h2>Coolant Level Check</h2>
<p>Check the coolant level at the <strong>reservoir tank</strong>, not at the radiator. Do this with the engine cool.</p>
<p>The level should be between the <strong>FULL</strong> and <strong>LOW</strong> marks on the reservoir tank.</p>
<h2>Adding Coolant</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Swallowing engine coolant can cause severe injury or death. Inhaling coolant mist or vapours or getting coolant in your eyes could result in severe injury.</p>
<ul>
<li>Do not drink antifreeze or coolant solution. If swallowed, do not induce vomiting — contact a poison control centre or a physician immediately.</li>
<li>Avoid inhaling coolant mist or hot vapours. If inhaled, move to fresh air.</li>
<li>If coolant gets in the eyes, flush with water and seek medical attention.</li>
<li>Wash thoroughly after handling coolant.</li>
<li>Keep coolant out of reach of children and pets.</li>
</ul>
</div>
<p>If the coolant level is below the <strong>LOW</strong> mark:</p>
<ol>
<li>Ensure the engine is cool before proceeding.</li>
<li>Remove the reservoir tank cap, aligning the marks on the cap and tank.</li>
<li>Add coolant until the level reaches the <strong>FULL</strong> mark.</li>
<li>Never fill above the <strong>FULL</strong> mark.</li>
<li>When replacing the cap, line up the mark on the cap with the mark on the tank to avoid coolant leakage.</li>
</ol>
<h2>Coolant Replacement</h2>
<p>Since special procedures are required, have coolant replacement done at a Maruti Suzuki authorised workshop.</p>
</template>

<h2>Clutch Pedal Play</h2>
<p>The clutch pedal play is the distance the pedal moves freely before you feel slight resistance. Measure it by pushing the pedal gently by hand.</p>
<p><strong>Maximum allowed play: 10 mm</strong></p>
<p>If the play exceeds 10 mm, or if clutch dragging is felt with the pedal fully depressed, have the clutch inspected at a Maruti Suzuki authorised workshop.</p>
<h2>Clutch Fluid</h2>
<p>Clutch fluid is supplied from the brake fluid reservoir. Check the pedal for smooth operation and fluid level periodically.</p>
<p>If the fluid level is near the <strong>MIN</strong> line, top it up to the <strong>MAX</strong> line using <strong>Brake Fluid DOT3</strong>.</p>
<div class="box notice">
<div class="box-label">Notice</div>

<p><strong>Brake fluid:</strong> Replace every 40,000 km or 24 months, whichever comes first.</p>
<h2>Brake Fluid</h2>
<p>Check the brake fluid level by looking at the reservoir in the engine compartment. The level should be between the <strong>MAX</strong> and <strong>MIN</strong> marks.</p>
<p><strong>Specified fluid: Brake Fluid DOT3</strong>. Do not use reclaimed fluid or fluid stored in old or open containers. Keep foreign particles and other liquids out of the reservoir.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Failure to follow these guidelines can result in personal injury or serious brake system trouble.</p>
<ul>
<li>If the brake warning light comes on (with engine running and parking brake fully disengaged), immediately ask a Maruti Suzuki authorised workshop to inspect the brake system.</li>
<li>A rapid fluid loss indicates leakage in the brake system — get it inspected immediately.</li>
<li>Brake fluid is harmful or fatal if swallowed or if it comes in contact with skin or eyes. If swallowed, do not induce vomiting — contact a poison control centre or physician immediately. If it gets in eyes, flush with water and seek medical attention. Wash thoroughly after handling. Keep out of reach of children and animals.</li>
</ul>
<p>[!notice]</p>
<ul>
<li>If the brake fluid level is near the MIN line, there is a possibility of brake pad/shoe wear or fluid leakage. Ask a Maruti Suzuki authorised workshop to inspect the brake system.</li>
<li>Brake fluid can damage painted surfaces — be careful when refilling the reservoir.</li>
<li>Brake fluid absorbs water over time. Fluid with high water content can cause vapour lock or brake system malfunction. Replace per the maintenance schedule.</li>
</ul>
</div>
<h2>Brake Pedal</h2>
<p><strong>Minimum distance between brake pedal and floor carpet "a": 52 mm (K15C)</strong></p>
<p>To check: with the engine running, press the pedal with approximately 30 kg of force and measure the distance between the pedal and the floor carpet. Do not include floor mat or rubber in the measurement. Measure at the side of the pedal facing the driver's door.</p>
<p>The brake system is self-adjusting — no pedal adjustment is needed. If the distance is less than the minimum, have the vehicle inspected at a Maruti Suzuki authorised workshop.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If the brake pad lining has worn to minimum thickness, a squealing noise will sound during braking. Have the vehicle inspected immediately at a Maruti Suzuki authorised workshop. Continued driving with this condition can cause an accident.</p>
<p>[!caution] Have the vehicle inspected immediately if you notice any of the following:</p>
<ul>
<li>Poor braking performance</li>
<li>Uneven braking (brakes not working uniformly on all wheels)</li>
<li>Excessive pedal travel</li>
<li>Brake dragging</li>
</ul>
</div>
<h2>Parking Brake Lever (if equipped)</h2>
<p>Check for proper adjustment by counting the ratchet clicks as you slowly pull the lever to full engagement.</p>

<p>If the brake is not properly adjusted, or if brake drag is suspected after the lever is fully released, have the parking brake inspected and/or adjusted at a Maruti Suzuki authorised workshop.</p>
<h2>Brake Discs</h2>

</tbody>

<h2>Tyre Pressure</h2>
<p><strong>Recommended pressure: 33 PSI (228 kPa)</strong></p>
<p>Check the tyre pressure specifications on the Tyre Information Label inside your vehicle. Both front and rear tyres should have the specified pressure.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Always check tyre pressure when the tyres are cold — readings taken after driving will be inaccurate. Never under-inflate or over-inflate.</p>
<ul>
<li>Under-inflation can cause unusual handling, cause the rim to slip on the tyre bead, and result in an accident or damage to the tyre or rim.</li>
<li>Over-inflation can cause the tyre to burst and result in personal injury, and also causes unusual handling.</li>
</ul>
</div>
<p>Note that tyre pressure changes with temperature and atmospheric conditions. If you check tyres after driving (when warm), add 1 kPa for every 0.8°C difference between garage temperature and outside temperature. If inflated in a warm garage and then driven in cold weather, pressure may fall below specification.</p>
<h2>Tyre Inspection</h2>
<p>Inspect tyres at least once a month or before any long trip. Check the following:</p>
<ol>
<li>Measure air pressure with a tyre gauge and adjust if necessary.</li>
<li>Check that tread groove depth is more than <strong>1.6 mm</strong>. Tyres have moulded-in tread wear indicators (marked by a triangular TWI symbol on the sidewall). When these indicators appear flush with the tread surface, the remaining depth is 1.6 mm or less — replace the tyre immediately.</li>
<li>Check for abnormal wear, cracks and damage. Replace any tyre with cracks or other damage. Have abnormally worn tyres inspected at a Maruti Suzuki authorised workshop.</li>
<li>Check for loose wheel nuts.</li>
<li>Check that there are no nails, stones, or other objects stuck in the tyres.</li>
</ol>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Hitting curbs and running over rocks can damage tyres and affect wheel alignment. Have tyres and wheel alignment checked periodically at a Maruti Suzuki authorised workshop.</p>
<p>[!warning] Never mix tyres of different size or type on the four wheels. Use only wheel and tyre combinations approved by Maruti Suzuki as standard or optional equipment. Replacing tyres with a different size may result in false speedometer or odometer readings.</p>
</div>
<h2>Tyre Rotation</h2>
<p>Rotate tyres every <strong>10,000 km</strong> to avoid uneven wear and prolong their life. After rotation, adjust front and rear tyre pressures to the specification on the Tyre Information Label.</p>
<img src="tyre-rotation-diagram.png" alt="Tyre rotation diagrams">
<p>The circle in the 5-tyre rotation diagram represents the spare tyre.</p>
<h2>Wheel Balancing</h2>
<p>If the vehicle vibrates abnormally on a smooth road, have the wheel balanced at a Maruti Suzuki authorised workshop.</p>
<h2>Wheel Alignment</h2>
<p>In case of abnormal tyre wear or pulling towards one side, have the wheel aligned at a Maruti Suzuki authorised workshop.</p>
<h2>Tubeless Tyres</h2>
<p>The Victoris is equipped with tubeless tyres. A thin layer of butyl rubber lines the inside of the tyre to prevent air loss. Air pressure is maintained by the seal between the tyre bead and wheel rim. Tubeless tyres have the advantage of slow air loss and prevention of sudden deflation while driving.</p>
<p>Care and maintenance tips:</p>
<ol>
<li>Always maintain recommended inflation pressure. Driving continuously at low pressure can lead to tyre damage.</li>
<li>If any leakage is found, check for nail penetration, valve core damage, or a bent rim. A damaged wheel must not be used.</li>
<li>If the tyre has run at low pressure, have it inspected for any defect.</li>
<li>Whenever a new tyre is fitted, replace the valve.</li>
<li>For continuous high-speed driving, increase tyre pressure by 5 PSI over the recommended inflation pressure.</li>
<li>Never run the tyre beyond TWI (Tread Wear Indicator). Replace when the remaining tread has worn to this point.</li>
<li>Always use a tubeless tyre mounting machine — manual mounting can damage the tyre or wheel rim.</li>
<li>In case of any problem, contact a Maruti Suzuki authorised workshop.</li>
</ol>
</template>

</tbody>
</table>
<div class="box warning">
<div class="box-label">Warning</div>
<p>When checking or servicing the battery, disconnect the negative cable first. Do not cause a short circuit by allowing metal objects to contact the battery posts and the vehicle at the same time. Batteries produce flammable hydrogen gas — keep flames and sparks away. Never smoke when working near the battery. Diluted sulphuric acid spilled from the battery can cause blindness or severe burns. Use proper eye protection and gloves. Flush eyes or body with ample water and get medical care immediately if affected. Keep batteries out of reach of children.</p>
</div>
<h2>Battery Types</h2>
<p><strong>Maintenance-free (cap-less) battery:</strong> No need to add water.</p>
<p><strong>Traditional battery (with water filler caps):</strong> The battery solution level must be kept between the <strong>MAX (1)</strong> and <strong>MIN (2)</strong> lines at all times. Periodically check the battery, battery terminals, and battery hold-down bracket for corrosion. Remove corrosion using a stiff brush with ammonia mixed with water, or baking soda mixed with water. Rinse with clean water after.</p>
<p>If the battery liquid level falls below the centre of the MAX–MIN range, add distilled water until it reaches the MAX (1) line.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not use the battery if the level is below the MIN line (2) — this may cause reduced battery life, exothermic heat, or an explosion from hydrogen gas. Do not add battery liquid above the MAX line (1) — overfilling may cause liquid to leak or spray during charging.</p>
</div>
<h2>Keeping the Battery Charged</h2>
<p>The lead-acid battery and lithium-ion battery (if equipped) discharge gradually. To avoid a flat battery, drive the vehicle at least once a month for at least 30 minutes to recharge it.</p>
<p>If the vehicle will not be driven for a month or longer, disconnect the cable from the negative terminal to help prevent discharge.</p>
<h2>Battery Replacement</h2>
<img src="battery-replacement-diagram.png" alt="Battery replacement diagram">
<p><strong>(1)</strong> Negative cable — <strong>(2)</strong> Positive cable — <strong>(3)</strong> Retainer nuts — <strong>(4)</strong> Retainer</p>
<p><strong>To remove the battery:</strong></p>
<ol>
<li>Disconnect the negative cable (1).</li>
<li>Disconnect the positive cable (2).</li>
<li>Remove the retainer nuts (3) and remove the retainer (4).</li>
</ol>
<p><strong>To install the battery:</strong></p>
<ol>
<li>Install the battery in the reverse order of removal.</li>
<li>Tighten the bracket bolt and battery cables securely.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>When the battery is disconnected, some vehicle functions will be initialised and/or deactivated. These functions will need to be reset after the battery is reconnected.</li>
<li>Do not disconnect the battery terminals for at least one minute after the engine is switched off or the ignition mode is changed to LOCK (OFF).</li>
<li>If your vehicle is equipped with the ENG A-STOP system, only use the specified battery type for that system. Refer to <a onclick="navigate('specs-overview')" href="javascript:void(0)">12-00 Specifications</a> for details. Otherwise, the ENG A-STOP system may not function — consult a Maruti Suzuki authorised workshop.</li>
</ul>
<p>[!warning] Batteries contain toxic substances including sulphuric acid and lead. Used batteries must be disposed of or recycled according to applicable rules and regulations — do not dispose of with ordinary household trash. Do not tip the battery over when removing it from the vehicle, as sulphuric acid could spill and cause injury.</p>
</div>

<li>Wear gloves and a long-sleeved shirt when replacing bulbs to avoid cuts from sharp-edged parts.</li>

<template id="tpl-towing-truck">
<h1>Towing by Tow Truck</h1>
<p>If you need to have your vehicle towed, contact a professional service. A Maruti Suzuki authorized workshop can provide you with detailed towing instructions.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>For vehicles equipped with Dual Sensor Brake Support II (DSBS II), if your vehicle is towed with the engine on, press the DSBS II OFF switch and turn off the system. If not, an accident related to the system being turned on may occur.</p>
<p><strong>NOTICE:</strong> The following may indicate a problem with your transmission. Contact your Maruti Suzuki authorized workshop or a commercial towing service before towing:</p>
<ul>
<li>The hybrid system warning message is shown on the multi-information display and the vehicle does not move.</li>
<li>The vehicle makes an abnormal sound.</li>
</ul>
</div>
<h2>Electric Parking Brake Malfunction</h2>
<p>If the electric parking brake malfunctions and cannot be released, the vehicle must be towed using one of the following methods:</p>
<ul>
<li>With all four wheels on a flat-bed truck.</li>
<li>With the front or rear wheels lifted and a dolly under the other wheels.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Make sure that the auto mode is turned off as necessary to prevent the parking brake from being applied automatically.</p>
</div>
<h2>2WD Automatic Transmission — Towing Methods</h2>
<p>Your vehicle may be towed using either of the following methods:</p>
<p><strong>Being towed from the front:</strong> Lift the front wheels and keep the rear wheels on the ground. Before the vehicle is towed, make sure that the parking brake is released.</p>
<p><strong>Being towed from the rear:</strong> Lift the rear wheels and place a dolly under the front wheels.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>If your vehicle is towed with the front wheels on the ground, it can result in damage to the automatic transmission.</p>
</div>
</template>

<template id="tpl-towing-eye">
<h1>Towing by Using Towing Eye</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>For vehicles equipped with Dual Sensor Brake Support II (DSBS II), if your vehicle is towed with the engine on, press the DSBS II OFF switch and turn off the system. If not, an accident related to the system being turned on may occur.</p>
</div>
<h2>Hanging Point of a Towing Cable</h2>
<p>Hang a towing cable on a towing eye. The towing eye is provided on the front of the vehicle for use in emergency situations or sea shipping purposes.</p>
<h2>Installing the Towing Eye</h2>
<ol>
<li>Remove the cover by using a jack handle covered with a soft cloth, as shown in the illustration.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not apply excessive force to the cover strap, as it may be damaged. It is recommended to fasten the cover with tape to prevent damage during towing.</p>
</div>
<ol start="2">
<li>Install the towing eye by hand.</li>
<li>To tighten the towing eye, turn it clockwise using a wheel wrench until it is securely installed.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Observe the following when using the towing eye, otherwise the towing eye or the vehicle body may break and cause serious injury or damage:</p>
<ul>
<li>Avoid pulling the vehicle to get out of severe snowy, muddy or sandy conditions.</li>
<li>Avoid sudden starts or erratic driver behaviour which could cause excessive stress on the towing eye.</li>
<li>Do not use the towing eye for towing another vehicle or transporting your vehicle by a car carrier trailer.</li>
</ul>
<p>In such cases, contact a professional service.</p>
</div>
<h2>Rear Frame Hook (K15C Engine)</h2>
<p>The frame hook on the rear of the vehicle is provided for emergency situations and sea shipping purposes only. Do not use the frame hook for towing another vehicle, being towed by another vehicle, or transporting your vehicle by a car carrier trailer. Otherwise, the frame hook or the vehicle body may break and cause serious injury or damage.</p>
<h2>Car Carrier Frame Holes</h2>
<p>The frame holes on the underside of the vehicle are provided only for transporting by a car carrier trailer. Do not use these holes for towing — they may break and cause serious injury or damage.</p>
<h2>Towing by Using a Rope</h2>
<ol>
<li>Hang a towing cable on the towing eye horizontally, so that the hanging side is at the same height for both the towing vehicle and the towed vehicle if possible.</li>
<li>Keep the engine running.</li>
</ol>
<p>   - If you cannot start the engine, press the engine switch or power switch to change the ignition mode to a position other than LOCK (OFF).    - Turn the steering wheel left and right to confirm the steering lock is released.    - If the vehicle has Suzuki Safety Support, when the ignition is in ON mode, press the DSBS II OFF switch and turn off the system.</p>
<ol start="3">
<li>Shift the gearshift lever into <strong>N</strong>.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>If you cannot shift the gearshift lever into N, towing by rope is not possible. Consult a Maruti Suzuki authorized workshop.</p>
</div>
<ol start="4">
<li>During towing, make sure the towing cable is not slack. Carefully drive your vehicle watching the brake lights of the front vehicle. Turn on the hazard warning lights of the towed vehicle to warn following drivers.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>When your vehicle is towed by rope, observe the following:</p>
<ul>
<li>Do not press the engine switch or power switch to change the ignition mode to LOCK (OFF) — the steering wheel will lock and cannot be turned.</li>
<li>Depress the brake pedal more firmly than usual, as the brake booster does not work.</li>
<li>Operate the steering wheel with more force, as the power steering does not work.</li>
<li>If you cannot release the steering lock due to a malfunction and a flat lead-acid battery, do not perform towing by rope.</li>
<li>If you continuously depress the brake pedal on a long or steep downhill slope, the brakes could overheat and become ineffective. Do not tow by rope on such roads — request a tow truck instead.</li>
</ul>
<p><strong>NOTICE:</strong> Observe the following to avoid damage:</p>
<ul>
<li>Do not apply a strong impact to a towing eye or cable by sudden starting. Do not accelerate suddenly.</li>
<li>Tow on roads only. Do not exceed 30 km/h and do not tow for longer than 30 km, to protect the transmission.</li>
<li>Tow the vehicle in the forward direction only.</li>
</ul>
</div>
</template>

<template id="tpl-ecall">
<h1>eCall</h1>
<p>The eCall system automatically sends vehicle information to an emergency contact centre and connects you to an eCall operator whenever an airbag deploys, or when the SOS button is pressed manually.</p>
<h2>How It Works</h2>
<ol>
<li>The vehicle's location is gathered by the eCall system.</li>
<li>Vehicle information is transmitted to the emergency contact centre.</li>
<li>The emergency contact centre informs the regional emergency service provider.</li>
<li>The regional emergency service provider attempts to contact the vehicle occupant to assess the situation and assistance required.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Radio waves from the eCall system may interfere with electrical medical equipment such as pacemakers. Anyone who uses such equipment should consult their medical equipment supplier or medical advisor about whether radio waves from the eCall system may interfere with it.</p>
<p><strong>CAUTION:</strong></p>
<ul>
<li>eCall will not function without a valid telematics contract.</li>
<li>eCall is only available where wireless mobile communication is possible. It cannot be used in areas with atmospheric disturbance, remote areas, or areas where a signal cannot be obtained.</li>
<li>If the microphone, speaker, or SOS button is malfunctioning, eCall cannot operate properly. Have the function checked at a Maruti Suzuki authorized workshop.</li>
<li>Use a Maruti Suzuki genuine audio system for optimal eCall operation.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>The eCall system's correct functioning depends on the presence of an eCall operator in the country and the availability of its services.</li>
<li>The responsibility of components of the eCall system (other than equipment installed on the vehicle) is borne by the operator of the eCall system.</li>
<li>eCall may not work in the following situations — in such cases, contact emergency services by other means (e.g. a nearby public phone):</li>
<li>Poor reception or a busy line, even within the cellular service area.</li>
<li>When the vehicle is outside the cellular service area.</li>
<li>When any related equipment (SOS button panel, indicator lights, microphone, DCM, antenna, or connecting wires) is malfunctioning, damaged, or broken.</li>
</ul>
</div>
<h2>Components</h2>
<table>
<thead>
<tr><th>Label</th><th>Component</th></tr>
</thead>
<tbody>
<tr><td>(1)</td><td>SOS button</td></tr>
<tr><td>(2)</td><td>eCall microphone</td></tr>
<tr><td>(3)</td><td>Green indicator</td></tr>
<tr><td>(4)</td><td>Red indicator</td></tr>
<tr><td>(5)</td><td>Cover (opened for manual operation)</td></tr>
</tbody>
</table>
<h2>Automatic Operation Mode</h2>
<p>The eCall system activates when the ignition is switched to ON. If an airbag deploys in an accident, vehicle information (position, direction, VIN, accident time, etc.) is sent automatically to the emergency contact centre. The green indicator will blink and the call will connect to an eCall operator.</p>
<h2>Manual Operation Mode</h2>
<p>Open the cover (5), then press and hold the SOS button (1) for more than 1 second and release it. The green indicator will blink and the call will connect to an eCall operator.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Do not perform a test operation using manual mode. If the system is accidentally activated, cancel it immediately — refer to "Cancellation of eCall" below.</p>
</div>
<h2>During a Call (Both Modes)</h2>
<ul>
<li>A tone will sound when the cancellation period ends and the emergency call connects.</li>
<li>Vehicle information (location, direction, VIN, accident time, etc.) is sent to the emergency contact centre only when eCall operates — not at other times.</li>
<li>Conversation during the call is not recorded by the vehicle, but is recorded by the emergency contact centre.</li>
<li>Communication from the eCall operator is heard through the speaker on the centre of the instrument panel. If the audio system is in use, it is automatically muted and eCall is prioritised.</li>
<li>The eCall system has a built-in backup battery for use when the main vehicle battery is damaged in an accident. Its useful life is approximately 3 years under temperatures between −40 °C and 85 °C.</li>
<li>If the built-in battery was used during an automatic eCall operation, have it replaced at a Maruti Suzuki authorized workshop.</li>
<li>When installing electrical equipment such as a navigation terminal, consult a Maruti Suzuki authorized workshop to avoid interfering with eCall components.</li>
</ul>
<h2>Indicator Lights</h2>

<thead>
<tr><th>Green indicator</th><th>Red indicator</th><th>State</th></tr>
</thead>
<tbody>
<tr><td>ON</td><td>ON</td><td>For approximately 5–90 seconds after ignition is switched to ON</td></tr>
<tr><td>ON</td><td>OFF</td><td>Normal operation (including callback waiting)</td></tr>
<tr><td>Blinks ~every 0.5 s</td><td>OFF</td><td>eCall operation begins</td></tr>
<tr><td>Blinks ~every 1 s</td><td>OFF</td><td>eCall communication established — voice call or callback</td></tr>
<tr><td>Blinks ~every 0.3 s</td><td>OFF</td><td>eCall communication finished normally</td></tr>
<tr><td>OFF</td><td>Blinks ~every 0.3 s</td><td>eCall communication finished abnormally</td></tr>
<tr><td>Blinks ~every 3 s</td><td>OFF</td><td>No GPS satellite connection, or out of modem network range</td></tr>

<div class="box note">
<div class="box-label">Note</div>
<p>It may take up to 90 seconds for the eCall system to become available after the ignition is switched to ON. If the SOS button is pressed while both indicators are ON, eCall will begin once the system is ready.</p>
</div>
<h2>Warning Messages</h2>
<p>If "SERVICE CONNECTED" or "Service Connected" appears on the multi-information display, eCall is in progress and other connected services are temporarily unavailable.</p>
<p>If "EMERGENCY CALL IN PROGRESS" or "Emergency Call in Progress" appears, along with the red indicator blinking every 1 second, the built-in battery may be undercharged or there is a system error. Have the vehicle inspected at a Maruti Suzuki authorized workshop promptly. Replace the battery as soon as possible — remaining charge may only support approximately 10 minutes of communication.</p>
<h2>Cancellation of eCall</h2>
<p>eCall can only be cancelled in manual operation mode, and only before communication is established with an operator. Press the SOS button again within 5 seconds of the initial press to cancel.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Communication cannot be cancelled in automatic operation mode.</li>
<li>Once communication is established with an eCall operator, it cannot be cancelled from the vehicle — ask the emergency contact centre to cancel.</li>
</ul>
</div>
<h2>Battery Disposal</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Improper handling of the built-in lithium battery in the eCall unit may result in heat generation, explosion, or fire. Do not heat, disassemble, deform, or dispose of the battery in fire. Used batteries must be disposed of separately from ordinary household waste in accordance with applicable regulations. Consult a Maruti Suzuki authorized workshop for battery replacement or disposal.</p>
</div>

<template id="tpl-jacking">
<h1>Jacking Instructions</h1>
<div class="box caution">
<div class="box-label">Caution</div>
<p>The jack should be used only to change wheels. Read these instructions fully before attempting to use the jack.</p>
<p><strong>NOTICE:</strong> To avoid damaging the storage bracket, do not expand the jack excessively.</p>
<p><strong>WARNING:</strong> Never change a wheel in a traffic lane. Always move the vehicle off the road onto level, hard ground away from traffic before changing a wheel. For further assistance, contact your nearest Maruti Suzuki authorized workshop.</p>
</div>
<h2>Setting Up</h2>
<ol>
<li>Place the vehicle on level, hard ground.</li>
<li>Shift into <strong>P</strong> (Park) and set the parking brake firmly.</li>
<li>Turn on the hazard warning switch if your vehicle is near traffic.</li>
<li>If your vehicle has a smart power tailgate, turn off the smart power tailgate system.</li>
<li>Block the front and rear of the wheel diagonally opposite to the wheel being lifted.</li>
</ol>
<h2>Positioning and Raising the Jack</h2>
<img src="jacking-positioning-diagram.png" alt="Jack positioning and raising diagrams">
<ol start="6">
<li>Position the jack at an angle as shown in the illustration and raise it by turning the jack handle clockwise until the jack-head groove fits around the jacking bar beneath the vehicle body.</li>
<li>Continue to raise the jack slowly and smoothly until the tyre clears the ground. Do not raise the vehicle more than necessary.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Shift into <strong>P</strong> (Park) when jacking up the vehicle.</li>
<li>Never jack up the vehicle with the transmission in <strong>N</strong> (Neutral) — an unstable jack may cause an accident.</li>
<li>Use the jack only on level, hard ground. Never jack up the vehicle on an inclined surface.</li>
<li>Only position the jack between the frame bosses near the wheel being changed.</li>
<li>Make sure the jack is raised at least 25 mm before it contacts the boss. Using the jack within 25 mm of fully collapsed may cause it to fail.</li>
<li>Do not use wooden blocks or similar objects as a jack underlay.</li>
<li>No person should place any part of their body under a vehicle supported by a jack.</li>
<li>Never run the engine when the vehicle is supported by a jack, and never allow passengers to remain in the vehicle.</li>
</ul>
</div>
<h2>Raising with a Garage Jack</h2>
<p>If using a garage jack, apply it to one of the designated points below. Always support the raised vehicle with jack stands at these same points.</p>
<img src="jacking-garage-jack-points-k15c.png" alt="K15C garage jack and jack stand points">
<ul>
<li><strong>(1) Front</strong> jacking point</li>
<li><strong>(2) Rear</strong> jacking point</li>
<li><strong>(3)</strong> Jack stand position</li>
<li><strong>(4)</strong> Garage jack position</li>
<li><strong>(5)</strong> Jacking point for garage jack</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Only use the designated points shown in the illustrations. When holding the vehicle lifted, use a rigid rack. When jacking up the front or rear only, place chocks on the front and rear of the grounded tyres.</p>
</div>
<h2>Changing the Wheel</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Immediately after driving, the wheels, wheel nuts, and area around the brakes may be extremely hot. Do not touch these areas until they have cooled down.</p>
</div>
<ol>
<li>Prepare the jack and tools.</li>
<li>Loosen — but do not remove — the wheel nuts.</li>
<li>Jack up the vehicle following the steps above.</li>
<li>Remove the wheel nuts and wheel.</li>
<li>Clean any mud or dirt off the wheel mounting surface, hub, thread area, and wheel nut faces with a clean cloth. The hub may be hot — take care.</li>
<li>Install the new wheel and replace the wheel nuts with their cone-shaped end facing the wheel. Tighten each nut snugly by hand until the wheel is securely seated on the hub.</li>
<li>Lower the jack and fully tighten the nuts with a wrench in the numerical order shown in the illustration.</li>
</ol>
<img src="jacking-wheel-nut-tightening-order.png" alt="Wheel nut tightening order — cross/star pattern">
<p><strong>Tightening torque for wheel nuts: 100 Nm (10.2 kg-m)</strong></p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Use genuine wheel nuts and tighten them to the specified torque as soon as possible after changing wheels. Incorrect or improperly tightened wheel nuts may come loose or fall off, causing an accident. If you do not have a torque wrench, have the torque checked at a Maruti Suzuki authorized workshop.</p>
</div>
<h2>Full Wheel Cover (if equipped)</h2>
<p>Your vehicle includes two tools — a wheel wrench and a jack crank — one of which has a flat end. Use the flat-end tool wrapped in soft cloth to remove the full wheel cover. When reinstalling the cover, make sure it does not cover or foul the air valve.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>After using the tyre changing tools, stow them securely — unsecured tools can cause injury in an accident.</p>

<template id="tpl-flat-tyre-repair">
<h1>Flat Tyre Repair Kit</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Failure to follow these instructions when using the flat tyre repair kit can increase the risk of loss of control and an accident. Read and follow all instructions carefully.</p>
</div>
<p>The flat tyre repair kit is stowed in the luggage compartment.</p>
<h2>When the Kit Cannot Be Used</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<p>The flat tyre repair kit cannot be used in the following cases — consult a Maruti Suzuki authorized workshop instead:</p>
<ul>
<li>Cuts or piercing in the tyre tread larger than approximately 4 mm.</li>
<li>Cuts in the tyre sidewall.</li>
<li>Tyre damage caused by driving with considerably reduced tyre pressure or with a fully deflated tyre.</li>
<li>The tyre bead completely unseated outside the rim.</li>
<li>The rim is damaged.</li>
</ul>
</div>
<p>Small punctures in the tyre tread caused by a nail or screw can be sealed with the kit. Do not remove nails or screws from the tyre during an emergency repair.</p>
<h2>Kit Contents</h2>
<img src="flat-tyre-kit-contents.png" alt="Flat tyre repair kit components">
<table>
<thead>
<tr><th>Label</th><th>Item</th></tr>
</thead>
<tbody>
<tr><td>(1)</td><td>Air compressor</td></tr>
<tr><td>(2)</td><td>Sealant bottle</td></tr>
<tr><td>(3)</td><td>Speed restriction sticker (stored with air compressor)</td></tr>
<tr><td>(4)</td><td>Air hose</td></tr>
<tr><td>(5)</td><td>Power plug</td></tr>
</tbody>
</table>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The sealant is harmful if swallowed or if it contacts skin or eyes. If swallowed, do not induce vomiting — give plenty of water (charcoal slurry if available) and seek immediate medical attention. If it contacts eyes, flush with water and seek medical attention. Wash thoroughly after handling. Can be poisonous to animals. Keep out of reach of children and animals.</p>
<p><strong>NOTICE:</strong> Replace the sealant before the expiry date shown on the sealant bottle label. Purchase replacement sealant from a Maruti Suzuki authorized workshop.</p>
</div>
<h2>Emergency Repair Procedure</h2>
<ol>
<li>Place the vehicle on level, hard ground. Shift into <strong>P</strong> (Park) and set the parking brake firmly. Turn on the hazard warning flasher if near traffic. Block the front and rear of the wheel diagonally opposite to the wheel being repaired.</li>
<li>Take out the sealant bottle and the compressor.</li>
<li>At the top of the compressor, remove the cap covering the socket for the sealant bottle, then screw the bottle into the socket.</li>
<li>Unscrew the valve cap from the tyre valve.</li>
<li>Connect the air hose of the compressor to the tyre valve.</li>
<li>Connect the power plug to the accessory socket. Start the engine. Switch on the compressor and inflate the tyre to the required air pressure.</li>
</ol>
<img src="flat-tyre-repair-procedure.png" alt="Compressor connected to tyre valve — 10 min maximum run time">
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not operate the compressor for longer than 10 minutes — it can overheat.</p>
</div>
<p>If the tyre cannot be inflated to the required pressure within 5 minutes, move the vehicle a few metres back and forth to spread the sealant over the entire inner tyre surface, then inflate again.</p>
<p>If the tyre still cannot reach the required pressure, it may be too severely damaged for the kit to seal. Consult a Maruti Suzuki authorized workshop.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If the tyre is over-inflated, release air using the deflation valve (5) on the filler hose.</p>
</div>
<ol start="7">
<li>Affix the speed restriction sticker (from the air compressor) in the driver's field of view.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not affix the speed restriction sticker to an airbag, warning light indicator, or speedometer.</p>
</div>
<ol start="8">
<li>Drive carefully immediately after inflating, at a maximum speed of <strong>80 km/h</strong>.</li>
<li>Drive carefully to the nearest Maruti Suzuki authorized workshop.</li>
<li>After 10 km of driving, check the tyre pressure using the compressor's pressure gauge. If the reading is above 220 kPa (2.2 bar), the emergency repair is complete. If the pressure is below the required level, correct it. If the pressure has dropped below 130 kPa (1.3 bar), the kit cannot provide a seal — do not continue using the tyre and consult a workshop immediately.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Check the tyre pressure after 10 km to confirm the repair is holding.</p>
</div>
<h2>After the Emergency Repair</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Have the tyre renewed at the nearest Maruti Suzuki authorized workshop. Consult a tyre repair shop before reusing a sealed tyre.</li>
<li>The wheel can be reused after wiping off all sealant with a cloth to prevent rust, but the tyre valve and TPMS sensor must be renewed.</li>
<li>Dispose of the used sealant bottle and air hose at a Maruti Suzuki authorized workshop or in accordance with local regulations.</li>
<li>After using the sealant bottle and air hose, replace them with new ones from your Maruti Suzuki authorized workshop.</li>
</ul>
</div>
<h2>Using the Compressor to Inflate a Tyre (Without Sealant)</h2>
<ol>
<li>Place the vehicle on level, hard ground. Shift into <strong>P</strong> (Park) and set the parking brake firmly.</li>
<li>Take out the compressor.</li>
<li>Unscrew the valve cap from the tyre valve.</li>
<li>Connect the air hose of the compressor to the tyre valve.</li>
<li>Connect the power plug to the accessory socket. Start the engine. Switch on the compressor and inflate the tyre to the required air pressure.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not operate the compressor for longer than 10 minutes — it can overheat.</p>
</div>
