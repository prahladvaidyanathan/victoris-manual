<template id="tpl-turn-signal">
<h1>Turn Signal Control Lever</h1>
<p>The turn signal control lever can be used when the ignition mode is ON.</p>
<h2>Turn Signal Operation</h2>
<p>Move the lever (1) upward to indicate a left turn, or downward to indicate a right turn. The turn signal lights and their indicators on the instrument cluster will flash simultaneously. When you return the lever to its original position, the lights and indicators turn off.</p>
<p>The lever returns to its original position automatically after completing a turn. If the steering wheel angle was small, the lever may not return automatically — return it manually in this case.</p>
<h2>Lane Change Signal</h2>
<p>To signal a lane change without latching the lever, lightly press the lever partway in the direction you wish to change and hold it. The turn signal and its indicator will flash while the lever is held. If you release the lever immediately after activating it, the turn signal and indicator will flash 3 times.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The number of flashes for the lane change signal (1–4 times) can be customised. Contact your Maruti Suzuki authorised workshop.</li>
<li>Whether the turn signal flashes 3 times after the lever is returned can also be configured via the information display setting mode. Refer to <a onclick="navigate('display-settings')" href="javascript:void(0)">12-19 Setting Mode of Information Display (Type B)</a> in the "Specifications" section.</li>
</ul>
</div>
</template>

<template id="tpl-hazard-warning">
<h1>Hazard Warning Switch</h1>
<p>Use the hazard warning switch to warn other drivers of a possible traffic hazard when parking in an emergency.</p>
<p>Push the hazard warning switch to activate the hazard warning lights — all turn signal lights and their indicators on the instrument cluster will flash simultaneously. Push the switch again to turn them off.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Using the hazard warning switch for many hours with the engine stopped may drain the battery. Do not use the hazard warning switch for extended periods with the engine stopped.</p>
</div>
</template>

<template id="tpl-wipers">
<h1>Windshield Wiper and Washer Lever</h1>
<p>The wiper/washer lever can be used when the ignition mode is ON.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>In cold weather, sprayed washer fluid on the glass may freeze and cause poor visibility. Use the defroster to warm the glass before spraying washer fluid. Refer to <a onclick="navigate('hvac')" href="javascript:void(0)">07-21 Heating and Air Conditioning System</a> in the "Other Controls and Equipment" section.</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>Do not use the wipers on a dry windshield. The glass and wiper blade rubbers may be damaged. Always use washer fluid first.</li>
<li>Do not operate the wipers if the wiper blades are stuck to the glass, as the rubbers may be damaged or the wipers broken.</li>
<li>Do not continue holding the washer lever when no fluid is being sprayed, as this can damage the washer pump.</li>
<li>Clear ice or packed snow from the wiper blades before using the wipers.</li>
<li>Check the washer fluid level regularly, especially in bad weather.</li>
</ul>
</div>
<h2>Windshield Wipers</h2>

<table>
<thead>
<tr><th>Position</th><th>Function</th></tr>
</thead>
<tbody>
<tr><td>MIST</td><td>Temporary operation only while the lever is held up</td></tr>
<tr><td>OFF</td><td>Off</td></tr>
<tr><td>INT</td><td>Intermittent operation</td></tr>
<tr><td>LO</td><td>Low speed operation</td></tr>
<tr><td>HI</td><td>High speed operation</td></tr>

<h2>Windshield Washer</h2>

<div class="box warning">
<div class="box-label">Warning</div>

<h2>When the Wipers Suddenly Stop</h2>
<p>If the wipers are under heavy load (e.g. covered by snow) and the wiper motor temperature becomes too high, a breaker will activate and the wipers will temporarily stop to protect the motor from overheating.</p>
<p>If this happens:</p>
<ol>
<li>Stop the vehicle in a safe place and change the ignition mode to ACC or LOCK (OFF).</li>
<li>Move the wiper lever to the "OFF" position.</li>
<li>Remove any obstacles such as snow from the wipers.</li>
<li>After a while, once the motor temperature drops, the breaker will reset automatically and the wipers can be used again.</li>
</ol>
<p>If the wipers cannot be used after a while, there may be another problem. Have the wipers inspected by a Maruti Suzuki authorised workshop.</p>
<h2>Rear Window Wiper</h2>

</div>
<h2>Rear Window Washer</h2>
<p>Twist the lever (2) past the "ON" or "OFF" position to the washer symbol to spray the rear window washer fluid. The rear wiper will operate simultaneously. When you release the lever, it returns to the "ON" or "OFF" position respectively.</p>

<template id="tpl-instrument-cluster">
<h1>Instrument Cluster (Type B)</h1>
<p>The Type B instrument cluster is a fully digital TFT display. Its six main areas are:</p>
<ol>
<li>Speedometer</li>
<li>Power meter / Tachometer / Multimedia / Clock and date</li>
<li>Information display</li>
<li>Fuel gauge</li>
<li>Multi-information display</li>
<li>Warning and indicator lights</li>
</ol>
<img src="cluster-b-overview.png" alt="Type B instrument cluster overview diagram">
<h2>Speedometer</h2>
<p>The speedometer indicates vehicle speed. You can switch between Classic and Standard layout from the Setting Mode in the information display.</p>
<p><strong>Classic Layout</strong></p>
<img src="cluster-b-speedometer-classic.png" alt="Speedometer — Classic layout (circular dial)">
<p><strong>Standard Layout</strong></p>
<img src="cluster-b-speedometer-standard.png" alt="Speedometer — Standard layout (digital readout)">
<h3>Speed Alert System</h3>
<p>The speed alert system gives an audible warning when you exceed set speed thresholds. There is no malfunction implied by this buzzer.</p>
<table>
<thead>
<tr><th>Speed threshold</th><th>Alert</th></tr>
</thead>
<tbody>
<tr><td>Exceeds ~80 km/h</td><td>Two beeps every minute (primary level)</td></tr>
<tr><td>Exceeds ~120 km/h</td><td>Continuous beeps (secondary level)</td></tr>
<tr><td>Slows to ~118 km/h</td><td>Returns to primary (two beeps)</td></tr>
<tr><td>Slows to ~78 km/h</td><td>Alert stops</td></tr>
</tbody>
</table>
<h2>Power Meter</h2>
<p>The power meter occupies the same display zone as the tachometer on non-SHVS vehicles. It shows three areas:</p>
<table>
<thead>
<tr><th>Area</th><th>Label</th><th>Meaning</th></tr>
</thead>
<tbody>
<tr><td>(1)</td><td>CHG</td><td>Regeneration is active — kinetic energy is charging the hybrid battery</td></tr>
<tr><td>(2)</td><td>ECO</td><td>Driving in an eco-friendly manner</td></tr>
<tr><td>(3)</td><td>PWR</td><td>Eco-friendly range is being exceeded (full-power driving)</td></tr>
</tbody>
</table>
<div class="box note">
<div class="box-label">Note</div>
<p>"Regeneration" refers to the conversion of vehicle movement energy into electrical energy. The power meter does not illuminate when the shift position is in a range other than D, B, or R.</p>
</div>
<p><strong>Classic Layout</strong></p>
<img src="cluster-b-power-meter-classic.png" alt="Power meter — Classic layout (arc gauge with CHG / ECO / PWR zones)">
<p><strong>Standard Layout</strong></p>
<img src="cluster-b-power-meter-standard.png" alt="Power meter — Standard layout (vertical bar with CHG / ECO / PWR zones)">
<h2>Tachometer (if equipped)</h2>
<p>On non-SHVS variants, the tachometer occupies the same zone as the power meter and indicates engine speed in revolutions per minute.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Never drive with the engine revving in the red zone — severe engine damage can result. Keep engine speed below the red zone even when downshifting.</p>
</div>
<p><strong>Classic Layout</strong></p>
<img src="cluster-b-tachometer-classic.png" alt="Tachometer — Classic layout (circular dial, ×1000 rpm)">
<p><strong>Standard Layout</strong></p>
<img src="cluster-b-tachometer-standard.png" alt="Tachometer — Standard layout (vertical bar, ×1000 rpm)">
<h2>Multimedia (if equipped)</h2>
<p>When selected, this zone displays multimedia information such as Bluetooth, USB, Apple CarPlay, or Android Auto. Refer to the infotainment system manual for details.</p>
<h2>Clock and Date</h2>
<p>The clock displays in zone (F) of the information display. To set the time or date, follow the Setting Mode instructions in the <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> section.</p>
<img src="cluster-b-clock.png" alt="Clock and date display">
<h2>Fuel Gauge</h2>
<p>When the ignition mode is ON, the fuel gauge shows the approximate amount of fuel remaining. "F" = Full, "E" = Empty. The fuel filler door is on the <strong>left</strong> side of the vehicle (indicated by the arrow mark).</p>
<img src="cluster-b-fuel-gauge.png" alt="Fuel gauge (E to F bar with fuel pump icon)">
<p>If the indicator approaches "E", refill the tank as soon as possible. The low fuel warning light will come on when approximately 5.0 L or less remains — see <a onclick="navigate('warning-indicator-lights')" href="javascript:void(0)">04-03 Warning and Indicator Lights</a>.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Avoid driving near empty — this risks damage to the catalytic converter and other components. <strong>NOTE:</strong> The indicator may move slightly on slopes or curves due to fuel movement in the tank.</p>
</div>
<h2>Brightness Control</h2>
<p>The instrument panel lights come on when the ignition mode is ON. You can adjust brightness even when the ignition mode is LOCK (OFF).</p>
<img src="cluster-b-brightness-screen.png" alt="Brightness adjustment screen">
<img src="cluster-b-brightness-steering.png" alt="Steering wheel controls used for brightness adjustment">
<p><strong>To adjust brightness:</strong></p>
<ol>
<li>Press <strong>&lt;</strong> or <strong>&gt;</strong> on the left/right selector switch (3) to navigate to Setting Mode.</li>
<li>Press the up/down selector switch (1) <strong>∧</strong> or <strong>∨</strong> to select the Brightness option, then press the switch (2) to confirm.</li>
<li>Press <strong>∧</strong> or <strong>∨</strong> again to adjust the brightness level.</li>
<li>Press <strong>&lt;</strong> on the left selector switch (3) to exit.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not adjust brightness while driving — you could lose control of the vehicle. <strong>NOTE:</strong> When the lead-acid battery is reconnected, brightness resets to default. Readjust to your preference. <strong>NOTE:</strong> At maximum brightness with position lights or headlights on, the auto-dimming function and all brightness control functions (except maximum) are cancelled.</p>
</div>
</template>

<template id="tpl-information-display">
<h1>Information Display (Type B)</h1>
<p>The information display is shown when the ignition mode is ON. It is divided into labelled zones (A) through (K).</p>
<img src="info-display-overview.png" alt="Information display zones overview">
<table>
<thead>
<tr><th>Zone</th><th>Content</th></tr>
</thead>
<tbody>
<tr><td>(A)</td><td>Clock</td></tr>
<tr><td>(B)</td><td>Warning and indicator lights</td></tr>
<tr><td>(C)</td><td>Driving information / warning messages / setting mode / odometer &amp; trip / menu bar</td></tr>
<tr><td>(D)</td><td>Speedometer</td></tr>
<tr><td>(E)</td><td>Lane keep assist / steering assist / lane departure prevention / adaptive cruise control indicators</td></tr>
<tr><td>(F)</td><td>Clock and date / Multimedia / Power meter</td></tr>
<tr><td>(G)</td><td>Shift position indicator</td></tr>
<tr><td>(H)</td><td>Odometer / Trip meter</td></tr>
<tr><td>(I)</td><td>Rear passenger seat belt reminder / outside temperature</td></tr>
<tr><td>(J)</td><td>Fuel gauge</td></tr>
<tr><td>(K)</td><td>Driving range</td></tr>
</tbody>
</table>
<h2>Navigating the Display</h2>
<p>Use the steering wheel selector switches to operate Display (C).</p>
<img src="cluster-b-brightness-steering.png" alt="Steering wheel selector switches">
<table>
<thead>
<tr><th>Switch</th><th>Action</th></tr>
</thead>
<tbody>
<tr><td>Left/right selector (3) <strong>&lt;</strong> or <strong>&gt;</strong></td><td>Change menu bar tab</td></tr>
<tr><td>Up/down selector (1) <strong>∧</strong> / <strong>∨</strong></td><td>Select screen within tab</td></tr>
<tr><td>OK switch (2)</td><td>Confirm selection or reset values</td></tr>
</tbody>
</table>
<p>The menu bar in Display (C) has five tabs:</p>
<img src="menu-bar-icons.png" alt="Menu bar icons (&lt; i ◄ ▲ ⚙ ODO/TRIP &gt;)">
<table>
<thead>
<tr><th>Tab</th><th>Icon</th><th>Content</th></tr>
</thead>
<tbody>
<tr><td>(a)</td><td>i</td><td>Driving information display</td></tr>
<tr><td>(b)</td><td>◄</td><td>Navigation information (if infotainment is active)</td></tr>
<tr><td>(c)</td><td>▲</td><td>Warning message display</td></tr>
<tr><td>(d)</td><td>⚙</td><td>Setting mode</td></tr>
<tr><td>(e)</td><td>ODO/TRIP</td><td>Odometer / Trip meter display</td></tr>
</tbody>
</table>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not adjust the display while driving — you could lose control of the vehicle.</p>
</div>
<h2>Display (C) — Driving Information</h2>
<p>The driving information tab (a) shows the following screens. Select with the up/down switch.</p>
<img src="display-c-menu-diagram.png" alt="Display C menu options diagram">
<h3>Instantaneous Fuel Consumption / Average Fuel Economy / Range</h3>
<img src="display-instant-fuel.png" alt="Instantaneous fuel consumption bar graph and average fuel economy screen">
<p>The bar graph shows instantaneous fuel consumption only when the vehicle is moving. Units are km/L or L/100km (changeable in Setting Mode). Maximum displayed value is 50 km/L or 30 L/100km.</p>
<img src="display-avg-fuel.png" alt="Average fuel consumption screen">
<p>Average fuel consumption from the previous reset is shown. If you selected this view on the last drive, the previous value is shown on startup until you drive for a short period. You can set when the value resets:</p>
<ul>
<li><strong>Reset after refuel</strong> — resets automatically when you fill up</li>
<li><strong>Reset with trip meter A</strong> — resets automatically when trip meter A is reset</li>
<li><strong>Reset manually</strong> — press OK switch (2) while this screen is displayed</li>
</ul>
<h3>1-Driving Cycle Fuel Consumption</h3>
<img src="display-1cycle-fuel.png" alt="1-driving cycle fuel consumption screen">
<p>Shows average fuel consumption for the current and past 3 driving cycles.</p>
<h3>5-Minute Average Fuel Consumption</h3>
<img src="display-5min-fuel.png" alt="5-minute average fuel consumption screen">
<p>Shows transition of average fuel consumption every 5 minutes, from 15 minutes ago up to now.</p>
<h3>Driving Range</h3>
<img src="display-driving-range.png" alt="Driving range screen">
<p>Shows the approximate distance you can drive before the fuel gauge reaches "E", based on current conditions. Displays "---" when the low fuel warning light is on — refuel immediately regardless of the range shown. If you refuel with the ignition ON, the value may not update correctly.</p>
<h3>Average Speed / 5-Minute Average Speed</h3>
<img src="display-avg-speed.png" alt="Average speed screen">
<img src="display-5min-speed.png" alt="5-minute average speed screen">
<p>Press OK switch (2) while average speed is displayed to reset it.</p>
<h3>Driving Time</h3>
<img src="display-driving-time.png" alt="Driving time screen">
<p>Shows cumulative driving time since last reset. Maximum displayed value is 99:59:59. Press OK switch (2) to reset. Reconnecting the battery also resets this value.</p>
<h3>Total Idle Stop Time and Total Idle Fuel Saved</h3>
<img src="display-idle-stop-time.png" alt="Total idle stop time and total idle fuel saved screen">
<p>Shows the total engine-off time (hh:mm:ss) and total fuel saved (ml) by the ENG A-STOP system since last reset. Press OK switch (2) to reset. Maximum displayed idle stop time is 99:59:59. Reconnecting the battery resets both values.</p>
<h3>Energy Flow</h3>
<img src="display-energy-flow.png" alt="Energy flow indicator screen">
<p>Shows the current SHVS energy flow status. See <a onclick="navigate('shvs')" href="javascript:void(0)">05-12 SHVS</a> for details on status lamp meanings.</p>
<h3>Intersection Guidance</h3>
<p>When Android Auto or Apple CarPlay is active on the infotainment system, the display shows turn-by-turn direction and distance.</p>
<img src="display-android-auto-nav.png" alt="Intersection guidance — Android Auto">
<img src="display-carplay-nav.png" alt="Intersection guidance — Apple CarPlay">
<div class="box note">
<div class="box-label">Note</div>
<p>A slight time lag may occur between the information display guidance and the infotainment system. You can turn intersection guidance on or off while navigation is active.</p>
</div>
<h2>Trip Meter / Odometer</h2>
<img src="display-odometer-bar.png" alt="Odometer and trip meter bar">
<img src="display-trip-meter.png" alt="Trip meter A/B detail">
<p>Display (H) shows the trip meter and odometer. Two independent trip meters (A and B) are available. Select "Odometer / Tripmeter display" from the menu bar to show in Display (C). To reset trip meter A or B, select it and press the OK switch until the display resets.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Keep track of your odometer reading and check the maintenance schedule regularly. Increased wear or damage can result from missed services.</p>
</div>
<h2>Gear Position</h2>
<p>Display (G) shows the current gear position when the ignition mode is ON.</p>
<img src="display-gear-position.png" alt="Gear position indicator icon">
<p>See <a onclick="navigate('transmission')" href="javascript:void(0)">05-10 Using Transmission</a> for details.</p>
<h2>Digital Speedometer Display</h2>
<p>When the Classic or Standard analog speedometer layout is selected, you can toggle a digital speed readout on or off inside the speedometer area via Setting Mode.</p>
<h2>Information Shown After Driving</h2>
<p>When the power switch is pressed to LOCK (OFF), the following summary appears on the information display for a few seconds:</p>
<img src="display-after-driving-eng-stop.png" alt="Information shown after driving (with ENG A-STOP) — driving time, distance, range, idling stop time, idle stop fuel saved">
<h2>Rear Passenger Seat Belt Reminder Light</h2>
<p>Display (I) shows a reminder light when rear passengers have not fastened their seat belts. See <a onclick="navigate('seat-belt')" href="javascript:void(0)">02-09 Seat Belt</a> for details.</p>
<h2>Setting Mode</h2>
<p>Brightness, units, reset timing, speedometer layout, and other preferences are configured in Setting Mode (tab d). For a full list of customisable settings, refer to <a onclick="navigate('display-settings')" href="javascript:void(0)">12-19 Setting Mode of Information Display (Type B)</a> in the Specifications chapter.</p>
<h2>Warning and Indicator Messages</h2>
<p>When the vehicle detects a problem, a warning or indicator message appears in Display (C). The master warning indicator light (zone B) may also blink. In some cases a buzzer sounds simultaneously.</p>
<ul>
<li>When the problem is resolved, the message disappears automatically.</li>
<li>If multiple problems occur, their messages alternate every ~5 seconds.</li>
<li>Press and hold OK switch (2) to temporarily dismiss a message.</li>
<li>If a message persists, have the vehicle inspected at a Maruti Suzuki authorised workshop.</li>
</ul>
<div class="box note">

<p>Additional warning messages related to ENG A-STOP, DSBS II, adaptive cruise control, lane departure prevention, BSM/RCTA, and parking sensors are described in their respective sections.</p>

<template id="tpl-warning-indicator-lights">
<h1>Warning and Indicator Lights</h1>
<p>When warning and indicator lights blink or come on, the corresponding messages may also be shown on the information display (Display C).</p>
<h2>Low Tyre Pressure Warning Light</h2>
<img src="warn-lights/warn-low-tyre-pressure.png" alt="Low tyre pressure warning light">
<p>Your vehicle is equipped with a Tyre Pressure Monitoring System (TPMS). When the ignition mode is ON, this light comes on briefly so you can check that it works.</p>
<p>When this light is lit and stays on, one or more tyres is significantly under-inflated. Stop safely, check and inflate all tyres to the recommended pressure.</p>
<p>This light also blinks to indicate a TPMS malfunction. When the system detects a malfunction, the light blinks for about one minute and then stays on. Visit a Maruti Suzuki authorised workshop.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Failure to take corrective action when this light comes on or blinks can result in tyre failure, loss of control, and an accident. <strong>NOTE:</strong> This light may not come on immediately if you have a sudden loss of air pressure.</p>
</div>
<h2>Brake System Warning Light</h2>
<img src="warn-lights/warn-brake-system.png" alt="Brake system warning light (red)">
<p>This light comes on briefly when the ignition mode is changed to ON. It also comes on when the brake fluid level falls below the specified level, or when the parking brake is applied. It should go out after the engine is started and the parking brake is fully released (provided the brake fluid level is sufficient).</p>
<p>If this light comes on while driving, the brake system may be malfunctioning:</p>
<ol>
<li>Pull off the road and stop carefully.</li>
<li>Test the brakes by carefully starting and stopping on the shoulder of the road.</li>
<li>If the brakes seem normal, drive slowly to a Maruti Suzuki authorised workshop.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If this light stays on, stopping distance may be longer and the pedal may go down further — apply more pressure if needed. Have the system inspected immediately. <strong>NOTE:</strong> Because the brake system is self-adjusting, the fluid level will drop as the brake pads become worn. Replenishing the fluid when pads are worn does not fix the underlying issue — have the vehicle inspected.</p>
</div>
<h2>Seat Belt Reminder Light</h2>
<img src="warn-lights/ind-seatbelt.png" alt="Seat belt reminder light">
<p>When the driver and/or front passenger does not buckle their seat belt, this light will come on and/or blink. A reminder message will also appear on the information display.</p>
<h2>Rear Passenger's Seat Belt Reminder Light</h2>
<img src="warn-lights/ind-rear-seatbelt.png" alt="Rear passenger seat belt reminder light">
<p>Reminder light for rear passengers to fasten their seat belts. For details, see <a onclick="navigate('seat-belt')" href="javascript:void(0)">02-09 Seat Belt</a>.</p>
<h2>Airbag Warning Light</h2>
<img src="warn-lights/warn-airbag.png" alt="Airbag warning light">
<p>This light blinks or comes on for several seconds when the ignition mode is changed to ON. It will come on and stay on if there is a problem with the airbag system or the seat belt pretensioner system.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If this light does not blink or come on briefly at ignition, or if it stays on while driving, have the vehicle inspected by a Maruti Suzuki authorised workshop immediately. A malfunctioning airbag system may fail to deploy in a collision or may deploy unexpectedly.</p>
</div>
<h2>Low Fuel Warning Light</h2>
<img src="warn-lights/warn-low-fuel.png" alt="Low fuel warning light">
<p>This light comes on when the remaining fuel level is approximately 5.0 L or less. A single ding sounds when it first comes on. If you do not refuel, it continues to sound at regular intervals.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>The activation point may vary slightly on slopes or curves.</p>
</div>
<h2>Anti-lock Brake System (ABS) Warning Light</h2>
<img src="warn-lights/warn-abs.png" alt="ABS warning light">
<p>This light comes on briefly when the ignition mode is changed to ON. If it stays on, the ABS system may not be working. Your brakes will still work normally but without anti-lock support.</p>
<p>If the light stays on:</p>
<ol>
<li>Pull off the road and stop carefully.</li>
<li>Turn the ignition mode to LOCK (OFF), then restart.</li>
<li>If the light stays on after restarting, have the vehicle inspected.</li>
</ol>
<p>If both the ABS warning light and the brake system warning light stay on simultaneously, have the vehicle inspected immediately — the rear brake force control function may also be lost.</p>
<h2>Engine Coolant Temperature Warning Light</h2>
<img src="warn-lights/warn-coolant-temp.png" alt="Engine coolant temperature warning light">
<p>This light comes on briefly at ignition-ON to check it works. It has two functions:</p>
<p><strong>Blue (low temperature):</strong> Stays on while the engine is cold and goes off once the engine reaches normal operating temperature. This is normal — avoid high engine loads until it goes off.</p>
<p><strong>Red (high temperature):</strong> If this light blinks while driving, the engine is running hot.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Stop the vehicle immediately in a safe place. Do not continue driving — severe engine damage can result.</p>
</div>
<h2>Malfunction Indicator Light</h2>
<img src="warn-lights/warn-malfunction-indicator.png" alt="Malfunction indicator light (check engine)">
<p>Your vehicle has a computer-controlled emission control system. This light indicates a fault detected by the on-board diagnostic system.</p>
<p>If the light comes on steadily: There is a problem with the emission control system. Have the vehicle inspected soon.</p>
<p>If the light blinks: There is a misfire that could damage the catalytic converter.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Stop immediately in a safe place if this light blinks. <strong>NOTICE:</strong> Continuing to drive with this light on or blinking can cause permanent damage to the emission control system and catalytic converter.</p>
</div>
<h2>Electric Power Steering Light</h2>
<img src="warn-lights/warn-eps.png" alt="Electric power steering warning light">
<p>This light comes on briefly at ignition-ON. If it comes on while driving, the power steering system may not be functioning properly — steering effort will increase. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Using the steering wheel continuously at low speed or while parking can cause the power steering system to temporarily reduce assistance to protect itself. Once the system cools down, normal function resumes. Repeated occurrences should be inspected.</p>
</div>
<h2>Engine Oil Pressure Warning Light</h2>
<img src="warn-lights/warn-oil-pressure.png" alt="Engine oil pressure warning light">
<p>This light comes on briefly at ignition-ON. If it comes on while driving, the engine oil pressure may be too low.</p>
<p>Stop the engine immediately and check the oil level. Do not restart until the cause is identified and resolved.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Operating the engine with this light on can cause severe engine damage. Do not rely solely on this light to monitor oil condition — check the oil level regularly.</p>
</div>
<h2>Charge Warning Light</h2>
<img src="warn-lights/warn-charge.png" alt="Charge warning light">
<p>This light comes on briefly at ignition-ON. If it comes on while driving, the battery is not being charged properly. This may indicate a problem with the alternator or charging system. Have the vehicle inspected promptly to avoid a discharged battery.</p>
<h2>Cruise Control Indicator Light</h2>
<img src="warn-lights/ind-cruise-control.png" alt="Cruise control indicator light">
<p>When the cruise control system is on, this light will be on.</p>
<h2>SET Indicator Light</h2>
<img src="warn-lights/ind-cruise-set.png" alt="SET indicator light (cruise control set)">
<p>When a cruising speed has been set by the cruise control, this light will be on.</p>
<h2>Transmission Warning Light</h2>
<img src="warn-lights/warn-transmission.png" alt="Transmission warning light">
<p>This light comes on briefly at ignition-ON. If it comes on when the ignition mode is changed to ON and then stays on, there is a problem with the automatic transmission. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<h2>Immobilizer / Keyless Push Start System Warning Light</h2>
<img src="warn-lights/warn-immobilizer.png" alt="Immobilizer/keyless push start warning light">
<p>This light comes on briefly at ignition-ON. If it blinks or stays on after starting, there is a problem with the immobilizer or keyless push start system. If the issue persists at normal battery voltage, visit a Maruti Suzuki authorised workshop.</p>
<h2>Open Door Warning Light</h2>
<img src="warn-lights/warn-open-door.png" alt="Open door warning light">
<p>This light stays on until all doors (including the tailgate) are completely closed. If a door is open while the vehicle is moving, a ding sounds to remind you to close it.</p>
<h2>Turn Signal Indicators</h2>
<img src="warn-lights/ind-turn-signal.png" alt="Turn signal indicator lights (left and right)">
<p>When the left or right turn signals are turned on, the corresponding green arrow on the instrument panel will blink. If there is abnormal blinking (such as faster-than-normal blinking), there may be a malfunction in the turn signal circuit.</p>
<h2>Main Beam (High Beam) Indicator Light</h2>
<img src="warn-lights/ind-high-beam.png" alt="High beam indicator light (blue)">
<p>This indicator comes on when the headlight high beams (main beams) are turned on.</p>
<h2>Illumination Indicator Light</h2>
<img src="warn-lights/ind-illumination.png" alt="Illumination indicator light">
<p>This indicator light comes on while the position lights, tail lights, and/or headlights are on.</p>
<h2>ESP® OFF Indicator Light</h2>
<img src="warn-lights/ind-esp-off.png" alt="ESP OFF indicator light">
<p>This light comes on briefly at ignition-ON. When the ESP® OFF switch is pushed to disable the ESP® systems (other than ABS), this light stays on. For details, see the Electronic Stability Program section.</p>
<h2>ESP® Warning Light</h2>
<img src="warn-lights/warn-esp.png" alt="ESP warning light (blinking)">
<p>This light blinks at approximately 5 times per second when one of the ESP® systems (other than ABS) is activated while driving — this is normal operation. It comes on briefly at ignition-ON as a bulb check. If it stays on while driving, there may be a problem with the ESP® system.</p>
<p>For details, see the Electronic Stability Program section.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The ESP® systems cannot prevent accidents. Always drive carefully.</p>
</div>
<h2>ENG A-STOP Indicator Light</h2>
<img src="warn-lights/ind-eng-astop.png" alt="ENG A-STOP indicator light">
<p>This light comes on briefly at ignition-ON as a system check. When the engine stops automatically due to the ENG A-STOP (Engine Auto Stop Start) system, this light comes on.</p>
<p>For details, see <a onclick="navigate('eng-a-stop')" href="javascript:void(0)">05-09 ENG A-STOP System</a>.</p>
<h2>Front Fog Light Indicator Light</h2>
<img src="warn-lights/ind-front-fog.png" alt="Front fog light indicator light">
<p>This light comes on when the front fog light is operating.</p>
<h2>ENG A-STOP OFF Indicator Light</h2>
<img src="warn-lights/ind-eng-astop-off.png" alt="ENG A-STOP OFF indicator light">
<p>This light comes on briefly at ignition-ON if the system is operating normally. When you push the ENG A-STOP OFF switch, this light stays on. If this light blinks while driving, there may be a problem with the ENG A-STOP system — have the vehicle inspected.</p>
<h2>Master Warning Indicator Light</h2>
<img src="warn-lights/ind-master-warning.png" alt="Master warning indicator light (red exclamation mark)">
<p>This light comes on briefly at ignition-ON. When the information display shows warning or indicator messages (Display C), this indicator light may also blink. For details, see <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a>.</p>
<h2>Hybrid System Warning Light</h2>
<img src="warn-lights/warn-hybrid-system.png" alt="Hybrid system warning light">
<p>This light comes on briefly at ignition-ON as a system check. If it comes on or blinks while driving, there is a problem with the SHVS hybrid system. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<h2>Deceleration Energy Regenerating Indicator Light</h2>
<img src="warn-lights/ind-decel-regen.png" alt="Deceleration energy regenerating indicator light">
<p>This light comes on briefly at ignition-ON. When the deceleration energy regenerating function (SHVS) is actively charging the hybrid battery, this light comes on.</p>
<p>For details, see <a onclick="navigate('shvs')" href="javascript:void(0)">05-12 SHVS</a>.</p>
<h2>High Beam Assist Warning Light (Yellow)</h2>
<img src="warn-lights/warn-high-beam-assist.png" alt="High beam assist warning light (yellow)">
<p>This light comes on briefly in yellow at ignition-ON as a system check. If it comes on and stays on, the high beam assist system has a failure — the Dual Sensor Brake Support II (DSBS II) will also stop functioning.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If the dual sensor function is temporarily suspended, high beam assist also stops temporarily.</p>
</div>
<h2>Dual Sensor Brake Support II (DSBS II) Indicator Light</h2>
<img src="warn-lights/ind-dsbs.png" alt="DSBS II indicator light (blinks when active)">
<p>This light blinks when the brake support function of DSBS II is actively operating (i.e., the system is applying braking). For details, see 05-17 DSBS II.</p>
<h2>Dual Sensor Brake Support II (DSBS II) OFF Indicator Light</h2>
<img src="warn-lights/ind-dsbs-off.png" alt="DSBS II OFF indicator light">
<p>This light comes on briefly at ignition-ON. In certain conditions (such as a blocked sensor or system fault), this light comes on and DSBS II will stop functioning. If it comes on and stays on due to a system problem, have the vehicle inspected.</p>
<p>For details, see 05-17 DSBS II.</p>
<h2>Lane Departure Prevention Indicator Light</h2>
<img src="warn-lights/ind-ldp.png" alt="Lane departure prevention indicator light">
<p>This light illuminates or blinks depending on the operating status of the lane departure prevention or lane departure warning system. When the system is functioning normally, it illuminates in yellow for a few seconds at engine start. For details, see 05-14 Lane Departure Prevention.</p>
<h2>Lane Departure Prevention OFF Indicator Light</h2>
<img src="warn-lights/ind-ldp-off.png" alt="Lane departure prevention OFF indicator light">
<p>When the lane departure prevention OFF switch is pushed and held to disable the system, this light comes on.</p>
<p>For details, see 05-14 Lane Departure Prevention.</p>
<h2>Lane Keep Assist Indicator Light</h2>
<img src="warn-lights/ind-lka.png" alt="Lane keep assist indicator light">
<p>The display colour, illumination, and blinking state change depending on the operating status of the lane keep assist system. When the system is functioning normally, the light illuminates in yellow for a few seconds at engine start. For details, see 05-15 Lane Keep Assist.</p>
<h2>High Beam Assist Indicator Light (Green)</h2>
<img src="warn-lights/ind-high-beam-assist-green.png" alt="High beam assist indicator light (green, when operating)">
<p>When the high beam assist system is actively controlling the headlights, this light comes on in green. For details, see the high beam assist section.</p>
<h2>Adaptive Cruise Control Indicator Light</h2>
<img src="warn-lights/ind-acc.png" alt="Adaptive cruise control indicator light">
<p>The indicator colour and on/off status change depending on the operating status of the adaptive cruise control system. For details, see 05-16 Adaptive Cruise Control.</p>
<h2>Blind Spot Monitor (BSM) OFF Indicator Light</h2>
<img src="warn-lights/ind-bsm-off.png" alt="BSM OFF indicator light">
<p>This light comes on briefly at ignition-ON. When the blind spot monitor (BSM) is turned off via the information display settings, this light stays on. For details, see 05-18-04 BSM.</p>
<h2>Rear Cross Traffic Alert (RCTA) OFF Indicator Light</h2>
<img src="warn-lights/ind-rcta-off.png" alt="RCTA OFF indicator light">
<p>This light comes on briefly at ignition-ON. When the rear cross traffic alert (RCTA) is turned off via the information display settings, this light comes on. For details, see 05-18-05 RCTA.</p>
<h2>Parking Sensor Indicator Light</h2>
<img src="warn-lights/ind-parking-sensor.png" alt="Parking sensor indicator light">
<p>This light comes on briefly at ignition-ON. When the rear parking sensors detect an obstacle, this light blinks. If this light comes on and stays on (without an obstacle being detected), there is a problem with the parking sensors — have the vehicle inspected.</p>
<p>For details, see <a onclick="navigate('parking-sensors')" href="javascript:void(0)">05-18-06 Parking Sensors</a>.</p>
<h2>Steering Assist Indicator Light</h2>
<img src="warn-lights/ind-steering-assist.png" alt="Steering assist indicator light">
<p>This light illuminates when the lane departure prevention or lane keeping assist system is actively applying steering inputs. The display colour changes depending on the system status. When functioning normally, it illuminates in white for a few seconds at engine start.</p>
<h2>Electric Parking Brake Operation Indicator Light</h2>
<img src="warn-lights/ind-epb.png" alt="Electric parking brake operation indicator light">
<p>This indicator comes on when the electric parking brake (EPB) is engaged. It blinks when the EPB is in the process of engaging or releasing. If it blinks abnormally or stays on unexpectedly, there may be a problem with the EPB system — see the warning messages in <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> for details.</p>
