<template id="tpl-daily-inspection">
<h1>Daily Inspection Checklist</h1>
<h2>Before Driving</h2>
<ol>
<li>Check that the windows, mirrors, lights and reflectors are clean and unobstructed.</li>
<li>Visually check the tyres for the following points:</li>
</ol>
<p>   - The depth of the tread groove    - Abnormal wear, cracks and damage    - Loose wheel nuts    - Existence of foreign material such as nails, stones, etc.</p>
<p>   Refer to <a onclick="navigate('tyres')" href="javascript:void(0)">09-13 Tyres</a> for details.</p>
<ol start="3">
<li>Look for fluid and oil leakage.</li>
<li>Check that the hood is fully closed and latched.</li>
<li>Check the headlights, turn signal lights, brake lights and horn for proper operation.</li>
<li>Adjust the seat and head restraint.</li>
<li>Check the brake pedal feeling and the adjustment condition for the parking brake lever (if equipped). Refer to <a onclick="navigate('brakes-maint')" href="javascript:void(0)">09-11 Brakes</a> for details.</li>
<li>Adjust the mirrors.</li>
<li>Check that you and all the passengers have properly fastened the seat belts.</li>
<li>Check that all the warning lights come on as the engine switch is pressed to change the ignition mode to ON.</li>
<li>Check all the gauges.</li>
<li>Check that the brake system warning light (if parking lever equipped) or Parking brake operation indicator light (for EPB equipped) turns off when the parking brake is released.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>It is normal for water to drip from the air conditioning system while and after use.</p>
</div>
<p>Once a week, or each time you fill your fuel tank, or before a long distance drive (e.g. highway driving), perform the following under-hood checks:</p>
<ol>
<li>Engine oil level</li>
<li>Coolant level</li>
<li>Brake fluid level</li>
<li>Battery fluid (acid) level</li>
<li>Windshield washer fluid level</li>
<li>Hood latch operation — Pull the hood release lever inside the vehicle. Check that you cannot open the hood further without releasing the secondary latch. Close the hood securely after checking for proper latch operation. See the item "All latches, hinges and locks" of "Chassis, body and others" in "Maintenance Schedule" in the "INSPECTION AND MAINTENANCE" section for the lubrication schedule.</li>
</ol>
<p>Once a month, or each time you fill your fuel tank, check the tyre pressure using a tyre pressure gauge. Also check the tyre pressure of the spare tyre (optional).</p>
<h2>When You Notice the Following Symptoms</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>If you keep using your vehicle in the following conditions, malfunction and an accident may occur. Consult a Maruti Suzuki authorised workshop.</p>
<ul>
<li>Leaked oil or other liquid appears on the ground below the vehicle.</li>
<li>Brake fluid level is low.</li>
<li>There are unusual odors, sounds or vibrations.</li>
<li>The feeling of operating the steering wheel or the brakes is different than usual.</li>
</ul>
</div>
<h2>Check the Tyre Pressure</h2>
<p>Periodically check and adjust the tyre pressure. The specified tyre pressure for the tyres of this vehicle can be confirmed by checking the tyre information label affixed to the opening of the driver's door.</p>
<p>Driving with insufficient tyre pressure can cause the sides of the tyre to wear, in addition to decreasing fuel efficiency.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Driving with extremely low tyre pressure can cause a tyre blowout (bursting) and may result in an accident. Do not drive with extremely low tyre pressure.</li>
<li>If the specified tyre pressure is not maintained, the full performance of the vehicle cannot be achieved and the following could occur, leading to accidents or malfunctions. Adjust the tyre pressure as specified.</li>
<li>Decreased driving stability</li>
<li>Longer distance required for braking</li>
<li>Accurate tyre rotation speed cannot be detected, which interferes with the following functions: Anti-lock Brake System (ABS), Emergency Stop Signal (ESS), Electronic Stability Program (ESP®), and some functions of Dual Sensor Brake Support II (DSBS II) (if equipped). For details, refer to "If accurate tyre rotation speed cannot be detected."</li>
</ul>
</div>
<p>To adjust the tyre pressure, refer to <a onclick="navigate('tyres')" href="javascript:void(0)">09-13 Tyres</a>.</p>
<h2>Check the Exhaust Pipe</h2>
<p>Periodically check the exhaust pipes for holes or cracks.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If leaks in exhaust pipes are present, exhaust gas could enter the vehicle and possibly cause carbon monoxide poisoning. If you feel that something is abnormal, consult a Maruti Suzuki authorised workshop.</p>
</div>
</template>

<template id="tpl-engine-switch">
<h1>Engine Switch / Power Switch</h1>
<p>The engine switch (vehicles without hybrid system) and the power switch (vehicles with hybrid system) are used to select the ignition mode.</p>
<h2>LOCK (OFF)</h2>
<p>This mode is for parking the vehicle. When this mode is selected by pressing the engine switch or the power switch and then any door (including the tailgate) is opened or closed, the steering will be locked automatically.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>For the vehicle with the hybrid system: If the shift lever is in a position other than P when turning off the hybrid system, the power switch will remain to ON, not to off.</p>
</div>
<h2>ACC</h2>
<p>Press the engine switch or the power switch to select this ignition mode to use such electric equipment as the audio system, outside rearview mirrors and accessory socket with the engine or the hybrid system off. When this position is selected, the information display in the instrument cluster shows the ACC ignition switch position message.</p>
<h2>ON</h2>
<p><strong>With the engine or the hybrid system off:</strong> You can use such electric equipment as the power windows and wipers with the engine or the hybrid system off. When this ignition mode is selected by pressing the engine switch or the power switch, the information display in the instrument cluster shows the ON ignition switch position message.</p>
<p><strong>With the engine or the hybrid system on:</strong> All electric equipment is operational. The vehicle can be driven when you have selected this ignition mode by pressing the engine switch or the power switch.</p>
<h2>START</h2>
<p><strong>Manual transmission vehicles:</strong> Provided you have the keyless push start system remote controller with you, the engine automatically starts when you press the engine switch to select this ignition mode after shifting to "N" (Neutral) and depressing the brake and clutch pedals.</p>
<p><strong>Automatic transmission vehicles / e-CVT vehicles:</strong> Provided you have the keyless push start system remote controller with you, the engine or the hybrid system automatically starts when you press the engine switch or the power switch to select this ignition mode after placing the gearshift lever in "P" (Park) position and depressing the brake pedal. (If you need to restart the engine or the hybrid system while the vehicle is moving, shift into "N".)</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not leave the engine switch or the power switch in ACC or ON mode when the engine is not running or the hybrid system is not operating. Avoid using the radio or other electric accessories for a long time when the engine switch or the power switch is in ACC or ON mode when the engine is not running or the hybrid system is not operating, otherwise the lead-acid battery may discharge.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>The steering will be unlocked when you press the engine switch or the power switch to change the ignition mode from LOCK (OFF) to ACC or ON.</li>
<li>You do not need to keep the engine switch or the power switch pressed until the engine or the hybrid system starts.</li>
<li>In the presence of strong radio wave or noise, you may not be able to change the ignition mode to ACC or ON or to start the engine or the hybrid system using the engine switch or the power switch. In this case, the information display in the instrument cluster will show a "Key Fob Not Detected" message.</li>
</ul>
</div>
<h2>Unreleased Steering Lock Warning</h2>
<p>If the steering lock remains engaged when you press the engine switch or the power switch to change the ignition mode to ON, the information display in the instrument cluster shows a warning message and you cannot start the engine or the hybrid system. If this happens, press the engine switch or the power switch while turning the steering wheel to the right or left.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The steering lock may not be released and the immobilizer/keyless push start system warning light turns on if some load is applied on the steering wheel. If this happens, turn the steering wheel to the right or left to relieve it from the load before you press the engine switch or the power switch again to change to the desired ignition mode.</li>
<li>For the vehicle with the hybrid system: To prevent the steering lock motor from overheating, the motor may be suspended if the hybrid system is turned on and off repeatedly in a short period of time. In this case, refrain from operating the power switch. After about 10 seconds, the steering lock motor will resume functioning.</li>
</ul>
</div>
</template>

<template id="tpl-immobilizer">
<h1>Immobilizer System</h1>
<p>This system is designed to help prevent vehicle theft by electronically disabling the engine starting system or the hybrid system.</p>
<p>The engine or the hybrid system can be started only with your vehicle's original keyless push start system remote controller, which has an electronic identification code programmed in it. The remote controller communicates the identification code to the vehicle when the engine switch or the power switch is pressed to change the ignition mode to ON. If you need to make spare remote controllers, consult a Maruti Suzuki authorised workshop. The vehicle must be programmed with the correct identification code for the spare remote controllers.</p>
<p>When you press the engine switch or the power switch to change the ignition mode to ON, the immobilizer system will be released and the immobilizer/keyless push start system warning light will turn on for about 2 seconds and then it will turn off.</p>
<p>When you press the engine switch or the power switch to change the ignition mode to LOCK (OFF), the immobilizer system will operate.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>If the immobilizer system is modified or removed, it cannot be properly operated. Do not modify or remove the immobilizer system.</p>
<p><strong>NOTE:</strong> This immobilizer system is maintenance-free.</p>
</div>
<h2>Immobilizer / Keyless Push Start System Warning Light</h2>
<p>This light will be shown on the instrument cluster.</p>
<ul>
<li>If there is an abnormality on the immobilizer system or the keyless push start system, this light will turn on with the engine switch or the power switch in ON mode.</li>
<li>If this light blinks or turns on for about 5 seconds, you may not be able to start the engine or the hybrid system. Check the position of the keyless push start system remote controller, change the ignition mode to LOCK (OFF), and then change it back to ON. Also, refer to <a onclick="navigate('starting-engine')" href="javascript:void(0)">05-06 Starting Stopping Engine or Hybrid System</a> for details on starting the engine.</li>
<li>This light will blink when the remote controller outside warning operates as well. Refer to <a onclick="navigate('keyless-push-start')" href="javascript:void(0)">05-05 Keyless Push Start System</a> for the Remote Controller Outside Warning.</li>
</ul>
<div class="box notice">
<div class="box-label">Notice</div>
<p>The remote controller is a sensitive electronic instrument. To avoid damaging it:</p>
<ul>
<li>Do not expose it to impacts, moisture or high temperature such as on the dashboard under direct sunlight.</li>
<li>Keep it away from magnetic objects.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>If you lose your remote controller, ask your Maruti Suzuki authorised workshop as soon as possible to deactivate the lost one, and to make a new remote controller.</li>
<li>If you own other vehicles with immobilizer keys, keep those keys away from the engine switch or the power switch when using your Maruti Suzuki vehicle. Otherwise, the engine or the hybrid system may not be started because they may interfere with your Maruti Suzuki vehicle's immobilizer system.</li>
<li>If you attach any metal objects to the remote controller, it may not start the engine.</li>
</ul>
</div>
</template>

<template id="tpl-pedal">
<h1>Pedal</h1>
<p>The vehicle has three pedals for manual transmission models (clutch, brake, accelerator) and two pedals for automatic transmission / e-CVT models (brake, accelerator).</p>
<h2>Clutch Pedal (1)</h2>
<p><em>(Manual transmission only)</em></p>
<p>A clutch pedal is used to disengage the driving force to the wheels when starting the engine, stopping, or shifting the gearshift lever. Depressing the pedal disengages the clutch.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not drive with your foot resting on the clutch pedal. It could result in excessive clutch wear, clutch damage, or unexpected loss of engine braking.</p>
</div>
<h2>Brake Pedal (2)</h2>
<p>Your vehicle is equipped with either front and rear disc brakes or front disc brakes and rear drum brakes. Depressing a brake pedal applies both sets of brakes.</p>
<p>You may hear occasional brake squeal when you apply the brakes. This is a normal condition caused by environmental factors such as temperature, humidity, snow or dust, etc.</p>
<div class="box note">
<div class="box-label">Note</div>
<p><em>Automatic transmission</em> — You may hear an occasional sound when you release the brake pedal while the vehicle is in "D" (Drive) mode and about to move. This is a normal phenomenon.</p>
<p><strong>WARNING:</strong></p>
<ul>
<li>If brake squeal is excessive and occurs each time the brakes are applied, you should have the brakes checked by a Maruti Suzuki authorised workshop.</li>
<li>Do not apply brakes continuously or rest your foot on the brake pedal. This will result in overheating of the brakes which could cause unpredictable braking action, longer stopping distances, or permanent brake damage.</li>
</ul>
</div>
<h2>Accelerator Pedal (3)</h2>
<p>An accelerator pedal controls the speed of the engine. Depressing the accelerator pedal increases power output and speed.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Your vehicle is equipped with a Brake Override System. If you depress both the accelerator pedal and the brake pedal simultaneously, the engine power output / the hybrid system output may be suppressed.</p>
</div>
</template>

<template id="tpl-keyless-push-start">
<h1>Keyless Push Start System</h1>
<p>Provided the keyless push start system remote controller is within the interior workable area, you can use the engine switch for starting the engine or the hybrid system and selecting an ignition mode (ACC or ON). In addition, the following functions can be used:</p>
<ul>
<li>Keyless entry function. Refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in the "BEFORE DRIVING" section for details.</li>
<li>Locking and unlocking doors (including the tailgate) using a request switch. Refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in the "BEFORE DRIVING" section for details.</li>
<li>Immobilizer (anti-theft) function. Refer to <a onclick="navigate('immobilizer')" href="javascript:void(0)">05-03 Immobilizer System</a> in this section for details.</li>
</ul>
<p>The interior workable area is defined as all the interior spaces except for the space on the instrument panel or in the luggage compartment.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Even when the remote controller is in the interior workable area, if it is in any of the following conditions, you may not be able to start the engine or the hybrid system or to select the ignition modes, and the remote controller outside warning may be given:</li>
<li>The remote controller's battery is low.</li>
<li>The remote controller is affected by strong radio wave or noise.</li>
<li>The remote controller is in contact with or covered by a metallic object.</li>
<li>The remote controller is in a secluded stowage such as the glove box or a door pocket.</li>
<li>The remote controller is in the sun visor pocket or on the floor.</li>
<li>Even when the remote controller is outside the interior workable area, if it is in any of the following conditions, you may be able to start the engine or the hybrid system or to select the ignition mode. The remote controller outside warning may not be given at that time:</li>
<li>The remote controller is outside the vehicle but very close to a door.</li>
<li>The remote controller is on the instrument panel.</li>
<li>If the remote controller is located in the following places in the vehicle, the remote controller may be detected and the request switch may be activated depending on the radio wave condition. There is a risk that the remote controller may be trapped inside the vehicle:</li>
<li>On the instrument panel</li>
<li>Floor</li>
<li>Luggage compartment</li>
<li>Deep in storage compartments such as the glove box or a door pocket, etc.</li>
</ul>
<p>Refer to <a onclick="navigate('storage-area')" href="javascript:void(0)">07-08 Storage Area</a> in the "OTHER CONTROLS AND EQUIPMENT" section.</p>
</div>
<h2>Engine Switch Illumination / Power Switch Illumination</h2>
<p>The engine switch or the power switch is illuminated (lit) in the following situations:</p>
<ul>
<li>When the engine is off and the driver's door is open, or for 15 seconds after the driver's door is closed. The illumination will fade out after 15 seconds.</li>
<li>While the headlights and/or the position lights are on, the illumination will turn on. The illumination will go out when the headlights and the position lights are turned off.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>To save the lead-acid battery, the illumination will be automatically turned off when both of the following conditions are simultaneously met:</p>
<ul>
<li>The headlights and the position lights are turned off.</li>
<li>15 minutes has elapsed since opening the driver's door.</li>
</ul>
</div>
<h2>Selection of Ignition Modes</h2>
<p>Press the engine switch or the power switch to select ACC or ON mode as follows when you use an electric accessory or check the operation of the instrument cluster without running the engine.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When selecting the ignition modes, the information display in the instrument cluster shows certain messages. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section.</p>
</div>
<ol>
<li>Bring the keyless push start system remote controller with you and sit in the driver's seat.</li>
<li><strong>Manual transmission</strong> – Without depressing the clutch pedal, press the engine switch.</li>
</ol>
<p>   <strong>Automatic transmission / e-CVT</strong> – Without depressing the brake pedal, press the engine switch or the power switch.</p>
<p>Every time you press the engine switch or the power switch, the ignition mode changes as follows:</p>
<p><strong>Manual transmission:</strong> LOCK (OFF) → ACC → ON → LOCK (OFF)</p>
<p><strong>Automatic transmission / e-CVT:</strong></p>
<ul>
<li>With gearshift lever in P: LOCK (OFF) → ACC → ON → LOCK (OFF)</li>
<li>With gearshift lever in a position other than P: Can cycle between ACC and ON, but cannot return to LOCK (OFF)</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Automatic transmission / e-CVT – If the gearshift lever is in any position other than "P", or if the knob button is pushed when the gearshift lever is in "P" position, the ignition mode cannot be returned to LOCK (OFF).</li>
<li>If the gearshift lever has a malfunction, you may not return the ignition mode to LOCK (OFF). Refer to "Returning Ignition Mode to LOCK (OFF)" in this section for details.</li>
</ul>
</div>
<h2>If the Master Warning Indicator Light Blinks and the Ignition Modes Cannot Be Selected</h2>
<p>Your keyless push start system remote controller may not be sensed as being within the interior workable area. Try again after checking that you have the remote controller with you. If the ignition modes still cannot be selected, the battery of the remote controller may be discharged. To select an ignition mode, use the following method:</p>
<ol>
<li><strong>Manual transmission</strong> – Without depressing the clutch pedal, push the engine switch.</li>
</ol>
<p>   <strong>Automatic transmission / e-CVT</strong> – Without depressing the brake pedal, press the engine switch or the power switch.</p>
<ol start="2">
<li>Within about 10 seconds while the master warning indicator light blinks and the information display shows "Place Key Fob on Start Switch", touch the engine switch or the power switch with the lock switch end of the remote controller for about 2 seconds.</li>
</ol>
<p>While the master warning indicator light blinks, the immobilizer/keyless push start system warning light will come on for about 5 seconds.</p>
<p>If you still cannot select the ignition modes, there may be another problem such as a discharged lead-acid battery. In this case, consult a Maruti Suzuki authorised workshop.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>You may customise the system to cause the interior buzzer to sound once as a warning that the remote controller is out of sensing range. For this customisation, consult a Maruti Suzuki authorised workshop.</li>
<li>If the battery of the remote controller is almost discharged, the information display in the instrument cluster shows a "Key Fob Low Battery" message when you press the engine switch or the power switch to change the ignition mode to ON. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section for details. For details on replacing the battery, refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in the "BEFORE DRIVING" section.</li>
</ul>
</div>
<h2>Remote Controller Outside Warning</h2>
<p>When either of the following conditions is met, the system triggers the remote controller outside warning by sounding the interior and exterior buzzers. At the same time, the immobilizer/keyless push start system warning light comes on, the master warning indicator light blinks and the information display in the instrument cluster shows the corresponding message:</p>
<ul>
<li>Any door is opened and then closed while the remote controller is not inside the vehicle and the engine is running (or the hybrid system is operating), or the ignition mode has been changed to ACC or ON by pressing the engine switch or the power switch.</li>
<li>The remote controller is not inside the vehicle when you attempt to start the engine or the hybrid system after changing the ignition mode to ACC or ON.</li>
</ul>
<p>If the warning is given, place the remote controller inside the vehicle as soon as possible.</p>
<ul>
<li>Any attempt to start the engine or the hybrid system will fail while the warning is active. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section for details.</li>
<li>Normally, the immobilizer/keyless push start system warning light should go out and the master warning indicator light should stop blinking shortly after the remote controller is brought back inside the vehicle. If they remain lit and blinking, change the ignition mode to LOCK (OFF) by pressing the engine switch or the power switch, then perform the engine starting operation or the strong hybrid starting operation. Refer to <a onclick="navigate('starting-engine')" href="javascript:void(0)">05-06 Starting Stopping Engine or Hybrid System</a> in this section.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Always keep the remote controller with you as the driver.</p>
</div>
</template>

<template id="tpl-starting-engine">
<h1>Starting / Stopping Engine or Hybrid System</h1>
<h2>Starting Engine or Hybrid System</h2>
<ol>
<li>Check that the parking brake is set fully.</li>
<li>Turn off such loads as the headlights and air conditioning system to facilitate starting of the engine or the hybrid system.</li>
<li><strong>Manual transmission vehicles:</strong> Shift into "N" (Neutral). Hold the clutch pedal and brake pedal fully depressed.</li>
</ol>
<p>   <strong>Automatic transmission vehicles / e-CVT vehicles:</strong> If the gearshift lever is not in "P" (Park) position, shift into "P" (Park). Hold the brake pedal fully depressed.</p>
<ol start="4">
<li>The "PUSH START SWITCH" message will appear in the information display in the instrument cluster.</li>
<li><strong>Vehicles without the hybrid system:</strong> With your foot taken off the accelerator pedal, push the engine switch. When the engine is started, the starter motor will automatically stop.</li>
</ol>
<p>   - Even if you fail to start the engine, the starter motor will stop turning automatically after approximately 12 seconds. In this case, press the engine switch to select LOCK (OFF) mode and restart the engine.    - If there is a problem with the system, the engine will not start automatically even if the switch is pressed. If the starter motor does not turn or stops immediately, start the engine by the following procedure:      - a. Press the engine switch to select the ON mode.      - b. Perform the above procedure steps 1) to 3).      - c. Keep the engine switch pressed until the engine starts. Release your finger from the engine switch after the engine has started.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>If the engine does not start, press the engine switch to select LOCK (OFF) mode and wait for more than 30 seconds before trying again, for protection of the lead-acid battery and the starter motor. If the engine does not start after several attempts, consult a Maruti Suzuki authorised workshop.</li>
<li>Do not try to start the engine by pushing or towing the vehicle, or coasting down a hill. This starting method could result in damage to the catalytic converter or damage to other parts.</li>
</ul>
</div>
<ol start="6">
<li><strong>Vehicles with the hybrid system:</strong> With your foot taken off the accelerator pedal, push the power switch. If there is a problem with the system, the hybrid system will not start automatically even if the switch is pressed.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Do not try to start the hybrid system by pushing or towing the vehicle, or coasting down a hill. This starting method could result in damage to the catalytic converter or damage to other parts.</li>
<li>During normal driving, do not turn off the hybrid system. Turning the hybrid system off while driving will not cause loss of steering or braking control, however, power assist to the steering will be lost. This will make it more difficult to steer smoothly, so you should pull over and stop the vehicle as soon as it is safe to do so.</li>
</ul>
</div>
<ol start="7">
<li><strong>Vehicles with the hybrid system:</strong> When the READY indicator in the meter is on, the hybrid system is working.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p><strong>WARNING (vehicles with hybrid system):</strong></p>
<ul>
<li>When starting the hybrid system, always start the hybrid system while sitting in the driver's seat. Do not depress the accelerator pedal while starting the hybrid system under any circumstances. Doing so may cause an accident resulting in death or serious injury.</li>
<li>If hybrid system failure occurs while the vehicle is moving, do not lock or open the doors until the vehicle reaches a safe and complete stop. Activation of the steering lock in this circumstance may lead to an accident, resulting in death or serious injury.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>You do not need to keep the engine switch or the power switch pressed to start the engine or the hybrid system.</li>
<li>Manual transmission vehicles: The engine of a manual transmission vehicle will not start unless the clutch pedal is depressed.</li>
<li>Automatic transmission vehicles have a starter interlock device:</li>
<li>When the vehicle is stopped and you try to start the engine for the first time with the ignition mode OFF, you can start the engine only with the gearshift lever in "P" position.</li>
<li>When you are driving the vehicle and press the engine switch to change the ignition mode to OFF, you can start the engine with the gearshift lever in "N" position.</li>
<li>e-CVT vehicles have a starter interlock device:</li>
<li>When the vehicle is stopped and you try to start the hybrid system for the first time with the ignition mode OFF, you can start the hybrid system only with the gearshift lever in "P" position.</li>
<li>When you are driving and press the power switch to change the ignition mode to OFF, you can start the hybrid system with the gearshift lever in "N" position.</li>
<li>During the engine starting procedure or the hybrid system starting procedure, messages on the information display will help you. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section for details.</li>
<li>When the engine stalls at an intersection, railway crossing, etc., restart the engine by the usual procedure.</li>
<li>For the vehicle with the hybrid system:</li>
<li>When operating the power switch, one short, firm press is enough. It is not necessary to press and hold the switch. If the "READY" indicator turns on, the hybrid system will operate normally. Continue depressing the brake pedal until the "READY" indicator is illuminated. The hybrid system can be started from any power switch mode.</li>
<li>If the power switch is not pressed shortly and firmly, the power switch mode may not change or the hybrid system may not start.</li>
<li>If attempting to restart the hybrid system immediately after turning the power switch off, the hybrid system may not start in some cases. After turning the power switch off, wait a few seconds before restarting the hybrid system.</li>
<li>If the hybrid system does not start, the immobilizer system may not have been deactivated. Consult a Maruti Suzuki authorised workshop.</li>
<li>During winter driving conditions, when starting the hybrid system, the flashing time of the "READY" indicator may be long. Leave the vehicle as it is until the "READY" indicator is steady on, as steady means the vehicle is able to move.</li>
<li>When the hybrid battery (traction battery) is extremely cold (below approximately −30°C [−22°F]), it may not be possible to start the hybrid system. Try to start the hybrid system again after the temperature of the hybrid battery increases.</li>
<li>When starting the hybrid system, if the hybrid system becomes difficult to start, consult a Maruti Suzuki authorised workshop.</li>
</ul>
</div>
<h2>Stopping Engine or Hybrid System</h2>
<ul>
<li>Depress the engine switch or the power switch to stop the engine or the hybrid system after the vehicle has stopped completely.</li>
<li>If the engine remains stopped for a while after it was stopped unexpectedly or was raced before stopping, a clicking sound may be heard from around the engine when it is restarted. This is not a malfunction. Always let the engine idle before stopping it.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Except in cases of emergency, do not stop the engine or the hybrid system while the vehicle is in motion. If you stop the engine or the hybrid system while the vehicle is in motion, the steering wheel will lock and you will not be able to steer the vehicle. This may result in an accident. Avoid stopping the engine or the hybrid system while driving.</li>
<li>The following function will not operate if the engine or hybrid system is stopped while driving: SUZUKI SAFETY SUPPORT</li>
</ul>
<p><strong>NOTICE:</strong></p>
<ul>
<li>Automatic transmission vehicles / e-CVT vehicles: If you stop the engine or the hybrid system while the vehicle is in motion, the automatic transmission / e-CVT may be damaged. Avoid stopping the engine or the hybrid system while driving.</li>
<li>To prevent 12-volt battery discharge, do not stop the hybrid system when the shift lever is in a position other than P. If the hybrid system is stopped in another shift lever position, the power switch will not be turned off and will remain ON. If the vehicle is left in ON, battery discharge may occur.</li>
</ul>
</div>
<p>For the vehicle with the hybrid system, if the hybrid system is stopped with the shift lever in a position other than P, the power switch will not be turned off. Perform the following procedure to turn the switch off:</p>
<ol>
<li>Check that the parking brake is set.</li>
<li>Shift the shift lever to P.</li>
<li>Check that "ON" of the ignition mode is displayed on the information display and press the power switch shortly and firmly.</li>
<li>Check that "ACC" or "ON" of the ignition mode on the information display is off.</li>
</ol>
<h2>Emergency Stop</h2>
<p>In case of emergency, you can stop the engine or the hybrid system by quickly pushing the engine switch or the power switch more than 3 times, or by pushing and holding the engine switch or the power switch for more than 2 seconds while the vehicle is in motion.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Except in cases of emergency, do not stop the engine or the hybrid system while the vehicle is in motion. The steering and braking operation will require more effort when the engine or the hybrid system is stopped. Refer to "Braking" in this section.</li>
<li>For the vehicle with the hybrid system: If the hybrid system has to be turned off while driving, power assist for the steering wheel will be lost, making the steering wheel heavier to turn. Decelerate as much as possible before turning off the hybrid system.</li>
</ul>
</div>
<h2>If the Master Warning Indicator Light Blinks and the Engine or the Hybrid System Cannot be Started</h2>
<p>Your keyless push start system remote controller may not be sensed as being within the interior workable area. Try again after checking that you have the remote controller with you. If the engine or the hybrid system still cannot be started, the battery of the remote controller may be discharged. To start the engine or the hybrid system, use the following method:</p>
<ol>
<li>Check that the gearshift lever is in "P" (Park) position and keep depressing the brake pedal fully.</li>
<li>If a "Push Start Switch" message is shown on the information display in the instrument cluster, press the engine switch or the power switch.</li>
<li>Within about 10 seconds while the master warning indicator light blinks and the information display shows "Place Key Fob on Start Switch", touch the engine switch or the power switch with the lock switch end of the remote controller for about 2 seconds.</li>
</ol>
<p>While the master warning indicator light blinks, the immobilizer/keyless push start system warning light will come on for about 5 seconds.</p>
<p>If you still cannot start the engine or the hybrid system, there may be another problem such as a discharged lead-acid battery. In this case, consult a Maruti Suzuki authorised workshop.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>You may customise the system to cause the interior buzzer to sound once as a warning that the remote controller is out of sensing range. For this customisation, consult a Maruti Suzuki authorised workshop.</li>
<li>If the battery of the remote controller is almost discharged, the information display shows a "Key Fob Low Battery" message when you press the engine switch or the power switch to change the ignition mode to ON. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section for details. For details on replacing the battery, refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in the "BEFORE DRIVING" section.</li>
</ul>
</div>
<h2>Returning Ignition Mode to LOCK (OFF)</h2>
<p>Automatic transmission / e-CVT – To ensure safety, the ignition mode can be returned to LOCK (OFF) by pressing the engine switch or the power switch only when the gearshift lever is placed in "P" position without pressing the knob button.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>For automatic transmission / e-CVT, the ignition mode cannot be returned to LOCK (OFF) position if the gearshift lever is in any position other than "P".</p>
</div>
<p>Certain problems such as a fault in the engine system or the hybrid system may prevent the engine switch or the power switch from going back to LOCK (OFF) mode. If this happens, have the vehicle inspected by a Maruti Suzuki authorised workshop after doing the following:</p>
<ul>
<li>Lock the doors using the key to prevent theft. (The request switches and the keyless push start system remote controller cannot be used to lock them.)</li>
<li>Disconnect the negative cable from the lead-acid battery to prevent discharge.</li>
</ul>
<h2>LOCK (OFF) Mode Reminder Buzzer</h2>
<p>If the driver's door is opened without returning the ignition mode to LOCK (OFF) by pressing the engine switch or the power switch, a buzzer sounds to warn you of this condition.</p>
<ul>
<li>If you open the driver's door after pressing the engine switch or the power switch to change the ignition mode to ACC, the interior buzzer beeps intermittently.</li>
<li>The buzzer will stop sounding if you then push the engine switch or the power switch twice, bringing the ignition mode back to LOCK (OFF).</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Whenever you leave the vehicle, check that you have returned the ignition mode to LOCK (OFF) using the engine switch or the power switch and then lock the doors. Without returning the ignition mode to LOCK (OFF), you cannot use a request switch or keyless push start system remote controller to lock the doors.</p>
</div>
<h2>Steering Lock Warning Buzzer</h2>
<p>If the steering lock fails to engage due to a fault in the system when the ignition mode is turned to LOCK (OFF) by pressing the engine switch or the power switch and any door (including the tailgate) is opened or closed, the interior buzzer will warn you of this condition with repeated short beeps. If this happens, have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
</template>

<template id="tpl-parking-brake">
<h1>Parking Brake Lever (if equipped)</h1>
<p>The parking brake lever is located between the front seats. To set the parking brake, depress the brake pedal and pull the parking brake lever all the way up. To release the parking brake, depress the brake pedal and pull up slightly on the parking brake lever, push the button on the end of the lever with your thumb, and lower the lever to its original position.</p>
<p>For automatic transmission vehicles / e-CVT vehicles, always set the parking brake before moving the gearshift lever to "P" (PARK) position. If you park on an incline and shift into "P" before setting the parking brake, the weight of the vehicle may make it difficult to shift out of "P", or a sound and a shock may occur when you are ready to drive the vehicle. These are not malfunctions.</p>
<p>When preparing to drive the vehicle, move the gearshift lever out of "P" position before releasing the parking brake.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never drive your vehicle with the parking brake on: rear brake effectiveness can be reduced from overheating, brake life may be shortened, or permanent brake damage may result.</li>
<li>If the parking brake does not hold the vehicle securely or does not fully release, have your vehicle inspected by a Maruti Suzuki authorised workshop.</li>
<li>Always set the parking brake fully before leaving your vehicle or it may move, causing injury or damage. When parking, check that the gearshift lever is in one of the following positions:</li>
<li>1st gear or "R" (Reverse) for manual transmission vehicles.</li>
<li>"P" (Park) for automatic transmission vehicles / e-CVT vehicles.</li>
</ul>
<p>Remember, even though the transmission is in gear or in Park, you must set the parking brake fully.</p>
<ul>
<li>When parking the vehicle in extremely cold weather, the following procedure should be used:</li>
</ul>
<p>1. Set the parking brake. 2. Manual transmission – turn off the engine, then shift into reverse or first gear. Automatic transmission / e-CVT – shift into "P" (Park) and turn off the engine. 3. Get out of the vehicle and put chocks under the wheels. 4. Release the parking brake. When you return to your vehicle, first set the parking brake, and then remove the wheel chocks.</p>
<ul>
<li>Do not leave cigarette lighters, spray cans, soft drink cans or plastic articles (such as glasses, CD cases, etc.) in a sun-heated vehicle. The temperature inside the vehicle may cause the following:</li>
<li>Gas may leak from a cigarette lighter or spray can and may lead to a fire.</li>
<li>Glasses, plastic cards or CD cases, etc. may deform or crack.</li>
<li>Soft drink cans may fracture.</li>
</ul>
<p><strong>NOTICE:</strong> When parking the vehicle on a slope, set the parking brake, shift the gearshift lever to P and make sure that the vehicle does not move before you leave the vehicle.</p>
</div>
<h2>Parking Brake Reminder Buzzer</h2>
<p>A buzzer sounds intermittently to remind you to release the parking brake if you start the vehicle without fully releasing the parking brake. Check that the parking brake is fully released and the brake system warning light turns off.</p>
</template>

<template id="tpl-electric-parking-brake">
<h1>Electric Parking Brake (if equipped)</h1>
<p>The parking brake can be applied and released automatically or manually. When the electric parking brake (EPB) is in auto mode, the parking brake is applied automatically according to the position of the transmission. Additionally, you can manually apply or release the parking brake even in auto mode.</p>
<h2>How To Operate</h2>
<ol>
<li>Pull the electric parking brake switch up gently and securely to apply the parking brake. The electric parking brake operation indicator light turns on. When you need to apply the parking brake while driving in an emergency situation, pull the electric parking brake switch up continually.</li>
<li>Push the electric parking brake switch to release the parking brake. Depress the brake pedal when you operate the switch.</li>
</ol>
<h2>Electric Parking Brake Automatic Releasing Feature</h2>
<ul>
<li>After releasing the electric parking brake, the electric parking brake operation indicator light turns off.</li>
<li>When the electric parking brake operation indicator light blinks, push the electric parking brake switch again.</li>
</ul>
<h2>Setting Auto Mode to ON</h2>
<p>Depress the brake pedal while parking and pull the electric parking brake switch until the buzzer sounds and the multi-information display shows the message to set the auto mode to ON.</p>
<p>When the auto mode is set to ON, the parking brake operates as follows:</p>
<ul>
<li>When you move the gearshift lever to P (Park) from any other position, the parking brake is applied and the electric parking brake operation indicator light turns on.</li>
<li>To operate the gearshift lever, depress the brake pedal while parking. To release the parking brake, push the electric parking brake switch while depressing the brake pedal.</li>
</ul>
<h2>Setting Auto Mode to OFF</h2>
<p>Depress the brake pedal while parking and press and hold the electric parking brake switch until the buzzer sounds and the multi-information display shows the message to set the auto mode to OFF.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Parking brake operation:</p>
<ul>
<li>To release the parking brake, the ignition mode must be ON.</li>
<li>To operate the auto mode, the ignition mode must be ON.</li>
<li>It is normal that the brake pedal may move while the electric parking brake is operating.</li>
</ul>
</div>
<h2>Automatically Releasing Feature</h2>
<p>The parking brake can be released by depressing the accelerator pedal when the vehicle circumstances meet all of the following conditions:</p>
<ul>
<li>The driver's door is closed.</li>
<li>The driver's seat belt is fastened.</li>
<li>The engine warning lamp, brake warning lamp, and brake system warning lamp are off.</li>
<li>The gearshift lever is in any position other than P (Park) or N (Neutral).</li>
</ul>
<p>Depress the accelerator pedal gently. When the parking brake is not released by depressing the accelerator pedal, release it manually.</p>
<h2>System Messages</h2>
<p><strong>If the message "FREQUENT OPERATION TEMPORARILY DISABLED" is shown:</strong> The electric parking brake system may restrict its operation for overheating prevention if the system is operated repeatedly in a short time. Please avoid operating the switch, and the system will return to normal state shortly.</p>
<p><strong>If the message "PARKING BRAKE INSPECTION REQUIRED" or "PARKING BRAKE UNAVAILABLE" is shown:</strong> Operate the electric parking brake switch. If the message is shown continually, there may be a problem with the system. Have your vehicle inspected by a Maruti Suzuki authorised workshop immediately.</p>
<h2>Parking Brake Operating Noise</h2>
<ul>
<li>When the electric parking brake is operated (to be applied or released), an operating noise like a motor sound (whirring sound) may be heard. This is normal.</li>
<li>When you keep pulling the switch up during an emergency, a noise may be heard from the engine compartment along with pedal vibration. This is normal.</li>
</ul>
<h2>Electric Parking Brake Operation Indicator Light</h2>
<ul>
<li>When the parking brake is applied, the indicator comes on according to the ignition switch mode as follows: ON mode — the indicator continually comes on until the parking brake is released. Any mode other than ON — the indicator comes on for about 15 seconds.</li>
<li>When LOCK mode is selected by pressing the engine switch, the indicator stays on for about 15 seconds. This is normal.</li>
</ul>
<h2>When the Electric Parking Brake Switch Malfunctions</h2>
<p>The auto mode will be set to ON automatically.</p>
<h2>Parking Brake Engaged Warning Buzzer</h2>
<p>A buzzer sounds immediately and the message "RELASE PARKING BRAKE" is shown on the display if you drive the vehicle without fully releasing the parking brake (when the vehicle reaches a speed of 5 km/h).</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>The performance of the parking brake is limited. The following conditions can cause the vehicle to start moving unexpectedly, resulting in an accident, serious injury, or death. Do not park under the following conditions:</li>
<li>Parking on a steep slope.</li>
<li>Parking on an extremely slippery road.</li>
<li>For the Electric Parking Brake Switch: If the parking brake is unexpectedly released and the car starts moving, an accident, serious injury or death may result. Do not place objects near the switch. Also, do not let children operate the switch.</li>
</ul>
<p><strong>CAUTION:</strong></p>
<ul>
<li>When the lead-acid battery is running out, you cannot operate the electric parking brake.</li>
<li>When you cannot release the parking brake because of a system malfunction or problems: Never drive your vehicle with the parking brake engaged. Doing so can reduce rear brake effectiveness due to overheating, shorten brake life, and potentially cause permanent brake damage. Have your vehicle inspected immediately by a Maruti Suzuki authorised workshop.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>When parking the vehicle: Apply the parking brake, shift the gearshift lever to P and make sure that the vehicle does not move, before you leave the vehicle.</li>
<li>When a malfunction occurs in the system: Immediately stop in a safe place and check the warning indicators and messages.</li>
<li>When the brake system warning light (yellow colour) turns on: Refer to <a onclick="navigate('warning-indicator-lights')" href="javascript:void(0)">04-03 Warning and Indicator Lights</a> in the "INSTRUMENT CLUSTER" section.</li>
<li>For instructions on using the electric parking brake in winter: Refer to <a onclick="navigate('brakes-maint')" href="javascript:void(0)">09-11 Brakes</a> for parking brake precautions in cold weather.</li>
</ul>
</div>
<h2>Brake Hold (if equipped)</h2>
<p>When the gearshift lever is in D or N and the brake hold system is turned on, the system keeps the brake applied after releasing the brake pedal. When the gearshift lever is in D, the system is released by depressing the accelerator pedal and you can start to drive the vehicle smoothly.</p>
<h3>Turning on the System</h3>
<p>When the system is turned on by pressing the brake hold switch (1), the brake hold standby system indicator light (2, white) turns on. The brake hold operation indicator light (3, green) turns on while the brake is being held.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>System activation conditions — You cannot turn the system on under the following conditions:</p>
<ul>
<li>The driver's door is not closed firmly.</li>
<li>The driver's seat belt is unfastened.</li>
<li>The messages "PARKING BRAKE INSPECTION REQUIRED" and/or "BRAKE HOLD INSPECTION REQUIRED" are shown on the display.</li>
</ul>
</div>
<p>When the brake hold system detects any of the above situations, the brake hold standby indicator light (white) goes off. If any of the above conditions are detected while the brake hold system is active, the system will turn OFF, the brake hold operation indicator light (green) will go off, and a message "PARKING BRAKE AUTO ACTIVATED" will be displayed on the multi-information display along with a warning buzzer sound, and the parking brake will be applied automatically.</p>
<h3>About Brake Hold</h3>
<ul>
<li>If the brake pedal is not depressed for about three minutes while the brake hold system is active, the parking brake is applied automatically and a message will be displayed along with a buzzer sound.</li>
<li>When driving the vehicle on a slope, the brake hold system may not activate, and you will need to depress the brake pedal. At the same time, a message will be displayed along with a warning buzzer sound. Follow the instructions shown on the display.</li>
<li>To turn off the system while it is active, depress the brake pedal and press the brake hold switch again.</li>
</ul>
<h3>When the Parking Brake is Applied Automatically While the System is Holding the Brake</h3>
<p>Release the parking brake when starting the vehicle by performing one of the following operations:</p>
<ul>
<li>Move the gearshift lever into a position other than P or N with the driver's seat belt fastened, driver door closed, and depress the accelerator pedal.</li>
<li>Release the parking brake manually by pushing the electric parking brake switch while depressing the brake pedal.</li>
</ul>
<p>After completing one of the procedures, make sure to check that the electric parking brake operation indicator light goes off. Refer to "Electric Parking Brake (if equipped)" in this section.</p>
<h3>When Your Vehicle Needs to be Inspected</h3>
<ul>
<li>If the brake hold standby indicator light does not come on by pressing the brake hold switch under the proper operating condition, there may be some problem with the system. Have your vehicle inspected by a Maruti Suzuki authorised workshop immediately.</li>
<li>If the message "BRAKE HOLD INSPECTION REQUIRED" is shown: There may be some problem with the system. Have your vehicle inspected by a Maruti Suzuki authorised workshop immediately.</li>
</ul>
<h3>About the Brake Hold System Operation</h3>
<p>When you depress the brake pedal while the system is holding the brake, you feel that the pedal is heavier than usual. This is normal.</p>
<h3>Warning Messages and Buzzers</h3>
<p>Warning messages and buzzers are used to indicate a system malfunction or to inform the driver of the need for caution. If a warning message is shown in the multi-information display, read the message and follow the instructions.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li><strong>Driving on a steep hill:</strong> Be careful to use the brake hold system when you drive on a steep hill. The system may not be able to hold the brake on a steep hill so that the vehicle may start moving unexpectedly.</li>
<li><strong>Driving on a slippery road:</strong> The system cannot keep holding the brake beyond the tyre grip performance limit. Avoid driving on a slippery road.</li>
<li><strong>Parking the vehicle:</strong> The brake hold system is not a feature for parking the vehicle for a long time. When you change the ignition mode to LOCK (OFF) while the system is active, the brake is released from the hold so that the vehicle may start moving unexpectedly. When you change the ignition mode to LOCK (OFF), depress the brake pedal firmly, shift to "P" (Park), and apply the parking brake.</li>
</ul>
</div>
</template>

<template id="tpl-parking-precautions">
<h1>Precaution for Parking</h1>
<h2>Apply the Parking Brake Firmly</h2>
<h3>When Parking the Vehicle on a Flat Place</h3>
<ol>
<li>For vehicles with the parking brake lever, depress the brake pedal and pull the parking brake lever to securely apply the parking brake.</li>
</ol>
<p>   For vehicles with the electric parking brake, depress the brake pedal and pull the electric parking brake switch to apply the parking brake. Ensure the electric parking brake operation indicator light turns on.</p>
<ol start="2">
<li>Move the gearshift lever into "P" (Park) position. Slowly release your foot from the brake pedal and check that the vehicle does not move.</li>
</ol>
<div class="box caution">
<div class="box-label">Caution</div>
<p>If you are using the parking brake during cold weather, sometimes it might become frozen and impossible to release. In this case, avoid parking on a slope and park in a flat place instead.</p>
<p><strong>NOTE:</strong> Even when parking the vehicle for a short time in a flat place, shift the gearshift lever into "P" (Park) position.</p>
</div>
<h3>When Parking the Vehicle on a Slope</h3>
<p>Perform steps 1) and 2) as described in "When parking the vehicle on a flat place", then:</p>
<ol start="3">
<li>Secure the vehicle by putting a commercially available wheel chock or a rock, etc. under the tyres so that the vehicle does not move.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Avoid parking on a steep slope. There is a risk of the vehicle accidentally moving without a driver, leading to a potential accident.</li>
<li>Be careful while parking on a steep hill. The system may not be able to hold the brake on a steep hill so that the vehicle may start moving unexpectedly.</li>
<li>The system cannot keep holding the brake beyond the tyre grip performance limit. Avoid driving on a slippery road or parking on a steep gradient.</li>
<li>For the electric parking brake switch: Do not put any object around the switch. Also, do not allow children to operate the switch. If the parking brake is applied or released unexpectedly, there is a risk of an accident.</li>
</ul>
<p><strong>NOTICE:</strong> When parking the vehicle on a slope, set the parking brake, shift the gearshift lever to P and make sure that the vehicle does not move before you leave the vehicle.</p>
</div>
<h2>When Moving the Vehicle</h2>
<p>When moving the vehicle, start the engine.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you coast with the engine off, stronger force than normal is required when turning the steering wheel or depressing the brake pedal, resulting in an accident. Do not coast on a downhill slope with the engine off.</p>
</div>
<h2>When Taking a Nap in the Vehicle</h2>
<p>Do not take a nap in the vehicle with the engine running.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Exhaust gases can enter the vehicle due to surrounding conditions and wind direction, possibly causing carbon monoxide poisoning.</li>
<li>The gearshift lever could change unintentionally, or the accelerator pedal could be depressed accidentally, causing an accident.</li>
<li>If you were to accidentally step on the accelerator pedal while you are asleep, the engine and the exhaust system could overheat, resulting in danger of fire.</li>
</ul>
</div>
<h2>With the Engine Running, the Cooling Fan (Radiator Fan) may Rotate Suddenly</h2>
<p>The cooling fan in the engine compartment may automatically stop and rotate depending on the conditions of the engine coolant temperature.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>If you get close to a rotating cooling fan (radiator fan), your hands, hair and clothing may get caught in it, resulting in personal injury. Even when the cooling fan has stopped, it may automatically rotate again. Therefore, do not get close to the cooling fan (radiator fan).</li>
<li>For the vehicle with the hybrid system: After the hybrid system has been turned off, check that the "READY" indicator is off. When the hybrid system is operating, the gasoline engine may automatically start, or the cooling fan may suddenly operate even if the gasoline engine stops. Do not touch or approach rotating parts such as the fan, which may lead to fingers or clothing (especially a tie, a scarf or a muffler) getting caught, resulting in serious injury.</li>
</ul>
</div>
<h2>When You Park the Vehicle Outside on a Snowy Day</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When you park the vehicle under the eaves or trees, fallen snow may hit the vehicle's roof and dent it. Do not park the vehicle under eaves or trees on a snowy day.</li>
<li>If you park the vehicle outside on a snowy day, the wiper arms may be deformed and the wiper blades may be frozen on the windshield due to the weight of snow. When you park the vehicle outside, raise the wiper arms.</li>
</ul>
</div>
<h2>Do not Park the Vehicle Near Flammable Materials</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you park the vehicle near flammable materials, the exhaust pipes and exhaust gas will get hot, resulting in danger of fire. Do not park the vehicle near flammable materials such as dry grass, paper waste and plywood.</p>
</div>
<h2>When Leaving the Vehicle, Stop the Engine and Lock Doors</h2>
<p>Even when leaving the vehicle for a short time, do not leave cash or valuables inside, as there is a risk of theft.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you leave the vehicle unattended with the engine running, problems such as fire or theft can occur. Do not leave the vehicle unattended with the engine running.</p>
</div>
<h2>Do not Leave the Computer and Mobile Phone in the Vehicle</h2>
<p>There is the possibility of theft, or these items could become damaged due to moisture, humidity or temperature change.</p>
<h2>Do not Leave Lighters and Eyeglasses in the Vehicle</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>As the inside of the vehicle becomes hotter when parking in areas where strong sunlight causes increased temperature, there is the danger of spontaneous ignition of lighters or spray cans, fire due to explosion, the deformation or cracking of eyeglasses, plastic cards or CD cases, or the rupture of carbonated beverage cans. When parking in those areas, do not leave lighters, spray cans, plastic products (eyeglasses, plastic cards, CD cases, etc.) or carbonated beverage cans in the vehicle.</li>
<li>When items get pushed around or when the seats are moved, it is possible that gas could escape and lead to a fire. Do not place accessories such as lighters or spray cans with exposed operating parts in the glove box, in storage compartments, between the seats, on the floor, etc.</li>
</ul>
</div>

<template id="tpl-transmission">
<h1>Using Transmission</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not hang any items on the gearshift lever and do not use the gearshift lever as a handrest. Otherwise, it could prevent proper operation of the gearshift lever and cause its malfunction, resulting in an accident.</p>
</div>
<h2>6-Speed Automatic Transmission</h2>
<h3>Gearshift Lever</h3>
<p>The gearshift lever is designed so that it cannot be shifted out of "P" position unless the ignition mode is ON and the brake pedal is depressed.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Always depress the brake pedal before shifting from "P" (Park) or "N" (Neutral) if the vehicle is stationary, to a forward or reverse gear, to help prevent the vehicle from moving unexpectedly when you shift.</p>
</div>
<p>The gearshift lever has a lock mechanism to help prevent accidental shifting. Shift the gearshift lever as follows:</p>
<ul>
<li>Shift with the knob button pushed in and the brake pedal depressed: from P to R.</li>
<li>Shift with the knob button pushed in: from R to P, from D to M or L, from N to R, from R to N, from M or L to D.</li>
<li>Shift without the knob button pushed in: all other shifts.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Always shift the gearshift lever without pushing in the knob button except when shifting in the cases listed above. If you always push in the knob button when shifting, you could accidentally shift into "P", "R", "M" or "L".</p>
<p><strong>WARNING:</strong> Operating the gearshift lever with the accelerator pedal depressed could cause the vehicle to suddenly start moving and lead to an accident. Never operate the gearshift lever with the accelerator pedal depressed.</p>
</div>
<h3>Gear Positions</h3>
<p><strong>P (Park):</strong> Use this position to lock the transmission when the vehicle is parked or when starting the engine. Shift into Park only when the vehicle is completely stationary.</p>
<p><strong>R (Reverse):</strong> Use this position to reverse the vehicle from stop. Make sure that vehicle is completely stationary before shifting into Reverse.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not shift the gearshift lever into "R" while moving forward, or the transmission may be damaged. If you shift into "R" when the vehicle speed is over 10 km/h, the transmission will not shift into reverse.</p>
</div>
<p><strong>N (Neutral):</strong> Use this position for starting the engine if the engine stalls and you need to restart it while the vehicle is moving. You may also shift into Neutral and depress the brake pedal to hold the vehicle stationary during idling.</p>
<p><strong>D (Drive):</strong> Use this position for all normal driving. With the gearshift lever in "D" range you can get an automatic downshift by pressing the accelerator pedal. The higher the vehicle speed is, the more you need to press the accelerator pedal to get a downshift.</p>
<p><strong>M (Manual mode):</strong> Use this position for driving in the manual mode. Refer to "Manual Mode" below for details.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If you move the gearshift lever to a lower gear while driving faster than the maximum allowable speed for the lower gear, the transmission will not actually downshift until your speed drops below the maximum speed for the lower gear.</p>
<p><strong>CAUTION:</strong> If you cannot press the engine switch firmly, the engine may not start. Even if you shift the gearshift lever into "R" or "D" position without the engine running, the vehicle does not move. If you try to move your vehicle under the above-mentioned condition, the vehicle may move in unexpected directions on a slope, etc. This may cause an accident. When starting the engine, press the engine switch firmly. Also, make sure that the engine is running by checking engine sound or warning and indicator lights.</p>
<p><strong>NOTICE:</strong> Be sure to take the following precautions to help avoid damage to the automatic transmission:</p>
<ul>
<li>Make sure that the vehicle is completely stationary before shifting into "P" or "R".</li>
<li>Do not shift from "P" or "N" to "R", "D" or "M" when the engine is running above idle speed.</li>
<li>Do not rev the engine with the transmission in a drive position ("R", "D" or "M") and the front wheels not moving.</li>
<li>Do not use the accelerator to hold the vehicle on a hill. Use the vehicle's brakes.</li>
</ul>
<p><strong>NOTE:</strong> When you shift the gearshift lever into "P" and stop the engine before depressing the parking brake pedal, if you try to restart the engine and shift the gearshift lever to a position other than "P", it may reduce gearshift lever capability, or unusual sound and shock may occur. However, this is not abnormal.</p>
</div>
<h3>Manual Mode</h3>
<p>The automatic transmission can shift gears automatically. When using the manual mode, you can shift gears in the same manner as a conventional manual transmission. To use the manual mode, shift the gearshift lever from "D" to "M". The information display shows the manual mode indicator and the current gear position.</p>
<p><strong>Shifting in the manual mode:</strong> You can shift gears from 1st to 6th depending on driving speed.</p>
<ul>
<li>When the engine is revved, the gear is shifted up automatically to prevent damage to the engine and the transmission.</li>
<li>When the driving speed becomes slow, the gear shifts down automatically, and when the vehicle stops, the gear position will be in 1st gear without shifting the gearshift lever.</li>
<li>If you depress the accelerator pedal a certain amount, the gear shifts down automatically even if the gearshift lever is in the manual mode.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>When you change gear, sometimes the transmission may not shift to the desired gear but a buzzer sounds instead. This is to maintain good driveability and to protect the transmission.</p>
</div>
<h3>Using the Shift Paddle</h3>
<p>To shift up, pull the "+" side shift paddle, located on the right side of the steering wheel, toward you. When you release your finger from the switch, the switch will return to the original position. To shift down, pull the "–" side shift paddle, located on the left side of the steering wheel, toward you.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>To shift gears continuously, release your finger from the shift paddle, then pull the shift paddle again. You cannot shift gears continuously while holding the shift paddle toward you.</li>
<li>When you pull both the "+" and "–" shift paddles simultaneously, the gear may not shift.</li>
</ul>
</div>
<p><strong>Canceling the manual mode:</strong> To cancel the manual mode, shift the gearshift lever from "M" to "D".</p>
<p><strong>Temporary manual mode:</strong> Pull the shift paddle toward you when driving with the gearshift lever in "D". The information display shows the manual mode indicator and the current gear position. The temporary manual mode will be cancelled automatically in the following situations:</p>
<ul>
<li>When you press and hold the accelerator pedal for a certain period of time without shifting gears.</li>
<li>When driving speed becomes slow.</li>
</ul>
<h3>If You Cannot Shift Automatic Transmission Gearshift Lever out of "P" (PARK)</h3>
<p>Automatic transmission vehicles have an electrically operated park-lock feature. If the vehicle's lead-acid battery is discharged, or there is some other electrical failure, the automatic transmission cannot be shifted out of Park in the normal way. Jump starting may correct the condition. If not, follow the procedure below. This procedure will permit shifting the transmission out of Park.</p>
<ol>
<li>Be sure the parking brake is firmly applied.</li>
<li>If the engine is running, stop the engine.</li>
<li>Make sure the ignition mode is ON or ACC.</li>
<li>Remove the cover by using a flat-bladed screwdriver covered with a soft cloth.</li>
<li>With the release button pushed by the key or the flat end rod, push the knob button and shift the gearshift lever to the desired position.</li>
</ol>
<p>This procedure is for emergency use only. If repeated use of this procedure is necessary, or the procedure does not work as described, take the vehicle to a Maruti Suzuki authorised workshop.</p>
<h2>Visually Check the Position of Gearshift Lever</h2>
<p>Visually check the position of the gearshift lever as follows:</p>
<ul>
<li>For starting or exiting the vehicle, the gearshift lever should be in "P".</li>
<li>For driving the vehicle forward, the gearshift lever should be in "D".</li>
<li>For driving the vehicle in reverse, the gearshift lever should be in "R".</li>
</ul>
<h2>Stopping the Vehicle Temporarily</h2>
<ol>
<li>With the gearshift lever in the driving position, stop the vehicle and firmly depress the brake pedal.</li>
</ol>
<p>   - To temporarily stop the vehicle on a steep slope, pull the parking brake lever if necessary.    - If you are likely to stop the vehicle for a long time, put the gearshift lever into "N".</p>
<ol start="2">
<li>To avoid making a mistake when starting to move the vehicle again, visually check that the position of the gearshift lever and the gear position indicator in the instrument cluster are correct, and that the parking brake is released.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If the gearshift lever is in the position other than "P" or "N", there is the danger that revving the engine could cause unexpected movement and result in an accident. When the vehicle is temporarily stopped, do not rev the engine.</p>
<p><strong>NOTICE:</strong> If you try to stop the vehicle on an uphill slope by operating the accelerator pedal, the transmission fluid will overheat, resulting in a malfunction. Do not stop the vehicle on an uphill slope by operating the accelerator pedal.</p>
</div>
<h2>Parking the Vehicle</h2>
<ol>
<li>Completely stop the vehicle.</li>
<li>With the brake pedal depressed, pull the parking brake lever firmly.</li>
<li>Shift the gearshift lever into "P", stop the engine and slowly release your foot from the brake pedal.</li>
<li>Visually check that the gearshift lever is in "P".</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If the gearshift lever is in the position other than "P", the shift lock will not operate, resulting in wrong operation of the gearshift lever and an accident. When you park the vehicle, shift the gearshift lever into "P" and then stop the engine.</p>
<p><strong>NOTE:</strong> When repeating forward and reverse movements, you may forget that the gearshift lever is in "R". Shortly after reversing the vehicle, shift the gearshift lever from "R" to "N".</p>
<p><strong>CAUTION:</strong> If you allow the vehicle to move backward by coasting while the gearshift lever is in a forward-driving position ("D" or "M"), or allow it to move forward by coasting while in a reverse-driving position ("R"), the engine could stall, reducing braking and steering capability and possibly resulting in an accident. Also, this could cause a malfunction of the vehicle. When driving the vehicle on slopes, do not perform the above-mentioned operations.</p>
</div>
</template>

<template id="tpl-gearshift-indicator">
<h1>Gearshift Indicator (if equipped)</h1>
<p>In the following cases, the gearshift indicator is indicated on the information display when the ignition mode is "ON":</p>
<ul>
<li>When the gearshift lever is in a position other than "N" (Neutral).</li>
<li>For vehicles equipped with the cruise control, when the system is not in use.</li>
</ul>
<p>The electronic control system monitors driving condition (such as vehicle speed and/or engine revolution), and it shows which gear position is optimal for your driving with the indication on the display.</p>
<p>If UP/DOWN arrow and the gear position other than currently selected are indicated on the display while driving, it is recommended to shift up or down the gear to the indicated position. It is the optimal gear position for a driving condition that reduces the over revolution and stress to the engine, and improves fuel consumption.</p>
<p>For details on how to use the transmission, refer to <a onclick="navigate('transmission')" href="javascript:void(0)">05-10 Using Transmission</a> in this section.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The gearshift indicator is designed to indicate optimal gear position for your driving, however, a driver will not be relieved from the duty of care of driving operation or gear change with this indicator. To drive safe, do not gaze the gearshift indicator; pay attention to your driving situation and shift up or down if necessary.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>The gearshift indicator is not indicated when the gear position is in "N" (Neutral).</li>
<li>If you depress the clutch pedal while UP/DOWN arrow is indicated, the indication will disappear.</li>
<li>In ordinary driving, UP arrow will disappear when you release your foot from the accelerator pedal.</li>
<li>The indication of gearshift indicator timing may differ depending on the vehicle condition and/or driving situation even in the same vehicle speed and engine revolution.</li>
<li>If any of the electrical systems such as the ESP® is working, the gearshift indicator will disappear temporarily.</li>
</ul>
</div>
<h2>Example of the Gearshift Indicator</h2>

<thead>
<tr><th>Indication</th><th>Description</th></tr>
</thead>

<tr><td>•3 (dot with 3)</td><td>Current gear position is optimal for the vehicle speed and/or engine revolution. In this case, 3rd gear position is the best.</td></tr>
<tr><td>↓2 (down arrow with 2)</td><td>Higher gear position is selected for the vehicle speed and/or engine revolution. Changing to a lower gear position is recommended. In this case, shifting down to 2nd gear position is recommended.</td></tr>

<template id="tpl-shvs">
<h1>SHVS (Smart Hybrid Vehicle by Suzuki) (if equipped)</h1>
<p>SHVS has an Integrated Starter Generator (ISG) instead of a conventional generator to get better fuel consumption. The ISG is a generator which incorporates a motor function.</p>
<p>The ISG has the following 3 functions:</p>
<ul>
<li>Deceleration energy regenerating function</li>
<li>Engine power assist function</li>
<li>Starter motor function</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Dripping engine oil, brake fluid and coolant, etc. to the ISG may cause a fire or malfunction. Do not spill them when pouring.</p>
</div>
<h2>Deceleration Energy Regenerating Function</h2>
<p>While decelerating your vehicle, the ISG generates electricity without engine power. This reduces engine loads and improves fuel consumption.</p>
<p>While decelerating your vehicle, the deceleration energy regenerating function will be activated when the following conditions are satisfied:</p>
<ul>
<li>Gearshift lever is not in "N" (Neutral).</li>
<li>Inside temperature of lead-acid battery is in normal condition.</li>
<li>Lithium-ion battery is not fully charged and inside temperature is in normal condition.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>The deceleration energy regenerating function may not work depending on vehicle conditions.</p>
</div>
<h2>Engine Power Assist Function</h2>
<p>While the vehicle is running, the ISG assists engine power as a motor in a limited condition. This reduces engine loads and improves fuel consumption.</p>
<p>While the vehicle is running with the engine speed at approximately 3900 rpm or less, the engine power assist function will be activated when all of the following conditions are satisfied:</p>
<ul>
<li>SHVS system and ENG A-STOP system are working properly. (ENG A-STOP OFF indicator light is not blinking.)</li>
<li>ESP® is not activated.</li>
<li>Accelerator pedal is excessively depressed.</li>
<li>Lead-acid battery and lithium-ion battery are fully charged and each inside temperature is in normal condition.</li>
<li>Engine coolant temperature is in normal condition.</li>
<li>ISG inside temperature is in normal condition.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>The engine power assist function may not work depending on vehicle conditions.</p>
</div>
<h2>Starter Motor Function</h2>
<p>After the engine auto stop by the ENG A-STOP system, the engine will be restarted using the cranking power of the ISG. The starting with the ISG is quiet compared with starting by the conventional starter motor.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When you restart the engine by pushing the engine switch, the conventional starter motor is used and you will hear a gear engagement sound.</p>
</div>
<h2>Lithium-ion Battery Indication</h2>
<p>The segments in the lithium-ion battery indicator give an approximate indication of the charge of the lithium-ion battery. The number of segments that appear in the indication increases or decreases with the charge of the lithium-ion battery.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>The indicator gives an approximate indication. The indication may be delayed or differ from the actual charge of the lithium-ion battery under certain conditions, for example when the outside temperature is low. Also, the minimum segment is 1 bar and the bar will never be 0. Even when 1 bar is shown, the battery level may be close to flat.</p>
</div>
<h2>Deceleration Energy Regenerating Indicator Light</h2>
<p>When the deceleration energy regenerating function is working, the deceleration energy regenerating indicator light comes on.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If the gearshift lever is in the "N" (Neutral) position, this light does not come on.</p>
</div>
<h2>ENG A-STOP OFF Light</h2>
<p>If this indicator blinks when driving, there may be something wrong with the ENG A-STOP system or the SHVS system. Have the system inspected by a Maruti Suzuki authorised workshop.</p>
</template>

<template id="tpl-hybrid-system">
<h1>Hybrid System (if equipped)</h1>
