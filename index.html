<template id="tpl-jump-starting">
<h1>Jump-starting Instructions</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never attempt to jump-start the vehicle if the lead-acid battery appears to be frozen — batteries in this condition may explode.</li>
<li>When making jump lead connections, keep your hands and the jump leads clear of pulleys, belts, and fans.</li>
<li>Lead-acid batteries produce flammable hydrogen gas. Keep flames and sparks away from the battery — never smoke when working near it.</li>
<li>If the booster battery is in another vehicle, check that the two vehicles are not touching each other.</li>
<li>If the lead-acid battery discharges repeatedly for no apparent reason, have the vehicle inspected at a Maruti Suzuki authorized workshop.</li>
</ul>
<p><strong>NOTICE:</strong></p>
<ul>
<li>Do not attempt to start the vehicle by pushing or towing — this can permanently damage the catalytic converter. Use jump leads to start a vehicle with a weak or flat battery.</li>
<li>Do not charge the 12-volt battery while the hybrid system is activating. Ensure all accessories are turned off.</li>
</ul>
</div>
<h2>Procedure</h2>
<img src="jump-start-k15c-connections.png" alt="K15C battery and jump lead connection points — (1) discharged battery, (2) booster battery, (3) engine mount bolt">
<p><strong>(1)</strong> = positive (+) terminal of the discharged battery | <strong>(2)</strong> = booster battery | <strong>(3)</strong> = engine mount bolt</p>
<ol>
<li>Use only a 12-volt lead-acid battery to jump-start the vehicle. Position the booster battery close enough for the jump leads to reach both batteries. If using a battery in another vehicle, ensure the two vehicles are not touching each other. Set the parking brakes fully on both vehicles.</li>
<li>Turn off all vehicle accessories, except those necessary for safety (e.g. headlights or hazard lights).</li>
<li>Connect the jump leads in the following order:</li>
</ol>
<p>   - <strong>Lead 1 —</strong> Connect one end to the <strong>positive (+) terminal of the discharged battery (1)</strong>.    - <strong>Lead 1 —</strong> Connect the other end to the <strong>positive (+) terminal of the booster battery (2)</strong>.    - <strong>Lead 2 —</strong> Connect one end to the <strong>negative (−) terminal of the booster battery (2)</strong>.    - <strong>Lead 2 —</strong> Connect the other end to an <strong>unpainted, heavy metal part of the engine — specifically the engine mount bolt (3)</strong> on the engine cylinder head of the vehicle with the discharged battery. Do not connect to the negative (−) terminal of the discharged battery.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Never connect the final jump lead directly to the negative (−) terminal of the discharged battery — an explosion may occur.</p>
<p><strong>CAUTION:</strong> Connect the jump lead to the engine mount bolt securely. If it disconnects due to engine vibration at start-up, the lead could be caught in the drive belts.</p>
</div>
<ol start="4">
<li>If the booster battery is in another vehicle, start that vehicle's engine and run it at moderate speed.</li>
<li>Start the engine of the vehicle with the discharged battery.</li>
<li>Remove the jump leads in the <strong>exact reverse order</strong> from which they were connected.</li>
</ol>
</template>

<template id="tpl-engine-trouble">
<h1>Engine Trouble</h1>
<h2>Starter Does Not Operate</h2>
<ol>
<li>Turn the ignition to START with the headlights on to check the battery condition.</li>
</ol>
<p>   - If the headlights go excessively dim or go off, the lead-acid battery is likely discharged or the battery terminal contact is poor. Recharge the battery or correct the terminal contact.</p>
<ol start="2">
<li>If the headlights remain bright, check the fuses. If the cause is not obvious, there may be a major electrical problem — have the vehicle inspected at a Maruti Suzuki authorized workshop.</li>
</ol>
<h2>Engine Does Not Start</h2>
<p>First check that the vehicle has enough fuel and that the battery is charged.</p>
<p>If the engine does not start in very cold conditions, press the accelerator pedal all the way to the floor and hold it while cranking.</p>
<p>Refer to <a onclick="navigate('starting-engine')" href="javascript:void(0)">05-06 Starting Stopping Engine or Hybrid System</a> if needed.</p>
<p>If the engine still does not start, have the vehicle inspected at a Maruti Suzuki authorized workshop.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Do not operate the starter motor for more than 12 seconds at a time.</p>
<p><strong>NOTE:</strong> If the engine refuses to start, the starter motor automatically stops after a set period. After it has auto-stopped, or if there is any abnormality in the starting system, the starter will only run while the engine switch is held pressed.</p>
</div>
<h2>Engine Overheating</h2>
<p>The engine may overheat temporarily under severe driving conditions. If the high engine coolant temperature warning light comes on, or the coolant temperature gauge indicates overheating while driving:</p>
<ol>
<li>Turn off the air conditioner.</li>
<li>Move the vehicle to a safe place and park.</li>
<li>Run the engine at normal idle speed for a few minutes until the warning light goes off or the temperature gauge returns to within the normal range (between "H" and "C").</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you see or hear escaping steam, stop the vehicle immediately in a safe place and turn off the engine. Do not open the hood while steam is present. Once the steam can no longer be seen or heard, open the hood to check whether the coolant is still boiling — if it is, wait until it stops before proceeding.</p>
</div>
<p>If the warning light does not go off or the temperature does not return to the normal range after following the steps above:</p>
<ol>
<li>Turn off the engine and check that the water pump belt and pulleys are not damaged or slipping. Correct any abnormality found.</li>
<li>Check the coolant level in the reservoir. If it is below the "LOW" line, check the radiator, water pump, radiator hoses, and heater hoses for leaks. If a leak that could cause overheating is found, do not run the engine until it has been fixed.</li>
<li>If no leak is found, carefully add coolant to the reservoir and then to the radiator if necessary. Refer to <a onclick="navigate('engine-coolant')" href="javascript:void(0)">09-05 Engine Coolant</a> for details.</li>
</ol>
<img src="engine-overheating-radiator-cap-warning.png" alt="Do not remove the radiator cap when the engine is hot">
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not remove the radiator cap when the coolant temperature is high — scalding fluid and steam may be blown out under pressure. Only remove the cap once the coolant temperature has lowered.</li>
<li>Keep hands, tools, and clothing away from the engine cooling fan and air-conditioner fan. These electric fans can turn on automatically without warning.</li>
</ul>
<p><strong>NOTE:</strong> If the engine overheats and you are unsure what to do, contact a Maruti Suzuki authorized workshop.</p>
</div>
</template>

<template id="tpl-corrosion">
<h1>Corrosion Prevention</h1>
<p>It is important to take good care of your vehicle to protect it from corrosion. Listed below are instructions for how to maintain your vehicle to prevent corrosion. Please read and follow these instructions carefully.</p>
<h2>Important Information about Corrosion</h2>
<h3>Common Causes of Corrosion</h3>
<ol>
<li>Accumulation of road salt, dirt, moisture or chemicals in hard-to-reach areas of the vehicle underbody or frame.</li>
<li>Chipping, scratches and any damage to treated or painted metal surfaces resulting from minor accidents or abrasion by stones and gravel.</li>
<li>Any or all of the below mentioned points:</li>
</ol>
<p>   - Continuous exposure to sunlight    - Hard water &amp; sea water coming in contact with vehicle    - Foot rubbing (skirting)</p>
<h3>Environmental Conditions Which Accelerate Corrosion</h3>
<ol>
<li>Road salt, dust control chemicals, sea breeze or industrial pollution will all accelerate the corrosion of metal.</li>
<li>High humidity will increase the rate of corrosion particularly when the temperature range is just above the freezing point.</li>
<li>Moisture in certain areas of a vehicle for an extended period of time may promote corrosion even when other body sections are completely dry.</li>
<li>High temperatures will cause an accelerated rate of corrosion to parts of the vehicle which are not well-ventilated to permit quick drying.</li>
</ol>
<p>This information illustrates the necessity of keeping your vehicle (particularly the underbody) as clean and dry as possible. It is equally important to repair any damage to the paint or protective coatings as soon as possible.</p>
<h2>How to Help Prevent Corrosion</h2>
<h3>Wash Your Vehicle Frequently</h3>
<p>The best way to preserve the finish on your vehicle and to help avoid corrosion is to keep it clean with frequent washing. Wash your vehicle at least once during the winter and once immediately after the winter. Keep your vehicle, particularly the underside, as clean and dry as possible. If you frequently drive on salted roads, your vehicle should be washed at least once a month during the winter. If you live near the ocean, your vehicle should be washed at least once a month throughout the year.</p>
<p>For washing instructions, refer to <a onclick="navigate('cleaning-ext')" href="javascript:void(0)">11-02 Cleaning Exterior</a>.</p>
<h3>Remove Foreign Material Deposits</h3>
<p>Foreign materials such as salts, chemicals, road oil or tar, tree sap, bird droppings and industrial fall-out may damage the finish of your vehicle if left on painted surfaces. Remove these types of deposits as quickly as possible. If these deposits are difficult to wash off, an additional cleaner may be required. Check that any cleaner you use is not harmful to painted surfaces and is specifically intended for your purposes. Follow the manufacturer's directions when using these special cleaners.</p>
<h3>Repair Finish Damage</h3>
<p>Carefully examine your vehicle for damage to the painted surfaces. Should you find any chips or scratches in the paint, touch them up immediately to prevent corrosion from starting. If the chips or scratches have gone through to the bare metal, have a qualified body shop make the repair.</p>
<h3>Keep Passenger and Luggage Compartments Clean</h3>
<p>Moisture, dirt or mud can accumulate under the floor mats and may cause corrosion. Occasionally, check under these mats to ensure that this area is clean and dry. More frequent checks are necessary if the vehicle is used for off-road driving or in wet weather. Certain cargos such as chemicals, fertilizers, cleaners, salts, etc. are extremely corrosive by nature. These products should be transported in sealed containers. If they are spilled or leaked, clean and dry the area immediately.</p>
<h3>Park Your Vehicle in a Dry, Well-Ventilated Area</h3>
<p>Park your vehicle to save it from continuous exposure to direct sunlight. Do not park your vehicle in a damp, poorly-ventilated area. If you often wash your vehicle in the garage and place it there in wet condition, your garage may be damp. The high humidity in the garage may cause or accelerate corrosion. A wet vehicle may corrode even in a heated garage if the ventilation is poor.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not apply additional undercoating or rust preventive coating on or around exhaust system components such as the catalytic converter and the exhaust pipes. It may catch a fire if the undercoating substance becomes overheated.</p>
</div>

<h2>For Keeping the Paintwork Beautiful</h2>
<p>To keep your vehicle's beautiful appearance for a long term, daily care is important.</p>
<ul>
<li>For parking and storing the vehicle, we recommend garages with good ventilation and locations with roofs.</li>
<li>The following situations may cause rusting and discoloration of the paint. Wash your vehicle promptly:
<ul>
<li>When driving in coastal areas or on roads sprayed with antifreeze agent (wash the underside of the vehicle and around the wheel wells especially)</li>
<li>When bird droppings, dead insects, sap, iron dust, soot or smoke residue, coal tar, etc. adhere to the paint or when the vehicle gets wet with acid rain</li>
<li>When the vehicle is dirty with dust or mud</li>
</ul>
</li>
<li>Give the vehicle a wax about once a month or whenever the water-repelling ability of the painted surfaces has declined. Follow all instructions on the package of the wax (sold separately).</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Do not use wax on plastic parts that are not coated. Waxing these surfaces could result in a whitened or uneven appearance.</p>
</div>
<ul>

<div class="box notice">
<div class="box-label">Notice</div>

</div>
<h2>Washing</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never attempt to wash and wax your vehicle with the engine running or the hybrid system activating.</li>
<li>When cleaning the underside of the body and fender, where there may be sharp-edged parts, wear gloves and a long-sleeved shirt to protect your hands and arms from being cut.</li>
<li>After washing your vehicle, carefully test the brakes before driving to check that they have maintained their normal effectiveness.</li>
<li>Do not splash or spill liquid in the vehicle, such as on the floor, in the hybrid battery (traction battery) air intake vent, and in the luggage compartment. Doing so may cause the hybrid battery, electrical components, etc. to malfunction or catch fire.</li>
<li>Before washing the vehicle, turn off the smart power tailgate.</li>
</ul>
<p><strong>NOTICE:</strong></p>
<ul>
<li>When washing or waxing the vehicle, do not lean on the vehicle body or do not push it hard. This might cause it to deform.</li>
<li>When washing or waxing the vehicle, do not put your foot on the door opening. This might cause it to damage.</li>
</ul>
</div>
<h3>Washing by Hand</h3>
<p>When washing the vehicle, park it in the place where direct sunlight does not fall on it as much as possible and follow the instructions below:</p>
<ol>
<li>Flush the underside of body and wheel housings with pressurized water to remove mud and debris. Use plenty of water.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Avoid directing steam or hot water of more than 80°C (176°F) on plastic parts.</li>
<li>For K15C engine model, to avoid damaging engine components, do not use pressurized water in the engine compartment.</li>
<li>For M15D engine model, to avoid damaging the hybrid system components, do not apply water in the engine components.</li>
</ul>
</div>
<ol start="2">
<li>Rinse the body to loosen the dirt. Remove dirt and mud from the body exterior with running water. You may use a soft sponge or brush. Do not use hard materials which can scratch the paint or plastic. Remember that the headlight covers or lenses are made of plastic in many cases.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>To avoid damage to the paint or plastic surface, do not wipe the dirt off without ample water. Follow the above procedure.</p>
</div>
<ol start="3">
<li>Wash the entire exterior with a mild detergent or car wash soap using a sponge or soft cloth. The sponge or cloth should be frequently soaked in the soap solution.</li>
</ol>
<div class="box notice">
<div class="box-label">Notice</div>
<p>When using a commercial car wash product, observe the cautions specified by the manufacturer. Never use strong household detergents or soaps.</p>
</div>
<ol start="4">
<li>Once the dirt has been completely removed, rinse off the detergent with running water.</li>
<li>Wipe off the vehicle body with a wet chamois or cloth and allow it to dry in the shade.</li>
<li>Check carefully for damage to painted surfaces. If there is any damage, touch up the damage following the procedure below:</li>
</ol>
<p>   1. Clean all damaged spots and allow them to dry.    2. Stir the paint and touch up the damaged spots lightly using a small brush.    3. Allow the paint to dry completely.</p>
<h3>Washing by an Automatic Car Wash</h3>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>If you use an automatic car wash, check that your vehicle's body parts, such as antenna and spoilers, cannot be damaged. If you are in doubt, consult the car wash operator for advice.</li>
<li>Do not wash a car with a roof end spoiler in an automatic car wash. It may get caught in the car wash and damage the spoiler.</li>
<li>Before washing the vehicle, turn off the smart power tailgate.</li>
</ul>
</div>
<h3>Washing by a High-Pressure Cleaner</h3>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>If you use a high-pressure cleaner, keep away the nozzle from your vehicle sufficiently.</li>
<li>Pointing the nozzle to the surrounding parts of camera can allow water to enter the camera. This may cause a fire, malfunction, dew condensation, etc.</li>
<li>For vehicle with 360 view camera or rear view camera, do not point the nozzle to the camera.</li>
<li>Bringing the nozzle to your vehicle too close or pointing the nozzle to the opening of front grill or bumper etc. can cause damage and malfunction of the vehicle body and parts.</li>
<li>Pointing the nozzle to door glasses and door frames can allow water to enter the cabin.</li>
</ul>
</div>
<h2>Caring for the Windshield</h2>
<p>If an oil film, etc. adheres to the windshield and the windshield wipers cannot clean it, use a glass cleaner (sold separately) to clean the windshield by hand.</p>
<h2>Caring for Lights</h2>
<p>Wash the lens part of light and wipe it off with a soft cloth.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Do not use the detergent including organic solvent on the lens surface of the light. The lens surface may be cracked. If you use the detergent including organic solvent, rinse it off with ample water.</li>
<li>Do not wipe the lens surface by wax or a hard brush. This may damage the lens or hasten its deterioration.</li>
</ul>
</div>
<h2>Caring for Cameras</h2>
<p>Wash the lens part of camera and wipe it off with a soft cloth. If the lens part is very dirty, use a mild detergent.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Using alcohol, benzine, thinner etc. to wipe the camera may cause discoloration. When you wipe the camera, do not use alcohol, benzine, thinner etc.</li>
<li>Hard coating is used for the lens of camera not to be easily scratched. However, if you use the brush for a vehicle, it may be difficult for you to see the image on the 360 view camera. Be very careful not to scratch the lens.</li>
<li>The resin cover of the camera may be damaged if an organic solvent adheres to the camera. Do not let organic solvent, body wax, oil film remover, or glass coating agent adhere to the product.</li>
<li>If the camera is subjected to a sudden temperature change, it may be damaged. Do not expose the camera to sudden temperature changes such as melting frozen snow with hot water.</li>
</ul>
</div>
<h2>Caring for Aluminum Wheels</h2>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Do not use an acidic or alkaline detergent, or a cleaner containing petroleum solvent to wash aluminum wheels. These types of cleaners will cause permanent spots, discoloration and cracks on the finished surface and damage to the center cap.</li>
<li>Do not use a bristle brush and a soap containing an abrasive material. These will damage the finished surface.</li>
</ul>
</div>
<h2>Waxing</h2>
<p>After washing the vehicle, waxing and polishing are recommended to further protect and beautify the paint.</p>
<ul>
<li>Only use waxes and polishes of good quality.</li>
<li>When using waxes and polishes, observe the precautions specified by the manufacturers.</li>
</ul>

<template id="tpl-cleaning-int">
<h1>Cleaning Interior</h1>
<ul>
<li>Clean out any dirt, sand, etc. using a vacuum cleaner, or wipe off the surfaces using a soft cloth moistened with cold or lukewarm water. If the interior is left dirty, scratches can occur.</li>
<li>Quickly clean off any liquids such as those from air fresheners or spilled beverages by using tissue paper or a soft cloth. Leaving spilled liquids can cause staining, discoloration or cracking.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not spray the interior with water or other liquids. If the navigation equipment, audio components, switches, wiring under the floor, or other electrical parts become wet, there is a risk of fire or malfunction, and the SRS airbag system could fail to function normally. If you pour water or spill a drink in the vehicle, consult a Maruti Suzuki authorised workshop as soon as possible for inspection.</p>
<p><strong>WARNING:</strong> When cleaning the interior or exterior of the vehicle, do not use flammable solvents such as lacquer thinners, petrol and benzene. Also, do not use cleaning materials such as bleaches and strong household detergents. The materials could cause personal injury or damage to the vehicle.</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>Do not use chemical products containing the following ingredients. Doing so may cause staining, discoloration, deformation, or a deterioration in strength, etc.: solvents such as benzine, gasoline, thinner, or sticker peeling agents; acidic or alkaline detergents; bleaches or dyes.</li>
<li>Do not use chemical products that include silicone for cleaning the areas around the air conditioner, electronic equipment such as the audio or navigation systems or switches. Contact with silicone may cause them to malfunction.</li>
<li>Do not leave colored leather goods, furs, vinyl articles, etc. in your vehicle for long periods. Doing so could cause discoloration or deformation of the interior.</li>
</ul>
<p><strong>NOTE:</strong> To prevent liquid-based air fresheners from spilling, it is recommended to fix their containers in place, or use solid-type air fresheners instead.</p>
</div>
<h2>Vinyl Upholstery</h2>
<p>Prepare a solution of soap or mild detergent dissolved in warm water. Apply the solution to the vinyl with a sponge or soft cloth and let it soak for a few minutes to loosen dirt. Rub the surface with a clean, damp cloth to remove dirt and the soap solution. If some dirt still remains on the surface, repeat this procedure.</p>
<h2>Fabric Upholstery (Except Front Passenger Seat)</h2>
<p>Remove loose dirt with a vacuum cleaner. Using a mild soap solution, rub stained areas with a clean damp cloth. To remove soap, rub the areas again with a cloth dampened with water. Repeat this until the stain is removed, or use a commercial fabric cleaner for tougher stains. If you use a fabric cleaner, carefully follow the manufacturer's instructions and precautions.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<ul>
<li>Do not spill liquid or semi-solid on the front passenger's seat. If you spill it on the front passenger's seat, immediately wipe it dry with a soft cloth. Contact of liquid with sensor may impact the function of seat belt reminder sensor.</li>
<li>Do not place any sharp or heavy object on passenger seat which can penetrate through seat upholstery and can cause damage to sensor.</li>
</ul>
</div>
<h2>Fabric Upholstery / Vinyl (For Front Passenger Seat)</h2>
<p>Do not use liquid for cleaning as it may penetrate the fabric and damage the seat sensor.</p>
<h2>Leather Upholstery</h2>
<p>Remove loose dirt with a vacuum cleaner. Using a mild soap or saddle soap solution, wipe dirt off with a clean damp soft cloth. To remove soap, wipe the areas again with a soft cloth dampened with water. Wipe the areas dry with a dry soft cloth. Repeat this until the dirt or stain is removed, or use a commercial leather cleaner for tougher dirt or stains. If you use a leather cleaner, carefully follow the manufacturer's instructions and precautions. Do not use solvent type cleaners or abrasive cleaners.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>In order to keep the leather upholstery looking good, it should be cleaned at least twice a year.</li>
<li>If the leather upholstery becomes wet, immediately wipe it dry with a tissue paper or a soft cloth. Water may cause the leather to harden and shrink if it is not wiped off.</li>
<li>When parking on sunny days, select a shady place or use a sunshade. If the leather upholstery is exposed to the direct sunlight for a long time, it may discolor and shrink.</li>
<li>As is common with natural materials, leather is inherently irregular in grain and cowhide has spots in its natural state. These do not affect the performance of the leather in any way.</li>
</ul>
</div>
<h2>Seat Belts</h2>
<p>Clean seat belts with mild soap and water. Do not use bleach or dye on the belts. They may weaken the fabric of the belts.</p>
<h2>Vinyl Floor Mats</h2>
<p>Ordinary dirt can be removed from vinyl with water or the mild soap. Use a brush to help loosen dirt. After the dirt is loosened, rinse the mat thoroughly with water and dry it in the shade.</p>
<h2>Carpets</h2>
<p>Remove the dirt and soil as much as possible with a vacuum cleaner. Using a mild soap solution, rub stained areas with a clean damp cloth. To remove soap, rub the areas again with a cloth dampened with water. Repeat this until the stain is removed, or use a commercial carpet cleaner for tougher stains. If you use a carpet cleaner, carefully follow the manufacturer's instructions and precautions.</p>
<h2>Instrument Panel and Console</h2>
<p>Remove loose dirt with a vacuum cleaner. Gently wipe dirt off with a tightly squeezed damp clean cloth. Repeat this until the dirt is removed.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Do not use chemical products that contain silicon to wipe electrical components such as the air conditioning system, audio, navigation system, or other switches. These will cause damage to the components.</li>
<li>Do not spray water or any liquid directly on instrument cluster or any other electrical or electronic components. This may cause damage and/or lead to non-functioning of the part.</li>
<li>Liquids such as liquid aromatics, soft drinks or juice may cause discoloration, wrinkles, and cracking to resin-based parts and textiles. Immediately wipe it dry with tissue paper or a soft cloth.</li>
<li>Do not leave leather products with color, fur or vinyl products, etc. in your vehicle for long periods. It may cause discoloration or deterioration of interior.</li>
</ul>
</div>
<h2>Inside of the Tailgate Window</h2>
<div class="box note">
<div class="box-label">Note</div>
<p>Wipe the window along the antenna wires or heat wires by a soft cloth dampened with water to avoid damaging these wires.</p>
</div>
<h2>Head-up Display</h2>
<p>The surface of the display is coated, so please wipe off the dirt with a soft cloth like an eyeglass wipe.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Do not use a hard cloth or detergent as it may damage the display or the surface coating.</li>
<li>Do not apply too much force when wiping the display or mirror, as it may damage it.</li>
</ul>
</div>

<template id="tpl-fuel-recommendation">
<h1>Fuel Recommendation</h1>
<h2>Petrol Engine</h2>
<h3>K15C Engine Model</h3>
<p>To avoid damaging the catalytic converter, you must use unleaded petrol with an octane number (RON) of 91 or higher.</p>
<h3>Gasoline/Ethanol Blends</h3>
<p>Blends of unleaded gasoline and ethanol, also known as gasohol, are commercially available in the country and can vary with location. Gasoline Ethanol blend up to E20 can be used as fuel for this vehicle.</p>
<h3>Gasoline Containing MTBE</h3>
<p>Unleaded gasoline containing MTBE (methyl tertiary butyl ether) may be used in your vehicle if the MTBE content is not greater than 15%. This oxygenated fuel does not contain alcohol.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Use of spurious, low quality, adulterated fuel can cause damage to the engine and engine auxiliaries, affect functioning of engine and degrade engine performance including but not limited to engine seizure.</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>The fuel tank has an air space to allow for fuel expansion in hot weather. If you continue to add fuel after the filler nozzle has automatically shut off or an initial blowback occurs, the air chamber will become full. Exposure to heat when fully fuelled in this manner will result in leakage due to fuel expansion. To prevent such fuel leakage, stop filling after the filler nozzle has automatically shut off, or when initial vent blowback occurs, if using an alternative non-automatic system.</li>
<li>Be careful not to spill fuel containing alcohol while refueling. If fuel is spilled on the vehicle body, wipe it up immediately. Fuels containing alcohol can cause paint damage, which is not covered under the New Vehicle Limited Warranty.</li>
</ul>
</div>

<h1>Setting Mode of Information Display (Type B)</h1>
<p>When the ignition mode is ON and the vehicle is stationary, you can enter into the setting mode of the information display by selecting the setting mode from the menu bar by pressing "&lt;" or "&gt;" of the selector switch (3) to scroll or move the screen.</p>
<h2>How to Switch to the Setting Mode</h2>
<p>The steering wheel controls used are:</p>
<ul>
<li><strong>(1)</strong> Up/down selector switch</li>
<li><strong>(2)</strong> OK switch</li>
<li><strong>(3)</strong> Left/right selector switch</li>
</ul>
<ol>
<li>To select the setting item that you want to change, select the setting mode from the menu bar and then select the item by moving the up/down selector switch (1).</li>
<li>To exit the setting mode, press "&lt;" or "&gt;" of the selector switch (3).</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The currently selected setting item is surrounded by a frame.</li>
<li>If you push and hold the indicator selector knob (1) to enter into the setting mode when the display (C) shows average fuel consumption, average speed, driving time, total idling stop time and total idling fuel saved (if equipped), the value will be reset simultaneously. If you do not want to reset the value, push the indicator selector knob quickly to switch the indication of the display.</li>
<li>If you press the engine switch or start to move the vehicle when the display is in the setting mode, the setting mode will be cancelled automatically.</li>
</ul>
</div>
<h2>How to Exit the Setting Mode</h2>
<p>Press "&lt;" or "&gt;" of the selector switch (3).</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You can exit the setting mode by either of the following operations:</p>
<ul>
<li>Press the engine switch to change the ignition mode to ACC or LOCK (OFF).</li>
<li>Start driving your vehicle.</li>

<h2>Adjusting the Clock (if equipped)</h2>
<p>You can adjust the clock on the information display.</p>
<ol>
<li>When the ignition mode is ON and the vehicle is stationary, push the left/right selector switch (3) to change the information display to the setting mode.</li>
<li>Select "Date/Time" and press the "OK" switch (2).</li>
<li>Select "Adjust clock" and press the "OK" switch (2).</li>
<li>Press selector up/down switch (1) "∧" up or down "∨" to adjust the clock.</li>
<li>To change the hour and minute indication press "&lt;" or "&gt;" of the switch (3). Press "OK" switch (2) after adjusting the clock.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>To exit the setting mode, press "&lt;" or "&gt;" of the selector switch (3).</p>
</div>
<h2>Adjusting the Date (if equipped)</h2>
<p>You can adjust the date on the information display.</p>
<ol>
<li>When the ignition mode is ON and the vehicle is stationary, push the left/right selector switch (3) to change the information display to the setting mode.</li>
<li>Select "Date/Time" and press the "OK" switch (2).</li>
<li>Select "Adjust date" and press the "OK" switch (2).</li>
<li>Press selector up/down switch (1) "∧" up or down "∨" to adjust the date.</li>
<li>To change the day, month and year indication press "&lt;" or "&gt;" of the switch (3). Press "OK" switch (2) after adjusting the date.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>To exit the setting mode, press "&lt;" or "&gt;" of the selector switch (3).</p>
</div>
<h2>Air Conditioning System Settings by ENG A-STOP System (if equipped)</h2>
<p>When using the automatic heating and air conditioning system while the engine is stopped automatically by the ENG A-STOP system, you can select one of the following settings via the setting mode of the information display:</p>
<ul>
<li>Standard</li>
<li>Economy</li>
<li>Comfort</li>
</ul>
<p>When "Economy" is selected, engine auto stop condition is eased, compared with "Standard". As engine auto stop condition will occur more frequently, the stop time will be longer, leading to reduction of fuel consumption.</p>
<p>When "Comfort" is selected, engine auto stop condition becomes severe, compared with "Standard". As engine auto stop condition will occur less frequently, the stop time will be shorter, leading to more comfortable cabin condition by air conditioner.</p>

<template id="tpl-regular-maintenance">
<h1>Daily Car Maintenance</h1>
<p>This checklist covers what to inspect on a daily basis, plus periodic checks that should be done weekly and monthly. All checks marked "daily" should be done before every drive.</p>
<h2>Before Every Drive</h2>
<p><strong>Exterior &amp; Visibility</strong></p>
<ul>
<li>Check that all windows, mirrors, lights, and reflectors are clean and unobstructed.</li>
<li>Visually inspect all four tyres for tread depth, abnormal wear, cracks or damage, loose wheel nuts, and any embedded foreign material (nails, stones, etc.).</li>
<li>Check under the car for any fluid or oil leakage on the ground.</li>
<li>Verify that the hood is fully closed and latched.</li>
<li>Test headlights, turn signal lights, brake lights, and horn for proper operation.</li>
</ul>
<p><strong>Cabin Checks</strong></p>
<ul>
<li>Adjust your seat and head restraint before starting.</li>
<li>Adjust all mirrors (rear-view and side mirrors) to your position.</li>
<li>Ensure all passengers have properly fastened their seat belts.</li>
<li>Press the engine start/stop button to switch to ON (without starting the engine) and verify that all warning lights illuminate momentarily — this confirms the bulb check is working.</li>
<li>Check all gauges (fuel level, temperature, etc.) for normal readings.</li>
<li>Test the brake pedal — it should feel firm with normal travel. Confirm the Electric Parking Brake (EPB) indicator light turns off when the EPB is released.</li>
</ul>
<h2>Weekly / Every Fuel Fill</h2>
<p>Perform these under-hood checks once a week, every time you fill the tank, or before any long-distance drive.</p>
<ul>
<li><strong>Engine oil level</strong> — check with dipstick; top up with the correct grade if low.</li>
<li><strong>Engine coolant level</strong> — check the reservoir; should be between MIN and MAX marks.</li>
<li><strong>Brake fluid level</strong> — check reservoir; should be between MIN and MAX marks.</li>
<li><strong>Battery electrolyte (acid) level</strong> — check that fluid covers the plates.</li>
<li><strong>Windshield washer fluid level</strong> — top up as needed.</li>
<li><strong>Hood latch operation</strong> — pull the interior release lever and confirm the hood cannot be lifted further without releasing the secondary latch, then close it securely.</li>
</ul>
<h2>Monthly / Every Tyre Inspection</h2>
<ul>
<li><strong>Tyre pressure</strong> — check all four tyres plus the spare using a tyre pressure gauge. The specified pressures are on the label inside the driver's door frame. Note: the TPMS warning light will alert you if pressure drops significantly, but a manual check is still recommended monthly.</li>
<li><strong>Exhaust pipe</strong> — visually check for any holes or cracks. A leaking exhaust can allow carbon monoxide into the cabin.</li>
</ul>
<h2>Warning Signs — Consult a Maruti Suzuki Authorised Workshop</h2>
<p>Do not continue driving if you observe any of the following:</p>
<ul>
<li>Oil or other liquid appearing on the ground below the parked vehicle.</li>
<li>Brake fluid level is low.</li>
<li>Unusual odors, sounds, or vibrations while driving.</li>
<li>The steering wheel or brake pedal feel different from normal.</li>
</ul>
</template>

    { page:'flat-tyre-repair', label:'Flat Tyre Repair Kit' },
    { page:'jump-starting', label:'Jump-starting Instructions' },
    { page:'battery-dead', label:'Running Out of Battery' },
    { page:'engine-trouble', label:'Engine Trouble' },
    { page:'warning-triangle', label:'Warning Triangle' }
  ]},
  { label:'Appearance Care', id:'sec-appearance', open:false, children:[
    { page:'appearance-overview', label:'Overview' },
    { page:'corrosion', label:'Corrosion Prevention' },
    { page:'cleaning-ext', label:'Cleaning Exterior' },
    { page:'cleaning-int', label:'Cleaning Interior' }
  ]},
  { label:'Specifications', id:'sec-specs', open:false, children:[
    { page:'specs-overview', label:'Overview' },
    { page:'vehicle-id', label:'Vehicle Identification' },
    { page:'fastag', label:'FASTag' },
    { page:'hsrp', label:'High Security Registration Plate' },
    { page:'fuel-recommendation', label:'Fuel Recommendation' },
    { page:'specifications', label:'Specifications' },
    { page:'display-settings', label:'Display Settings (Type B)' }
  ]},

    { page:'features', label:'Victoris ZXi Features' },

function buildNav() {
  var nav = document.getElementById('sidebar-nav');
  var html = '';
  navTree.forEach(function(section) {
    html += '<button class="nav-section-btn' + (section.open ? '' : ' collapsed') + '" onclick="toggleSection(\'' + section.id + '\')">' +
      '<span class="chevron">&#9660;</span>' +
      '<span class="nav-section-label">' + section.label + '</span>' +
      '</button>' +
      '<div class="nav-children' + (section.open ? '' : ' collapsed') + '" id="' + section.id + '">';
    section.children.forEach(function(item) {
      var avail = !!document.getElementById('tpl-' + item.page);
      html += '<button class="nav-item' + (avail ? '' : ' stub') + '" data-page="' + item.page + '"' +
        (avail ? ' onclick="navigate(\'' + item.page + '\')"' : '') + '>' +
        item.label +
        (avail ? '' : '<span class="soon-badge">soon</span>') +
        '</button>';
    });
    html += '</div>';
  });
  nav.innerHTML = html;
}

function toggleSection(id) {
  var children = document.getElementById(id);
  var btn = document.querySelector('.nav-section-btn[onclick*="\'' + id + '\'"]');
  var isCollapsed = children.classList.contains('collapsed');
  children.classList.toggle('collapsed', !isCollapsed);
  btn.classList.toggle('collapsed', !isCollapsed);
}

function navigate(pageId) {
  var tpl = document.getElementById('tpl-' + pageId);
  var content = document.getElementById('content');

  if (tpl) {
    var frag = tpl.content.cloneNode(true);
    content.innerHTML = '';
    content.appendChild(frag);
  } else {
    content.innerHTML = '<div class="stub-page"><h2>Coming soon</h2><p>This page will be added in the full release.</p></div>';
  }

  var meta = pagesMeta[pageId];
  if (meta && meta.section) {
    var bc = document.createElement('p');
    bc.className = 'breadcrumb';
    bc.innerHTML = '<a onclick="navigate(\'home\')" href="javascript:void(0)">Home</a><span>&#8250;</span>' +
      meta.section + '<span>&#8250;</span>' + meta.title;
    content.insertBefore(bc, content.firstChild);
  }

  var idx = pageOrder.indexOf(pageId);
  if (idx >= 0) {
    var navDiv = document.createElement('div');
    navDiv.className = 'page-nav';
    var prevId = idx > 0 ? pageOrder[idx - 1] : null;
    var nextId = idx < pageOrder.length - 1 ? pageOrder[idx + 1] : null;

    if (prevId) {
      var pb = document.createElement('button');
      pb.className = 'page-nav-btn';
      pb.innerHTML = '<span class="dir">&#8592; Previous</span><span class="lbl">' + pagesMeta[prevId].title + '</span>';
      pb.onclick = (function(p){ return function(){ navigate(p); }; })(prevId);
      navDiv.appendChild(pb);
    } else {
      navDiv.appendChild(document.createElement('div'));
    }
    if (nextId) {
      var nb = document.createElement('button');
      nb.className = 'page-nav-btn next';
      nb.innerHTML = '<span class="dir">Next &#8594;</span><span class="lbl">' + pagesMeta[nextId].title + '</span>';
      nb.onclick = (function(n){ return function(){ navigate(n); }; })(nextId);
      navDiv.appendChild(nb);
    }
    content.appendChild(navDiv);
  }

  document.querySelectorAll('.nav-item[data-page]').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-page') === pageId);
  });

  navTree.forEach(function(section) {
    var inSection = section.children.some(function(c){ return c.page === pageId; });
    if (inSection) {
      var children = document.getElementById(section.id);
      var btn = document.querySelector('.nav-section-btn[onclick*="\'' + section.id + '\'"]');
      if (children && children.classList.contains('collapsed')) {
        children.classList.remove('collapsed');
        btn.classList.remove('collapsed');
      }
    }
  });

  currentPage = pageId;
  location.hash = (pageId === 'home') ? '' : pageId;
  document.querySelector('.content-wrap').scrollTop = 0;
  closeSidebar();
}

function buildSearchIndex() {
  var docs = [];
  Object.keys(pagesMeta).forEach(function(id) {
    var tpl = document.getElementById('tpl-' + id);
    if (!tpl) return;
    var text = tpl.content.textContent.replace(/\s+/g,' ').trim();
    var meta = pagesMeta[id];
    docs.push({ id: id, title: meta.title.replace(/&amp;/g,'&'), section: meta.section || '', body: text });
    searchMeta[id] = { title: meta.title.replace(/&amp;/g,'&'), section: meta.section || '' };
  });
  searchIndex = lunr(function() {
    this.ref('id');
    this.field('title', { boost: 10 });
    this.field('section', { boost: 3 });
    this.field('body');
    docs.forEach(function(d){ this.add(d); }, this);
  });
}

function handleSearch(query) {
  var dropdown = document.getElementById('search-dropdown');
  if (!query.trim() || !searchIndex) { dropdown.classList.remove('visible'); return; }
  try {
    var results = searchIndex.search(query + '* ' + query);
    if (!results.length) {
      dropdown.innerHTML = '<div class="no-results">No results found</div>';
    } else {
      dropdown.innerHTML = results.slice(0,6).map(function(r) {
        var d = searchMeta[r.ref];
        return '<div class="search-result" onclick="selectResult(\'' + r.ref + '\')">' +
          '<div class="search-result-title">' + d.title + '</div>' +
          '<div class="search-result-section">' + (d.section || 'Home') + '</div>' +
          '</div>';
      }).join('');
    }
    dropdown.classList.add('visible');
  } catch(e) { dropdown.classList.remove('visible'); }
}

function selectResult(pageId) {
  document.getElementById('search-input').value = '';
  document.getElementById('search-dropdown').classList.remove('visible');
  navigate(pageId);
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.sidebar-search-wrap')) {
    document.getElementById('search-dropdown').classList.remove('visible');
  }
});

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}
function focusSearch() {
  openSidebar();
  setTimeout(function(){ document.getElementById('search-input').focus(); }, 280);
}

window.addEventListener('hashchange', function() {
  var hash = location.hash.replace('#','').trim();
  var target = (hash && pagesMeta[hash]) ? hash : 'home';
  if (target !== currentPage) { navigate(target); }
});

document.addEventListener('DOMContentLoaded', function() {
  buildNav();
  buildSearchIndex();
  var hash = location.hash.replace('#','').trim();
  navigate(hash && pagesMeta[hash] ? hash : 'home');
});
</script>
