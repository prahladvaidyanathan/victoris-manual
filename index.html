<template id="tpl-acoustic-alerting">
<h1>Acoustic Vehicle Alerting System (if equipped)</h1>
<p>When the vehicle is driven using the electric motor (traction motor) at a speed of approximately 23 km/h or less, an alarm is sounded to alert those around the vehicle to its approach.</p>
<p>The alarm may be difficult for people around you to hear when there is a lot of noise around you, or when there is heavy rain or strong winds. Also, because the vehicle approach notification device is mounted in front of the vehicle, it may be difficult to hear the rear of the vehicle compared to the front of the vehicle. The alarm may also be heard in the vehicle while the vehicle is in motion, but this is not a malfunction — the sound is intended to inform people around the vehicle that it is approaching.</p>

<p>When the power switch is pressed to change the ignition mode to "ON", this light comes on briefly so you can check that the light is working.</p>
<p>If this light blinks, there may be something wrong with the acoustic vehicle alerting system.</p>

<template id="tpl-eng-a-stop">
<h1>ENG A-STOP System (Engine Auto Stop Start System) (if equipped)</h1>
<p>The ENG A-STOP system (engine auto stop start system) automatically stops the engine while waiting briefly at a traffic light, etc., and automatically restarts the engine afterward. This system helps reduce emissions, improve fuel consumption and lower engine noise.</p>
<p>This system stops the engine temporarily under specific conditions. Before parking the vehicle for an extended period of time or leaving the vehicle, properly apply the parking brake and stop the engine with the engine switch.</p>
<p>Once the specific conditions are met, the engine will stop automatically after the vehicle has stopped. However, the engine will not be stopped automatically until confirmation of the system function is finished.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If your vehicle is equipped with the auto air conditioning system, you can change the automatic engine stop condition via the information display. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "INSTRUMENT CLUSTER" section.</p>
<p><strong>CAUTION:</strong></p>
<ul>
<li>Do not get out of the vehicle while the engine is automatically stopped by the ENG A-STOP system. Doing so may lead to an accident.</li>
<li>Automatic transmission vehicle — If the driver's seat belt is unfastened, even if the brake pedal is pressed down, or the driver's door is opened, the engine will be restarted to warn you that the engine was stopped automatically by the ENG A-STOP system.</li>
<li>If the engine does not restart automatically after having been stopped automatically by the ENG A-STOP system, push the engine switch to start the engine. Trying to move the vehicle when the engine has not yet restarted requires a strong force to turn the steering wheel or depress the brake pedal, potentially leading to an accident.</li>
</ul>
<p><strong>NOTICE:</strong> The vehicle equipped with this system uses a dedicated high-performance lead-acid battery that supports the ENG A-STOP system. Accordingly, observe the instructions listed below. If these instructions are not observed, the system may not actuate properly or the lead-acid battery may die prematurely.</p>
<ul>
<li>When replacing the lead-acid battery, use a Maruti Suzuki GENUINE battery specified in the Specification section.</li>
<li>Do not draw power from the lead-acid battery terminals for electrical products.</li>
</ul>
</div>
<h2>Lithium-ion Battery</h2>
<p>The lithium-ion battery is used exclusively for the vehicle equipped with the ENG A-STOP system or SHVS, and is located below the front left side seat.</p>
<p>Like a lead-acid battery, the lithium-ion battery also discharges gradually. To prevent the lithium-ion battery from dying, you must charge the lithium-ion battery by driving continuously for at least 30 minutes once a month.</p>
<ul>
<li>Vehicle should not be left with the ignition in ON or ACC position, or the ignition mode is "ON" or "ACC" for extended periods of time.</li>
<li>Do not add any external load to the lithium-ion battery.</li>
<li>The lithium-ion battery is maintenance-free.</li>
<li>To replace or dispose of the lithium-ion battery, consult a Maruti Suzuki authorised workshop.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Wrong handling of the lithium-ion battery may result in fire, electric shock or system malfunction. Accordingly, observe the instructions listed below:</p>
<ul>
<li>Do not dismount or disassemble the lithium-ion battery.</li>
<li>Do not let the lithium-ion battery come in contact with water or other liquids.</li>
<li>Do not apply strong impact on the lithium-ion battery.</li>
<li>Do not step on the lithium-ion battery or put articles on the lithium-ion battery.</li>
<li>Do not disconnect the lithium-ion battery terminals or draw power from the terminals for electrical products.</li>
<li>If the lithium-ion battery gets submerged under water, it can lead to fire.</li>
</ul>
<p><strong>NOTE:</strong> The lithium-ion battery, if not disposed in an eco-friendly manner and in accordance with the applicable laws, may pose safety and environmental hazard. Maruti Suzuki ensures proper disposal of this battery through established channels. Owner shall return the lithium-ion battery to a Maruti Suzuki authorised dealership as soon as it is not fit for use in the vehicle.</p>
</div>
<h2>Automatic Stopping/Restarting of the Engine</h2>
<h3>Automatic Transmission Vehicles</h3>
<ol>
<li>Depressing the brake pedal to decelerate while the gearshift lever is in the "D" position will automatically stop the engine before the vehicle is stopped (approximately 9 km/h or less). At the same time, the ENG A-STOP indicator light (green) will come on.</li>
</ol>
<p>   - The engine is not stopped automatically if all of the conditions to stop the engine automatically are not met, even if the brake pedal is pressed down to decelerate. For details on the conditions for automatically stopping the engine, refer to "Conditions to Stop the Engine Automatically" in this section.    - To ensure safety when the engine is stopped automatically, the interior buzzer may sound and the engine will stall, or the engine may be restarted. For details, refer to "Precautions of When the Engine is Stopped Automatically" in this section.    - During the automatic engine stop, electric equipment will be in the following conditions: audio and other electrical components can be used, but the air conditioner will switch to the fan mode. If the vehicle is equipped with an auto air conditioner, the fan speed will be limited during the automatic engine stop (only in the auto control mode) to keep the cabin air-conditioned for a longer time.</p>
<ol start="2">
<li>When you remove your foot from the brake pedal, regardless of whether it is before or after stopping the vehicle, the engine is restarted and the ENG A-STOP indicator light (green) goes off.</li>
</ol>
<p>   - The engine is restarted automatically if the conditions to restart the engine automatically are met, even if the brake pedal is depressed. For details, refer to "Conditions to Restart the Engine Automatically" in this section.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The engine is not stopped automatically when decelerating without depressing the brake pedal, for example, by using engine braking.</li>
<li>The engine may be stopped automatically when the vehicle is stopped, even if the engine is not stopped automatically before stopping the vehicle (approximately 9 km/h or less).</li>
<li>Electrical components such as the navigation system or audio system can be used while the engine has been stopped automatically; however, the air conditioner switches to the ventilation position.</li>
<li>For the automatic heating and air conditioning system, airflow is limited (only under automatic operation) when the engine is stopped automatically, in order to improve the cooling and heating performance.</li>
<li>The hill hold control system is activated when the engine is restarted automatically.</li>
<li>When the engine restarts automatically, the electric parking brake may engage or disengage and interrupt the restarting process, and that is normal operation.</li>
</ul>
</div>
<h2>Precautions of When the Engine is Stopped Automatically</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not perform any of the following operations while the engine has been stopped automatically. This may result in an accident.</p>
</div>
<p><strong>Engine hood opened (all vehicles):</strong> The interior buzzer sounds intermittently. After the engine is stopped automatically, it stalls. The ENG A-STOP indicator light (green) goes off. To restart the engine: set the parking brake firmly and place the gearshift lever in "P", securely close the engine hood, then press the engine switch to restart the engine.</p>
<p><strong>Driver's seat belt unfastened, or driver's door opened (automatic transmission):</strong> The engine is restarted automatically. The ENG A-STOP indicator light (green) blinks 5 times, then goes off. Before driving, close the door and buckle the seat belt. Before getting out of the vehicle, set the parking brake firmly and place the gearshift lever in "P". When the vehicle will be stopped for a long time or when you will leave the vehicle unattended, press the engine switch to stop the engine.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>The following indicator lights in the instrument cluster do not come on when the engine is stopped automatically: malfunction indicator light, electric power steering light, oil pressure light, charging light.</p>
</div>
<h2>Operating Conditions of ENG A-STOP System</h2>
<h3>Standby Conditions</h3>
<p>If all of the following conditions are met while driving, the automatic engine stop will be permitted.</p>
<p><strong>When the engine is started:</strong> The engine is started with the engine hood securely closed.</p>
<p><strong>When driving (all vehicles):</strong></p>
<ul>
<li>The ENG A-STOP system is not deactivated (OFF).</li>
<li>The battery is charged more than a certain amount, and the temperature inside the battery is within the specified range.</li>
<li>The engine coolant temperature is within the specified range.</li>
<li>The driver's seat belt is fastened.</li>
<li>The driver's door is securely closed.</li>
<li>The engine hood is securely closed.</li>
<li>For vehicles with automatic heating and air conditioning system: The air from the outlets is sufficiently cooled while cooling or sufficiently warmed while heating. The defroster is turned off.</li>
</ul>
<p><strong>When driving (automatic transmission only):</strong></p>
<ul>
<li>The gearshift lever is in the "D" or "N" position.</li>
<li>The manual mode is not in use.</li>
<li>There is no signal to prevent stopping the engine from any electronic control systems other than the ENG A-STOP system.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>If the battery is discharged (for example, if the vehicle has not been used for a long time, or electrical components such as the navigation system or audio system have not been used for a long time while the engine was stopped), it may take some time until the system can be in standby.</li>
<li>The system will be in standby even when the gearshift lever is in the "N" position; however, the engine will be stopped automatically when the vehicle is stopped, instead of when it is decelerating (approximately 9 km/h or less) before stopping.</li>
</ul>
</div>
<h3>Conditions to Stop the Engine Automatically</h3>
<p>If all of the following conditions are met while the standby conditions are met, the engine is stopped automatically when the vehicle is decelerating before stopping or when the vehicle is stopped.</p>
<p><strong>When decelerating before stopping (automatic transmission):</strong></p>
<ul>
<li>The ABS or ESP® system has not been activated.</li>
<li>Brake booster vacuum pressure is normal.</li>
<li>The brake pedal is sufficiently depressed.</li>
<li>The vehicle is decelerating to a speed of approximately 9 km/h or less.</li>
<li>The accelerator pedal is not depressed.</li>
<li>The vehicle is not being driven on a steep hill.</li>
<li>The brake is not applied abruptly.</li>
</ul>
<p><strong>When the vehicle is stopped (automatic transmission):</strong></p>
<ul>
<li>The ABS or ESP® system has not been activated.</li>
<li>Brake booster vacuum pressure is normal.</li>
<li>The brake was not applied abruptly before the vehicle was stopped.</li>
<li>The brake pedal is sufficiently depressed.</li>
<li>The accelerator pedal is not depressed.</li>
<li>The vehicle is not stopped on a steep hill.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>The engine may not be stopped automatically if the brake pedal was depressed lightly or strongly.</p>
</div>
<h3>Conditions to Restart the Engine Automatically</h3>
<p>If any of the following vehicle conditions occur or operations are performed while the engine is stopped automatically, the engine is restarted automatically and the ENG A-STOP indicator light (green) goes off.</p>
<p><strong>Common (all vehicles):</strong></p>
<ul>
<li>The ENG A-STOP system is deactivated (OFF).</li>
<li>The battery continues to be discharged.</li>
<li>A malfunction was detected in this system.</li>
<li>Brake booster vacuum pressure is low.</li>
<li>The temperature of the air from the outlets changes greatly, or the cooling and heating performance is insufficient.</li>
<li>The temperature selector was greatly set toward COOL while cooling or greatly set toward HOT while heating.</li>
<li>The defroster is turned on.</li>
</ul>
<p><strong>Automatic transmission:</strong></p>
<ul>
<li>The foot is removed from the brake pedal.</li>
<li>The accelerator pedal is depressed.</li>
<li>The gearshift lever is placed in the "P", "R" or "M" position.</li>
</ul>
<p><strong>When decelerating (approximately 9 km/h or less) — all vehicles:</strong> The engine hood was opened.</p>
<p><strong>When decelerating (approximately 9 km/h or less) — automatic transmission:</strong> The gearshift lever is placed in the "N" position. The slope of the road suddenly changes.</p>
<p><strong>When the vehicle is stopped — common (all vehicles):</strong></p>
<ul>
<li>The driver's seat belt is unfastened.</li>
<li>The driver's door is opened.</li>
<li>The vehicle is moving along a slope.</li>
<li>Some time (about 3 minutes) has passed since the engine was stopped automatically.</li>
</ul>
<p><strong>When the vehicle is stopped — automatic transmission:</strong> After the gearshift lever is placed in the "N" position, it is returned to the "D" position.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>After the ENG A-STOP indicator light (green) blinks for conditions marked above, it goes off. The interior buzzer may also sound at the same time.</li>
<li>The engine may be restarted automatically when the brake pedal is depressed lightly. In this case, when the brake pedal is depressed again, the engine is stopped automatically and the ENG A-STOP indicator light (green) comes on again.</li>
</ul>
</div>
<h2>ENG A-STOP OFF Switch (if equipped)</h2>
<p>The ENG A-STOP system can be deactivated.</p>
<ul>
<li>To deactivate the system, press the ENG A-STOP OFF switch to turn on the ENG A-STOP OFF light.</li>
<li>To activate the system once again, press the switch again to turn off the indicator.</li>
<li>Every time the engine is stopped manually, the system is enabled again and the ENG A-STOP OFF light goes off.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Pressing the ENG A-STOP OFF switch during the automatic engine stop will restart the engine automatically and the ENG A-STOP OFF light will come on.</p>
</div>
<h2>ENG A-STOP OFF Light (if equipped)</h2>
<p>This indicator comes on in the information display.</p>
<ul>
<li>The indicator comes on when the ENG A-STOP system is deactivated.</li>
<li>The indicator blinks when the engine switch is pressed to change the ignition mode to ON, if one of the following conditions is met. The ENG A-STOP system or the SHVS system does not actuate correctly while the indicator is blinking. Have the system inspected by a Maruti Suzuki authorised workshop:
<ul>
<li>There may be something wrong with the ENG A-STOP system or the SHVS system.</li>
<li>An engine component (ISG) or the lead-acid battery is due for replacement.</li>
</ul>
</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>If the indicator blinks during the automatic engine stop, the engine may shut down.</p>
</div>
<h2>Information Messages</h2>
<p>The information display shows the following messages to let you know certain problems of the ENG A-STOP system.</p>
<p><strong>"Idling Stop Unavailable":</strong> The ENG A-STOP system cannot stop the engine automatically because one of the actuation conditions is not met. For details, refer to "Operating Conditions of ENG A-STOP System" in this section.</p>
<p><strong>"Engine Restarting":</strong> The engine is restarting automatically because one of the following automatic engine restart conditions is met: the temperatures at the air conditioner outlets have changed considerably after the automatic engine stop to the point of affecting the cooling/heating performance; the lead-acid battery has discharged substantially; some time has elapsed after the start of the automatic engine stop.</p>
<p><strong>"Restarted":</strong> The engine restarted automatically because the negative pressure of the brake booster has dropped.</p>
<p><strong>"Engine Restarted":</strong> The engine restarted automatically because one of the following automatic engine restart conditions is met: the defroster is turned on; the driver's seat belt is released; the driver's door is opened; the vehicle is started to move on a slope.</p>
<p><strong>"Restart Engine":</strong> The engine shut down because one of the following operations is performed during the automatic engine stop: the hood is opened; the driver's door is opened with the driver's seat belt unfastened (automatic transmission). Restart the engine by usual operation. Refer to <a onclick="navigate('starting-engine')" href="javascript:void(0)">05-06 Starting Stopping Engine or Hybrid System</a> for details.</p>
</template>

<template id="tpl-driving-mode">
<h1>Driving Mode (if equipped)</h1>
<p>The driving modes can be selected to suit driving conditions. Each time the driving mode select switch is pressed, the system changes between normal mode, power mode, and ECO drive mode.</p>
<h2>Normal Mode</h2>
<p>This mode provides an optimal balance of fuel economy, quietness, and dynamic performance. This is suitable for normal driving.</p>
<h2>Power Mode</h2>
<p>This mode controls the hybrid system to provide quick, powerful acceleration. Also, this mode makes it suitable for when agile driving response is desired, such as when driving on roads with many curves. When the Power mode is selected, the Power mode indicator comes on.</p>
<p><strong>Automatic deactivation of Power mode:</strong> If the power switch is turned off after driving in power mode, the drive mode will be changed to normal mode.</p>
<h2>ECO Drive Mode</h2>
<p>This mode helps the driver accelerate in an eco-friendly manner and improve fuel economy through moderate throttle characteristics and by controlling the operation of the air conditioning system (heating/cooling). When the Eco drive mode is selected, the Eco drive mode indicator comes on.</p>
<p><strong>Operation of the air conditioning system in Eco drive mode:</strong> Eco drive mode controls the heating/cooling operations and fan speed of the air conditioning system to enhance fuel efficiency. To improve air conditioning performance, perform the following operations:</p>
<ul>
<li>Adjust the fan speed.</li>
<li>Turn off Eco drive mode.</li>
</ul>
<h2>EV Drive Mode</h2>
<p>In EV drive mode, electric power is supplied by the hybrid battery (traction battery), and only the electric motor (traction motor) is used to drive the vehicle. This mode allows you to drive in residential areas early in the morning and late at night, or in indoor parking lots, etc., without concern for noises and gas emissions.</p>
<p><strong>Operating instructions:</strong> Press the EV drive mode switch to turn on the EV drive mode. Press the switch again to turn off this mode. When EV drive mode is turned on, the EV drive mode indicator will come on. Pressing the switch again when in EV drive mode will return the vehicle to normal driving (using the gasoline engine and electric motor).</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>When driving in EV drive mode, pay special attention to the area around the vehicle. Because there is no engine noise, pedestrians, people riding bicycles or other people and vehicles in the area may not be aware of the vehicle starting off or approaching them.</p>
</div>
<h3>Situations in Which EV Drive Mode Cannot be Turned On</h3>
<p>It may not be possible to turn EV drive mode on in the following situations. If it cannot be turned on, a message will be shown on the information display.</p>
<ul>
<li>The temperature of the hybrid system is high. The vehicle has been left in the sun, driven on a hill, driven at high speeds, etc.</li>
<li>The temperature of the hybrid system is low. The vehicle has been left in temperatures lower than about 0°C (32°F) for a long period of time, etc.</li>
<li>The gasoline engine is warming up.</li>
<li>The hybrid battery (traction battery) is low. The remaining battery level indicated in the information display is low.</li>
<li>Vehicle speed is high.</li>
<li>The accelerator pedal is depressed firmly or the vehicle is on a hill, etc.</li>
<li>The windshield defogger is in use.</li>
</ul>
<h3>Switching to EV Drive Mode When the Gasoline Engine is Cold</h3>
<p>If the hybrid system is started while the gasoline engine is cold, the gasoline engine will start automatically after a short period of time in order to warm up. In this case, you will become unable to switch to EV drive mode.</p>
<h3>Automatic Cancellation of EV Drive Mode</h3>
<p>When driving in EV drive mode, the gasoline engine may start automatically and the vehicle may be driven by the gasoline engine and electric motor (traction motor) in the following situations. When EV drive mode is cancelled, a message will be displayed on the information display.</p>
<ul>
<li>The hybrid battery (traction battery) becomes low. The remaining battery level indicated in the information display is low.</li>
<li>Vehicle speed is high.</li>
<li>The accelerator pedal is depressed firmly or the vehicle is on a hill, etc.</li>
</ul>
<h3>Possible Driving Distance When Driving in EV Drive Mode</h3>
<p>EV drive mode's possible driving distance ranges from a few hundred meters to approximately 1 km. However, depending on vehicle conditions, there are situations when EV drive mode cannot be used. The distance that is possible depends on the hybrid battery (traction battery) level and driving conditions.</p>
<h3>Fuel Economy</h3>
<p>The hybrid system is designed to achieve the best possible fuel economy during normal driving (using the gasoline engine and electric motor). Driving in EV drive mode more than necessary may lower fuel economy.</p>
<h3>Information Display Messages</h3>
<p><strong>"EV MODE UNAVAILABLE":</strong> The EV drive mode is not available. Use the EV drive mode when it becomes available.</p>
<p><strong>"EV MODE CANCELED":</strong> The EV drive mode has been automatically cancelled. Drive the vehicle for a while before attempting to turn on the EV drive mode again.</p>

<h1>Suzuki Safety Support (if equipped)</h1>
<p>SUZUKI SAFETY SUPPORT is a collection of driving assist systems designed to contribute to a safe and comfortable driving experience. The systems help reduce the impact of collisions and assist the driver under normal driving conditions. They are not a substitute for attentive driving — the driver is solely responsible for safe operation of the vehicle.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>The Victoris ZXi Petrol 6AT includes only <strong>Cruise Control</strong> and <strong>Parking Sensors</strong> from the SUZUKI SAFETY SUPPORT suite. The full Level 2 ADAS package (DSBS II, Lane Departure Prevention, Lane Keep Assist, High Beam Assist, Adaptive Cruise Control, Blind Spot Monitor, Rear Cross Traffic Alert) is available on the Zxi+ 6AT only.</p>

<template id="tpl-cruise-control">
<h1>Cruise Control (if equipped)</h1>
<p>The cruise control system allows you to maintain a steady speed without keeping your foot on the accelerator pedal. The controls are located on the steering wheel.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not use the cruise control system when driving in heavy traffic, on slippery or winding roads, or on steep downhills, as this may cause loss of vehicle control.</p>
</div>
<h2>Controls</h2>
<img src="cruise-switch.png" alt="Cruise control switch">
<p><strong>(1) Cruise switch</strong> — turns the cruise control system on and off <strong>(2) RES+ / CANCEL / SET– switch</strong> — sets speed, resumes previously set speed, and cancels cruise control</p>
<h2>Usage Conditions</h2>
<p>For the 6-speed automatic transmission, cruise control can be used when:</p>
<ul>
<li>The gearshift lever is in "D" position, or the gear position is 3rd, 4th, 5th, or 6th in Manual mode</li>
<li>Vehicle speed is approximately 40 km/h or higher</li>
</ul>
<h2>Setting Cruising Speed</h2>
<img src="cruise-cluster-a.png" alt="Instrument cluster Type A — cruise active at 80 km/h">
<img src="cruise-cluster-b.png" alt="Instrument cluster Type B — cruise active at set speed">
<p><strong>(4) Cruise indicator</strong> — comes on when the cruise control system is switched on <strong>(5) "SET" indicator</strong> — comes on when a cruising speed has been set <strong>(6) Set speed indication</strong> — displays the set speed</p>
<ol>
<li>Press the Cruise switch (1) to turn on the system. The cruise indicator (4) comes on.</li>
<li>Accelerate or decelerate to the desired speed.</li>
<li>Push down the RES+/SET– switch (2). The SET indicator (5) and set speed indication (6) come on. Take your foot off the accelerator pedal — the set speed will be maintained.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>The established cruising speed may differ slightly from the speedometer reading depending on road conditions.</p>
<p><strong>WARNING:</strong> If the cruising speed is set accidentally, you may be unable to decelerate or could lose control of the vehicle. Turn off the cruise control system and confirm the cruise indicator (4) is off when the system is not in use.</p>
</div>
<h2>Changing Speed Temporarily</h2>
<p><strong>To accelerate temporarily:</strong> Depress the accelerator pedal. When you lift your foot off, the vehicle returns to the set speed.</p>
<p><strong>To decelerate temporarily:</strong> Depress the brake pedal. The set speed is cancelled and the SET indicator (5) goes off. To resume the previously set speed, push up the RES+/SET– switch (2) when vehicle speed is above 40 km/h.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When cruising speed is maintained, you cannot decelerate using engine braking even if you downshift to 3rd in Manual mode. To decelerate with cruise on, depress the brake pedal or push down the RES+/SET– switch (2).</p>
</div>
<h2>Changing Cruising Speed</h2>
<p><strong>Using the accelerator pedal:</strong> Accelerate to the new desired speed, then push down the RES+/SET– switch (2). The new speed is maintained.</p>
<p><strong>Using the brake pedal:</strong> Decelerate to the new desired speed, then push down the RES+/SET– switch (2). The new speed is maintained.</p>
<p><strong>Using the RES+/SET– switch directly:</strong></p>
<ul>
<li>To increase speed: press or hold the switch up (RES+). Speed increases steadily; release the switch when the new speed is reached.</li>
<li>To decrease speed: press or hold the switch down (SET–). Speed decreases steadily; release the switch when the new speed is reached.</li>
<li>Each quick press adjusts the set speed by approximately 1 km/h.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>If the current vehicle speed is more than approximately 10 km/h faster than the set speed, pushing SET– will not decrease the cruising speed. Similarly, if the current speed is more than approximately 10 km/h slower than the set speed, pushing RES+ will not increase it.</p>
</div>
<h2>Cancelling Cruise Control</h2>
<p>The SET indicator (5) goes off and cruise control is temporarily cancelled in any of the following situations:</p>
<ul>
<li>The CANCEL switch (2) is pressed</li>
<li>The brake pedal is depressed</li>
<li>Downshifting from 3rd to 2nd in Manual mode</li>
<li>Vehicle speed falls more than approximately 20% below the set speed</li>
<li>Vehicle speed falls below 40 km/h</li>
<li>The vehicle skids and ESP® is activated</li>
</ul>
<p>To resume the previously set speed after temporary cancellation, push up the RES+/SET– switch (2) when vehicle speed is above 40 km/h.</p>
<p>To turn off the cruise control system completely, press the Cruise switch (1) and confirm the cruise indicator (4) is off. Turning off the system clears the set speed from memory — you will need to reset your cruising speed next time.</p>
<p>The cruise control system also turns off automatically if the malfunction indicator light in the instrument cluster comes on or blinks.</p>

<template id="tpl-parking-sensors">
<h1>Parking Sensors</h1>
<p>The parking sensor system uses ultrasonic sensors mounted in the rear bumper to detect obstacles. The sensors transmit ultrasonic waves, and the time taken for the signal to reflect back from an obstacle is used to calculate its distance.</p>
<p>The Victoris ZXi Petrol 6AT is equipped with <strong>rear sensors only</strong> (RPAS): 2 rear center sensors and 2 rear corner sensors.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The parking sensor warns you of obstacles using buzzers and by showing obstacle positions on the information display. However, you must still pay full attention while driving. The sensors detect obstacles only within a limited area and speed range. In tricky areas, move the vehicle slowly while checking your surroundings using direct vision and mirrors. Over-reliance on parking sensors increases the risk of an accident.</p>
<p><strong>NOTICE:</strong> Parking sensors are for driver assistance only.</p>
</div>
<h2>Sensor Operation</h2>
<p>The rear sensors activate based on gearshift lever position:</p>
<table>
<thead>
<tr><th>Gearshift position</th><th>Rear center sensors</th><th>Rear corner sensors</th></tr>
</thead>
<tbody>
<tr><td>R</td><td>On</td><td>On</td></tr>
<tr><td>N or D</td><td>Off</td><td>Off</td></tr>
</tbody>
</table>
<h2>Detection Range</h2>
<p>The sensors can detect obstacles such as a wall up to approximately <strong>150 cm (5 ft)</strong> from the rear of the vehicle. Obstacles within approximately 20 cm of a sensor or directly below a sensor are not detectable.</p>
<h2>Obstacle Indication</h2>
<p>When an obstacle is detected, an interior buzzer sounds and a symbol representing the obstacle's position appears on the information display. The symbol and buzzer pattern change with distance:</p>
<table>
<thead>
<tr><th>Distance (approx.)</th><th>Buzzer</th><th>Display</th></tr>
</thead>
<tbody>
<tr><td>60–150 cm</td><td>Short beeps at long intervals</td><td>Three lines</td></tr>
<tr><td>45–60 cm</td><td>Short beeps at short intervals</td><td>Three lines</td></tr>
<tr><td>35–45 cm</td><td>Short beeps at very short intervals</td><td>Two lines</td></tr>
<tr><td>Less than 35 cm</td><td>Continuous beep</td><td>One line</td></tr>
</tbody>
</table>
<p>The corner sensors activate within the 45–60 cm range and below, alongside the center sensors.</p>
<p>Additional notes:</p>
<ul>
<li>Symbols appear with a short delay after obstacle detection.</li>
<li>If multiple obstacles are detected simultaneously, all positions are shown on the display, but the buzzer sounds only for the nearest one.</li>
<li>The parking sensor indicator light blinks when an obstacle is detected while the system is operating.</li>
</ul>
<h2>Parking Sensor Buzzer OFF Switch</h2>
<p>If you press the parking sensor buzzer OFF switch while the buzzer is sounding, the buzzer is temporarily silenced. The buzzer will resume in any of the following situations:</p>
<ul>
<li>The parking sensor buzzer OFF switch is pressed again</li>
<li>The gearshift lever is moved from a non-reverse position to R</li>
<li>The gearshift lever is moved from a non-drive position to D/M/N</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>The buzzer may sound again if an obstacle is detected while the buzzer is paused.</p>
</div>
<h2>Sensor Precautions</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Observe the following to prevent sensor malfunction. Failure to do so may result in the sensor not operating properly, possibly leading to an accident.</p>
</div>
<ul>
<li>Keep sensors clean at all times. Wipe clean with a soft cloth if dirty, wet, or covered with snow.</li>
<li>Do not attach accessories, stickers, or other items to the sensors or the surrounding area.</li>
<li>Do not subject the sensors or surrounding area to impact. If the rear bumper sustains an impact, have the sensors inspected by a Maruti Suzuki authorised workshop.</li>
<li>Do not change the position or orientation of the sensors, or remove them.</li>
<li>Do not disassemble the sensors.</li>
<li>Do not modify or paint the sensors, or replace them with non-genuine parts.</li>
<li>Do not point a high-pressure washer nozzle at the sensors.</li>
<li>Do not direct steam cleaning too close to the sensors.</li>
<li>If the sensors are removed and reinstalled, or if the rear bumper is replaced, angle measurement and initialisation of the sensors will be necessary — consult a Maruti Suzuki authorised workshop.</li>
</ul>
<h2>Situations Where the Sensor May Not Activate Properly</h2>
<ul>
<li>When dirt, snow, or ice is attached to the sensor (remove the foreign object)</li>
<li>In bad weather such as heavy rain, fog, or a blizzard</li>
<li>When backward visibility is poor due to exhaust gas, water vapour, steam, sand, or smoke</li>
<li>When the sensor is covered by a sticker or accessory</li>
<li>When commercially available accessories are installed on the bumper (tow hooks, fog lamps, corner poles, radio antenna, etc.)</li>
<li>When the vehicle height or bumper position has been altered (e.g. suspension modification)</li>
<li>When sensor alignment is disturbed due to a collision</li>
<li>When snow chains or non-standard tyre sizes are fitted</li>
<li>When the vehicle is on a slope, rough road, gravel, or long grass</li>
<li>When the vehicle is significantly inclined</li>
<li>When there is ultrasonic interference from other sources (another vehicle's horn, motorcycle engine, air brakes from a large vehicle, another parking sensor system)</li>
<li>When the sensor is too close to an obstacle</li>
<li>When the vehicle approaches an obstacle at a diagonal angle or toward the edge or corner of a wall</li>
<li>When an obstacle is not vertical (angled walls, corrugated or wavy shutters)</li>
<li>When an obstacle protrudes from a wall (pipes, poles)</li>
</ul>
<p>The following types of obstacles may not be detected reliably:</p>
<ul>
<li>Sound-absorbing objects (people, sponge-like materials, snow banks)</li>
<li>Moving objects (pedestrians, bicycles, animals)</li>
<li>Objects that rush into the vehicle's path suddenly</li>
<li>Thin pole-like objects (signs, street lamps)</li>
<li>Low-profile objects (guardrails, kerbs)</li>
<li>Small or thin objects (chains, ropes, wire mesh fences)</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>Thin poles or obstacles lower than the sensors may become undetectable as the vehicle moves closer, even if detected from a greater distance. The system may calculate the distance to a road sign as shorter than the actual distance.</p>
</div>
<h2>Temporary Stop and Failure</h2>
<p>The parking sensors stop temporarily or permanently in the following conditions:</p>
<p><strong>Temporary stop</strong> (resumes when condition improves):</p>
<ul>
<li>Foreign object (dirt, snow, ice) attached to a sensor</li>
<li>Battery voltage abnormality</li>
</ul>
<p><strong>Sensor failure</strong> (system stops until engine is restarted):</p>
<ul>
<li>Parking sensor indicator light comes on</li>
<li>Master warning indicator blinks</li>
</ul>
<p>If the parking sensor indicator light remains on after restarting the engine, there may be a sensor failure. Have the vehicle inspected by a Maruti Suzuki authorised workshop. The vehicle can still be driven normally while the system is stopped.</p>
<h2>Warning and Indicator Messages</h2>
<p><strong>"Clean Parking Sensors"</strong> — A sensor is contaminated. Wipe it clean with a soft cloth. A blinking line appears in the affected sensor's position on the display.</p>
<p><strong>"Service Parking Sensors"</strong> — There may be a problem with the parking sensor system. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<h2>Situations Where the System Does Not Activate</h2>
<ul>
<li>For a few seconds immediately after changing the ignition mode to ON</li>
<li>When the gearshift lever position does not match the selector position shown in the information display, or when "–" is displayed</li>
<li>When an obstacle cannot be detected</li>
<li>When the system is temporarily stopped or malfunctioning</li>
</ul>
</template>

<template id="tpl-rearview-camera">
<h1>Rearview Camera (if equipped)</h1>
<p>When the gearshift lever is shifted to "R" while the ignition mode is ON, the rearview camera automatically displays the view behind the vehicle on the infotainment screen. The camera is installed on the tailgate.</p>
<p>When the gearshift lever is moved out of "R", the display returns to whatever was showing previously. The rearview camera display has first priority over any other display mode, but will not show the rear view while the system is initialising.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The distance shown on the rearview camera display may differ from the actual distance depending on road conditions or vehicle loading. The camera's display area is also limited. Reversing while looking only at the display may cause an accident. The rearview camera is a driving aid only — the driver is solely responsible for parking and similar manoeuvres. Always confirm safety directly with your eyes and mirrors, and check that the tailgate is securely closed before reversing.</p>
<p><strong>NOTICE:</strong> If the rearview camera is used for an extended period with the ignition ON but the engine not running, the battery may discharge. Do not leave the ignition ON for a long time with the engine off.</p>
</div>
<h2>Display Range</h2>
<p>The rearview camera shows the area behind the rear bumper. It cannot show:</p>
<ul>
<li>Objects that are very close to or directly under the bumper</li>
<li>Obstacles higher than the camera (upper portions of tall objects such as road signs will not appear)</li>
</ul>
<p>Images on the display are mirror images (reversed left-to-right).</p>
<h2>Guide Lines</h2>
<p>The following guide lines are overlaid on the camera display:</p>
<table>
<thead>
<tr><th>Guide line</th><th>Colour</th><th>Distance from rear bumper centre</th></tr>
</thead>
<tbody>
<tr><td>Vehicle width lines (vertical)</td><td>Purple</td><td>Slightly outside the vehicle width, including mirrors</td></tr>
<tr><td>Distance line</td><td>Light blue</td><td>Approximately 2 m</td></tr>
<tr><td>Distance line</td><td>Yellow</td><td>Approximately 1 m</td></tr>
<tr><td>Distance line</td><td>Red</td><td>Approximately 0.5 m</td></tr>
</tbody>
</table>
<div class="box note">
<div class="box-label">Note</div>
<p>Guide lines are projected onto the road surface plane, so they do not accurately represent the distance to obstacles that are raised off the ground (such as a parked vehicle). They are rough indications only. If the suspension has been modified or non-standard tyres fitted, the guide lines will not be accurate.</p>
</div>
<h2>Distance Accuracy on Slopes</h2>
<p>The rearview camera display may misrepresent distance when there is a slope behind the vehicle:</p>
<p><strong>Uphill behind the vehicle:</strong> Objects appear farther away than they actually are.</p>
<p><strong>Downhill behind the vehicle:</strong> Objects appear closer than they actually are.</p>
<h2>Camera Care</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<p>The rearview camera is a precision instrument.</p>
<ul>
<li>Do not strike the camera.</li>
<li>Do not remove snow or mud from the lens using a stick.</li>
<li>Do not use a high-pressure washer around the camera — water ingress may cause malfunction or fire.</li>
<li>Do not use a brush to clean the lens.</li>
<li>Do not use alcohol, benzene, or thinner on the lens.</li>
<li>Do not apply wax to the camera lens.</li>
<li>The lens is hard-coated — damage or discolouration may obscure the image.</li>
</ul>
</div>
<p>If body wax gets on the lens, wipe it off with a clean cloth dampened with mild detergent diluted with water, then wipe dry.</p>
<h2>Display May Be Difficult to See In</h2>
<p>The following conditions may make the image harder to see, but are not system malfunctions:</p>
<ul>
<li>Dark areas, rain, or night-time</li>
<li>Extreme temperatures around the lens, or wet conditions causing lens condensation</li>
<li>Mud, dust, or water droplets on or around the lens</li>
<li>Strong light shining directly into the camera (may cause vertical lines on display)</li>
<li>Fluorescent lighting environments (display may flicker)</li>
<li>Low outside temperatures (image may appear darkened)</li>
</ul>
<h2>Troubleshooting</h2>
<p><strong>If the rear view is not shown:</strong></p>
<ul>
<li>Check that the ignition mode is ON</li>
<li>Check that the gearshift lever is in "R"</li>
</ul>
<p><strong>If the image is poor:</strong></p>
<ul>
<li>Check that the camera lens is clean</li>
<li>Check that sunlight or another vehicle's headlights are not shining directly into the lens</li>
</ul>
<p>If the system is still not working properly after checking the above, have it inspected by a Maruti Suzuki authorised workshop as soon as possible.</p>
</template>

<template id="tpl-esp">
<h1>Electronic Stability Program (ESP®)</h1>
<p>ESP® is a registered trademark of Mercedes-Benz Group AG.</p>
<p>The Electronic Stability Program (ESP®) helps control the vehicle during cornering if the front or rear wheels skid. It also assists in maintaining traction when accelerating on loose or slippery surfaces by regulating engine output and selectively applying the brakes.</p>
<p>The ESP® incorporates the following systems:</p>
<p><strong>Anti-lock Brake System (ABS)</strong> — refer to <a onclick="navigate('brakes')" href="javascript:void(0)">05-23 Brakes</a>.</p>
<p><strong>Brake Assist System</strong> — refer to <a onclick="navigate('brakes')" href="javascript:void(0)">05-23 Brakes</a>.</p>
<p><strong>Traction Control System (TCS):</strong> Automatically helps prevent wheel spin when starting or accelerating on slippery surfaces. When wheel spin is detected, the system applies the front or rear brakes and reduces engine power to limit spin.</p>
<p><strong>Stability Control System:</strong> Provides integrated control of ABS, traction control, and engine management to help prevent skidding when cornering on slippery surfaces or when the steering wheel is turned abruptly.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>ESP® cannot enhance driving stability in all situations and does not control the entire braking system. It cannot prevent accidents caused by excessive speed in turns or hydroplaning. Only safe and attentive driving can prevent accidents. Never use the capabilities of an ESP®-equipped vehicle as a substitute for careful driving.</p>
</div>
<h2>ESP® Warning Light</h2>
<p>When there is a problem with the ESP® system with the ignition in ON mode, this light comes on. While it is on:</p>
<ul>
<li>The traction control system and stability control system will not work</li>
<li>The hill hold control system may not work</li>
<li>ABS will still work</li>
<li>Brake assist may not work depending on the nature of the malfunction</li>
</ul>
<p>Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<p><strong>The warning light blinks</strong> at very short intervals (0.2 seconds) in the following situations — this is normal operation, not a malfunction:</p>
<ul>
<li>Traction control system activates when starting or accelerating</li>
<li>Stability control system activates when making a sharp turn or sudden manoeuvre</li>
<li>ABS activates (on hybrid system vehicles)</li>
</ul>
<p>When the ignition mode is changed to ON, the light comes on for approximately 2 seconds then goes off — this is the self-check and is normal.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You may also hear an operation sound or clicking sound during the self-check when pressing the engine switch to ON, when releasing the brake pedal after the ignition is turned on with the pedal depressed, or when starting the engine. This is normal.</p>
<p><strong>CAUTION:</strong> To ensure ESP® operates correctly, observe the following:</p>
<ul>
<li>Keep tyre pressure at the specified level</li>
<li>When replacing tyres, use the same size, type, and tread pattern on all four wheels</li>
<li>Do not use excessively worn tyres</li>
<li>Do not modify the suspension or brakes, or alter vehicle height</li>
<li>Do not drive with severely deteriorated suspension or brakes</li>
<li>Do not modify the engine or exhaust</li>
<li>Do not install a limited slip differential (LSD)</li>
<li>Snow chains may cause ESP® to not operate properly</li>
</ul>
</div>
<h2>ESP® OFF Switch</h2>
<p>In most situations, ESP® should remain on. Use the ESP® OFF switch only in the following circumstances:</p>
<ul>
<li>When placing the vehicle on a tester for automobile inspection (traction control and stability control must be deactivated)</li>
<li>When the vehicle is stuck and you need to rock it free (traction control may otherwise reduce power unhelpfully)</li>
</ul>
<p>To deactivate, press and hold the ESP® OFF switch until the ESP® OFF indicator light comes on. Traction control and stability control will not work while this light is on.</p>
<p>To reactivate, press the ESP® OFF switch again, or stop and restart the engine. Note that traction control and stability control do not re-engage automatically after freeing a stuck vehicle — you must press the switch again (or restart the engine).</p>
<div class="box note">
<div class="box-label">Note</div>
<p>ABS and brake assist are never deactivated by the ESP® OFF switch, for safety reasons.</p>
<p><strong>CAUTION:</strong> If the warning light blinks at very short intervals, there is a high possibility the vehicle will skid or become stuck on a slippery surface. Drive very carefully.</p>
</div>
<h2>ESP® OFF Indicator Light</h2>
<p>This light comes on when the ESP® OFF switch is pressed and held. While it is on, traction control and stability control are inactive. It comes on briefly at ignition ON as a self-check.</p>
<h2>Hill Hold Control System</h2>
<p>The hill hold control system helps prevent the vehicle from rolling backwards for approximately 2 seconds while you move your foot from the brake pedal to the accelerator when starting on an uphill gradient.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The hill hold control system is not designed to hold the vehicle stationary on a hill. If you release the brake pedal for more than 2 seconds, the system cancels and the vehicle may roll backwards. On very steep slopes, accelerate immediately after releasing the brake. Do not rely excessively on this system — it may not work on excessively steep slopes, frozen roads, or mud tracks.</p>
</div>
<h3>Activation Conditions</h3>
<p>The hill hold control activates to hold the vehicle for approximately 2 seconds when all of the following are met at the moment the brake pedal is released:</p>
<ul>
<li>The gearshift lever is in a forward or reverse gear</li>
<li>The parking brake is released</li>
<li>The vehicle is on an upward slope</li>
<li>The brake pedal was firmly depressed</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>When the hill hold control activates, you may hear a sound from the engine compartment or feel the brake pedal stiffen slightly. This is normal.</p>
</div>
<p>If there is a problem with the hill hold control system, the ESP® warning light may come on. Consult a Maruti Suzuki authorised workshop.</p>
</template>

<template id="tpl-brakes">
<h1>Brakes</h1>
<h2>General Braking</h2>
<p>Braking distance increases significantly with speed — for example, the distance needed to stop from 60 km/h is approximately four times that needed from 30 km/h. Begin braking early and slow down gradually.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You may hear operational noise from friction between the brake disc and brake lining during braking. This is normal and does not indicate a malfunction.</p>
<p><strong>WARNING:</strong> If water gets into the brake components (e.g. after driving through a puddle or washing the underside of the vehicle), braking performance may become poor or unpredictable. Test the brakes at slow speed afterward. If effectiveness is reduced, dry the brakes by applying them repeatedly while driving slowly until normal braking performance is restored.</p>
</div>
<h2>Power-assisted Brakes</h2>
<p>The vehicle is equipped with power-assisted brakes. If power assistance is lost (e.g. due to a stalled engine or other failure), the system retains reserve power and you can still bring the vehicle to a full stop by pressing the brake pedal once and holding it down firmly. Reserve power is partially consumed with each brake application, so do not pump the pedal — apply smooth, even pressure.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Even without reserve power, you can still stop the vehicle by pressing the brake pedal harder than normal. However, stopping distance will be longer.</p>
<p><strong>NOTE:</strong> You may hear operational sounds during brake pedal application and release due to components in the brake system activating. This is normal and does not affect braking function.</p>
</div>
<h2>Brake Assist System</h2>
<p>When emergency braking is detected (i.e. the brake pedal is pressed quickly and forcefully), the brake assist system supplements braking force for drivers who cannot hold the pedal down firmly enough.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>A clicking sound when quickly and forcefully depressing the brake pedal is normal and indicates the brake assist system is working correctly. On hybrid vehicles, you may also hear operating sounds from the brake system in the following situations — none of these indicate a malfunction:</p>
<ul>
<li>Sounds from the engine compartment when the brake pedal is operated</li>
<li>A motor sound from the front of the vehicle when the driver's door is opened</li>
<li>Sounds from the engine compartment one or two minutes after the hybrid system is stopped</li>
</ul>
</div>
<h2>Anti-lock Brake System (ABS)</h2>
<p>ABS prevents wheel lock-up by electronically controlling braking pressure, helping you maintain steering control during hard braking or on slippery surfaces. The system operates automatically — no special braking technique is required. Press the brake pedal firmly and hold it; do not pump. The ABS will activate whenever it detects wheels locking up.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>ABS has limits and may not function properly in all conditions. It cannot overcome situations where tyre grip is exceeded or hydroplaning occurs.</p>
<p><strong>WARNING:</strong> ABS uses wheel rotation sensors to function. Using tyres other than those specified (wrong size, type, tread pattern, or excessively worn) will prevent correct wheel speed detection and ABS will not work properly, possibly leading to an accident. Always use manufacturer-specified tyres and replace them before they become excessively worn.</p>
</div>
<h3>What to Expect During ABS Operation</h3>
<ul>
<li>You may feel the brake pedal pulsate or move slightly — this is normal and indicates brake fluid pressure is being correctly controlled.</li>
<li>You may feel vibration in the brake pedal, steering wheel, and vehicle body during hard braking — continue pressing firmly.</li>
<li>A clunking noise during ABS activation is normal.</li>
<li>ABS does not activate below approximately 9 km/h (varies with road conditions).</li>
<li>On hybrid vehicles, the ESP® warning light blinks while ABS is operating — this is normal.</li>
</ul>
<p>You may also hear a motor sound briefly after starting the engine or beginning to drive. This is the system running a self-check and is not a malfunction.</p>
<h3>Braking Distance with ABS</h3>
<p>ABS is not designed to shorten stopping distance. On slippery roads or when braking suddenly, stopping distance with ABS is approximately the same as without. For the shortest possible stopping distance, press the brake pedal firmly without pumping.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>In the following situations, stopping distance with ABS may be slightly longer than without ABS. Drive slowly and maintain extra following distance:</p>
<ul>
<li>Unpaved or stone-paved roads</li>
<li>Gravel roads or fresh snow</li>
<li>Road joints and surface height differences</li>
<li>Metal surfaces such as manhole covers</li>
<li>When snow chains are installed</li>
</ul>
</div>
<h3>Situations Where ABS May Activate Unexpectedly</h3>
<p>ABS may activate briefly when braking on the following surfaces, which is normal:</p>
<ul>
<li>Slippery surfaces (manholes, metal plates in construction zones, gravel)</li>
<li>Road joints and height differences in the road surface</li>
<li>Bumpy roads and cobblestones</li>
</ul>
<h3>ABS Warning Light</h3>
<p>If there is a problem with the ABS system when the ignition is in ON mode, this light comes on. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<h2>Braking Assist</h2>
<p>Braking assist provides additional braking force when the brake pedal is operated. When sudden braking is applied, it shortens the time for ABS to reach full effectiveness.</p>
<ul>
<li>Braking assist will not operate if the brake pedal is not depressed firmly.</li>
<li>Braking assist does not extend braking performance beyond the vehicle's inherent capability.</li>
</ul>
</template>

<template id="tpl-tyre-pressure">
<h1>Tyre Pressure Monitoring System (TPMS) (if equipped)</h1>
<p>The TPMS alerts you when one or more tyres is significantly under-inflated. Each wheel carries a sensor with a unique ID code that transmits tyre pressure data to the vehicle's body control module. When significant under-inflation is detected, the low tyre pressure warning light comes on.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>TPMS is not a substitute for regular tyre maintenance. The warning light only activates when under-inflation is significant — moderately under-inflated tyres can still reduce load capacity, tyre life, and fuel efficiency without triggering the light. Check tyre pressure monthly when the tyres are cold regardless of whether the light is on.</p>
<p><strong>WARNING:</strong> The TPMS cannot alert you to tyre damage caused by external factors such as nails or road debris if no drop in inflation pressure is detected.</p>
</div>
<h2>Low Tyre Pressure Warning Light</h2>
<p>Check each tyre monthly when cold and inflate to the pressure shown on the vehicle's tyre pressure placard or label.</p>
<p><strong>When the light comes on and stays on:</strong> Reduce speed, avoid abrupt steering and braking, and stop in a safe place as soon as possible. Check all tyres. Driving on a significantly under-inflated tyre causes it to overheat and can lead to tyre failure, affecting steering control and braking effectiveness.</p>
<ul>
<li>If one or more tyres is flat, replace with the spare tyre (optional). Refer to <a onclick="navigate('jacking')" href="javascript:void(0)">10-05 Jacking Instructions</a> in the EMERGENCY SERVICE section.</li>
<li>If tyres are under-inflated, adjust all tyres to the recommended pressure as soon as possible.</li>
</ul>
<p><strong>When the light does not come on for 2 seconds after ignition ON, or blinks while driving:</strong> Have the vehicle inspected by a Maruti Suzuki authorised workshop. Even if the light stops blinking on its own, the system should still be checked.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Relying solely on TPMS to determine when to add air can result in loss of control or an accident. Always check pressures monthly with a gauge.</p>
</div>
<h2>Normal Causes for the Warning Light Coming On</h2>
<p>The low tyre pressure warning light can come on due to normal causes unrelated to a puncture:</p>
<ul>
<li>Natural air leakage over time</li>
<li>Pressure changes caused by temperature drops or changes in atmospheric pressure (e.g. at high altitude)</li>
</ul>
<p>To turn off the light after adjusting pressures, inflate tyres to the correct cold pressure and drive for approximately 10 minutes. The light goes off when the adjusted pressure is recognised. If it comes back on shortly after, you may have a slow puncture.</p>
<h2>Temperature and Altitude Effects on Tyre Pressure</h2>
<p>Tyre pressure changes with temperature. Always check and adjust pressure when tyres are cold:</p>
<ul>
<li>Tyres checked after driving will read higher than the actual cold pressure.</li>
<li>Tyres inflated in a warm garage may fall below the specified pressure when driven in cold outdoor temperatures.</li>
<li>If inflating in a garage that is warmer than the outside temperature, add 1 kPa to the recommended cold pressure for every 0.8°C difference between garage and outdoor temperature.</li>
<li>At high altitude, the warning light may not turn off even after adjustment. In this case, inflate slightly above the placard pressure.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<p>The light may turn off temporarily after coming on due to rising tyre temperature during extended driving or in a hot climate. Even if it turns off, check all tyre pressures.</p>
</div>
<h2>TPMS Malfunction Indicator</h2>
<p>The malfunction indicator uses the same warning light as low tyre pressure. When a system malfunction is detected, the light flashes for approximately 75 seconds and then remains on continuously. This sequence repeats on each subsequent engine start until the fault is resolved.</p>
<p>While the malfunction indicator is on, the system may be unable to detect or signal low tyre pressure. Have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<p>Common causes of TPMS malfunction include:</p>
<ul>
<li>Replacement or non-genuine tyres or wheels that prevent the sensors from communicating</li>
<li>Damaged sensors from tyre installation or removal</li>
<li>Use of liquid tyre sealant (not the repair kit supplied with the vehicle)</li>
</ul>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Have tyres repaired or replaced by a Maruti Suzuki authorised workshop. Tyre pressure sensors can be damaged during tyre installation or removal by non-authorised workshops.</p>
<p><strong>NOTICE:</strong> If the warning light comes on frequently, there may be a problem with one or more tyres, sensors, or the monitoring system. Have the vehicle inspected.</p>
</div>
<h2>TPMS Limitations</h2>
<p>The warning light may come on and stay on, or blink, in the following situations:</p>
<ul>
<li>When a flat tyre has been replaced with the spare (the spare does not have a TPMS sensor)</li>
<li>When the spare tyre is included in a tyre rotation</li>
<li>When a TPMS sensor is damaged during tyre replacement or liquid sealant is used</li>
<li>When radio frequency interference is present (from nearby electronic devices, metallic window film, heavy snow or ice around the wheels, or non-genuine snow tyres without TPMS sensors)</li>
<li>When non-genuine Maruti Suzuki wheels or tyres are used</li>
<li>When any tyre pressure is too high</li>
<li>When there is a problem with the TPMS controller</li>
</ul>
<h2>Checking Current Tyre Pressure on the Information Display</h2>
<p>The display may not show tyre pressures for the first approximately 10 minutes of driving while the system reads the sensors. If the vehicle has been parked with the ignition off for 20 minutes or more, pressures reset to "--- kPa" and recover after driving for a while. If a low-pressure tyre was detected before parking, the reading may remain as "---" until the issue is resolved.</p>
<p>When the warning light comes on, the display automatically switches to the tyre pressure view and the affected tyre(s) blink.</p>
<h3>Instrument Cluster Type A</h3>
<ol>
<li>With the ignition ON and the vehicle stationary, press and hold the indicator selector knob for more than 3 seconds to enter setting mode.</li>
<li>Turn the knob to select "TPMS" and press to confirm.</li>
<li>Turn the knob to select "Tyre Press" and press to confirm.</li>
<li>Current tyre pressures are displayed.</li>
</ol>
<p>To exit setting mode, select "Back" and press the knob.</p>
<h3>Instrument Cluster Type B</h3>
<ol>
<li>With the ignition ON and the vehicle stationary, press the left/right selector switch to enter setting mode.</li>
<li>Select "Vehicle settings" and press the OK switch.</li>
<li>Select "TPMS" and press the OK switch.</li>
<li>Select "Tyre pressure" and press the OK switch.</li>
<li>Current tyre pressures are displayed.</li>
</ol>
<p>To exit setting mode, press the left/right selector switch.</p>
<h2>Replacing Tyres and/or Wheels</h2>
<p><strong>After a flat tyre:</strong> If replaced with the spare (optional), have a Maruti Suzuki authorised workshop mount a new tyre on the original wheel. The TPMS is already programmed with the original wheel's sensor ID and normal operation will be restored automatically.</p>
<p><strong>When replacing any wheel:</strong> A Maruti Suzuki authorised workshop must install TPMS sensors in the new wheels and register the new sensor IDs with the system.</p>
<p><strong>Spare tyre:</strong> The spare tyre does not have a TPMS sensor. Use it only in emergencies and replace it with a standard tyre as soon as possible to restore normal TPMS operation.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Use of tyres or wheels not recommended by Maruti Suzuki can cause TPMS failure. Use only manufacturer-recommended tyres and wheels. Refer to <a onclick="navigate('tyres')" href="javascript:void(0)">09-13 Tyres</a> in the INSPECTION AND MAINTENANCE section.</p>
<p><strong>WARNING:</strong> Tampering with, modifying, or disabling TPMS components may prevent the system from warning you of low tyre pressure or malfunctions, and may void the warranty for that portion of the vehicle.</p>
</div>
</template>

<template id="tpl-when-driving">
<h1>When Driving</h1>
<h2>Start Driving after Carefully Checking the Surrounding Circumstances</h2>
<p>Be sure to always fully check the safety of the surrounding circumstances before beginning to drive.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>You cannot check the safety of the surrounding circumstances enough only by the rearview camera, the parking sensors and the inside mirror. When moving the vehicle forward or backward, check the safety of the surrounding circumstances by directly checking with your eyes.</p>
<p><strong>WARNING:</strong> Wear your seat belts at all times. Even though airbags are equipped at the front seating positions, the driver and all passengers should be properly restrained at all times, using the seat belts provided. Refer to <a onclick="navigate('seat-belts-overview')" href="javascript:void(0)">02-02 Seat Belts and Child Restraint Systems</a> for instructions on proper use of the seat belts.</p>
<p><strong>WARNING:</strong> Never drive under the influence of alcohol or other drugs. Alcohol and drugs can seriously impair your ability to drive safely, greatly increasing the risk of injury to yourself and others. You should also avoid driving when you are tired, sick, irritated or under stress.</p>
</div>
<h2>Do not Race the Engine, Avoid Fast Starts and Rapid Acceleration Just after Engine Start</h2>
<p>Refer to <a onclick="navigate('fuel-economy')" href="javascript:void(0)">06-03 Improving Fuel Economy</a> for guidance on avoiding fast starts, rapid acceleration, and hard braking.</p>
<h2>Do not Concentrate on a Mobile Phone or Navigation System</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not operate a mobile phone, etc. while driving. Being distracted by phone operation could lead to an accident.</li>
<li>Do not operate navigation/audio equipment, etc. while driving. Otherwise, there is the danger of an accident due to being distracted.</li>
</ul>
</div>
<h2>Do not Reach Through the Steering Wheel</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Reaching through the steering wheel could interfere with steering wheel operation and result in an accident.</p>
</div>
<h2>Do not Drive with Your Foot on the Brake Pedal</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Driving with your foot resting on the brake pedal could cause brake parts to become worn out more quickly than normal or cause brake components to overheat, making them less effective.</p>
</div>
<h2>When Depressing the Accelerator Pedal and the Brake Pedal Simultaneously</h2>
<div class="box note">
<div class="box-label">Note</div>
<p>If you depress both the accelerator pedal and the brake pedal simultaneously while driving, the engine power may be suppressed.</p>
</div>
<h2>Do not Shift the Gearshift Lever into "N" (Neutral) while Driving</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>Do not put the gearshift lever into the "N" (Neutral) position while driving, except in times of emergency, as this disengages engine braking, which could result in an accident.</p>
<p><strong>NOTE:</strong> Non-usage of vehicle for long duration may cause gradual rusting on brake disc surface as it is made of cast iron. This may result in noise/vibration. The same has no bearing on functioning of the vehicle. Regular driving of vehicle may prevent/remove rust, thus reducing the noise and vibration.</p>
</div>
<h2>What Should You Do in Case of Malfunction or Emergency?</h2>
<p><strong>Warning light turns on:</strong> Stop immediately in a safe place and take corrective action. For details, refer to <a onclick="navigate('warning-lights')" href="javascript:void(0)">01-02 Warning Lights and Indicators</a> in the "Quick Guide" section or <a onclick="navigate('warning-indicator-lights')" href="javascript:void(0)">04-03 Warning and Indicator Lights</a> in the "Instrument Cluster" section.</p>
<p><strong>You feel strong shock from under the floor:</strong> Immediately stop in a safe place and check whether there is brake fluid leakage or fuel leakage, and also check whether there is any abnormality in the exhaust pipe, etc. If any abnormality is found, consult a Maruti Suzuki authorized workshop.</p>
<p><strong>Sudden tyre puncture:</strong> Grasp the steering wheel firmly, carefully apply the brake, slowly reduce speed, and stop in a safe place.</p>
<p><strong>You feel that the brake pedal is heavy to use:</strong> Via engine vacuum pressure, the vehicle utilizes a brake booster to reduce the force necessary for depressing the brake pedal. If this engine vacuum pressure decreases, you may feel as if the brakes require more force than usual to depress, but this is not abnormal. Depress the brake pedal as strongly as you need to.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The brakes could be losing their ability to function normally, which could result in an accident.</p>
</div>
<p><strong>Metallic screeching sound is heard from the brakes:</strong> Promptly consult a Maruti Suzuki authorized workshop. The disk brake pads (Maruti Suzuki genuine parts) are designed to emit a creaking/screeching sound as a function to warn the wear, as they have almost reached usage limit and replacement timing.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If you hear a metallic creaking/screeching sound, do not continue driving.</p>
</div>
<h2>Use Engine Brake on a Long Downhill Slope</h2>
<p>Use engine braking in tandem with regular braking when driving on a long downhill slope. Release the accelerator pedal and shift down according to vehicle speed.</p>
<p>Shift the gearshift lever into "M" (manual mode) first. Then, pull the "–" side of the shift paddle to shift down to an appropriate gear position.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Engine braking is a braking effect that occurs when you release your foot from the accelerator pedal while driving. The lower the gear, the greater the effect of engine braking becomes.</p>
<p><strong>WARNING:</strong> Continuously depressing the brake pedal could cause the brakes to overheat, possibly rendering them ineffective.</p>
</div>
<h2>When Side Wind Is Strong</h2>
<p>At a tunnel exit, on a bridge, or when a large truck passes you, your vehicle might be blown slightly sideways by side wind. Do not panic. Firmly grasp the steering wheel, gradually reduce speed, and regain your intended course.</p>
<h2>Drive Slowly on a Slippery Road Surface</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>When driving on wet, icy, or snowy roads, etc., refrain from sudden movements, such as sudden starting, acceleration, braking, turning or abrupt engine braking. Otherwise, there is the danger of an accident due to loss of traction.</p>
</div>
<h2>Do not Drive on Puddles at High Speed</h2>
<div class="box caution">
<div class="box-label">Caution</div>
<p>When driving on puddles or on wet road surfaces at high speed, a thin surface of water is built between the wheels and the road surface, and the wheels may float. This is called hydroplaning, which leads to a loss of control in the steering wheel and the brakes and possibly results in an accident.</p>
</div>
<h2>Check Brake Effectiveness after Driving on Puddles or Washing a Vehicle</h2>
<ul>
<li>After verifying the safety of the surroundings, depress the brake pedal several times at low speed and check the brake effectiveness.</li>
<li>If the brake effectiveness is still poor, depress the brake pedal at low speed gently and repeatedly until the brake effectiveness is fully recovered, to dry the brake equipment.</li>
</ul>
<h2>When Encountering a Flooded Area</h2>
<div class="box notice">
<div class="box-label">Notice</div>
<p>Avoid driving in a flooded area or a deep puddle. It may cause an engine stall, short in electrical components, engine and transmission damages, etc.</p>
</div>
<p>Avoid driving in a flooded area or a deep puddle. If driving in a flooded area is unavoidable, go slowly in the lowest gear. In case that you have driven in a flooded area, stop the vehicle in a safe and non-flooded place while checking the brake effectiveness. Then, ask a Maruti Suzuki authorized workshop to check the following inspection items:</p>
<ul>
<li>Function of brake.</li>
<li>Function of electrical components.</li>
<li>Changes of oil level and quality for engine and transmission. In case that the oil is turbid and whitish, water has been mixed in the oil and an oil change is required.</li>
<li>Lubricant condition of the bearings, suspension joints, etc.</li>
</ul>
<h2>Highway Driving</h2>
<p>When driving at highway speeds, pay attention to the following:</p>
<ul>
<li>Stopping distance progressively increases with vehicle speed. Apply the brakes far enough ahead of the stopping point to allow for the extra stopping distance.</li>
<li>On rainy days, hydroplaning can occur. Hydroplaning is the loss of direct contact between the road surface and the vehicle's tyres due to a water film forming between them. Steering or braking the vehicle during hydroplaning can be very difficult, and loss of control can occur. Keep speed down when the road surface is wet.</li>
<li>At high speeds, the vehicle may be affected by side winds. Therefore, reduce speed and be prepared for unexpected buffeting, which can occur at the exits of tunnels, when passing by a cut of a hill, or when being overtaken by large vehicles, etc.</li>
</ul>
<h2>Driving on Hills</h2>
<p>When driving uphill, if the vehicle begins to slow down and show a lack of power, shift to a lower gear using the "–" paddle so that the engine will again be operating in its higher power range. Shift rapidly to prevent the vehicle from losing momentum.</p>
<p>When driving downhill, use engine braking by shifting to a lower gear using the "–" paddle.</p>
<div class="box notice">
<div class="box-label">Notice</div>
<p>When descending a downhill, never press the engine switch to change the ignition mode to LOCK (OFF). Emission control system and automatic transmission damage may result.</p>
<p><strong>WARNING:</strong> Do not hold the brake pedal down too long or too often while going down a steep or long hill. This could cause the brakes to overheat, resulting in reduced braking efficiency. Failure to take this precaution could result in loss of vehicle control.</p>
</div>
</template>

<template id="tpl-offroad-driving">
<h1>Off-road Driving</h1>
<h2>Do not Drive in the Field Covered with Grown Grass</h2>
<p>Do not drive in the field covered with grown grass. If you drive in the field covered with grass, it may cause an accident, fire, or vehicle damage by getting caught in grown grass.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>If loose grass, etc. becomes entangled in drive train parts or exhaust pipes, drive train components might become damaged or fire may result.</p>
</div>
