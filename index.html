<h2>Securing a Child Restraint System by Seat Belt</h2>
<ol>
<li>Place the child restraint system on the rear seat, following the manufacturer's instructions.</li>
<li>If the head restraint interferes with the child restraint system, adjust the head restraint to its highest position or remove it.</li>
<li>Route the seat belt through or around the child restraint system as instructed by its manufacturer.</li>
<li>Insert the latch plate into the buckle until you hear a click.</li>
<li>Remove any slack from the belt by pulling the shoulder portion upward while pressing down on the child restraint system.</li>
<li>Pull the lap portion of the belt to confirm there is no slack.</li>
<li>Push and pull the child restraint system firmly in various directions to confirm it is securely installed.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Install the child restraint system on a rear seat whenever possible. Placing it on the front passenger's seat is dangerous because a deploying airbag can strike the child restraint system.</li>
<li>Never use a single belt to secure more than one child restraint system or more than one occupant.</li>
<li>After installing the child restraint system, always check that it is firmly secured. An improperly secured child restraint system can cause serious injury in a collision.</li>
</ul>
<p><strong>CAUTION:</strong> Make sure the seat belt is not twisted when securing the child restraint system.</p>
</div>
<h2>Securing a Child Restraint System by ISOFIX</h2>
<p>ISOFIX lower anchorages are located at the rear outboard seating positions. The anchorages are marked with the ISOFIX symbol.</p>
<p>To locate the lower anchorages, press down on the seatback-to-cushion junction between the seatback and the seat cushion. The lower anchorage bars can be felt through the upholstery.</p>
<p><strong>Attaching the ISOFIX connectors:</strong></p>
<ol>
<li>Position the child restraint system on the seat.</li>
<li>If the head restraint interferes with the child restraint system, adjust it to its highest position or remove it.</li>
<li>Push the child restraint system firmly rearward into the seat.</li>
<li>Attach the ISOFIX connectors to the lower anchorage bars until you hear a click.</li>
<li>Pull the child restraint system forward to confirm the connectors are securely latched.</li>
<li>Push and pull the child restraint system firmly in various directions to confirm it is securely installed.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Make sure the ISOFIX connectors are securely latched to the lower anchorage bars. An improperly latched child restraint system may not protect the child in a collision.</li>
<li>Always use the top tether when required by the child restraint system manufacturer's instructions.</li>
</ul>
</div>
<h2>Installation with Top Tether</h2>
<p>A top tether anchorage is provided on the rear shelf area for use with forward-facing ISOFIX child restraint systems that have a top tether strap.</p>
<p>To attach the top tether:</p>
<ol>
<li>Route the top tether strap over the rear seatback and toward the rear shelf.</li>
<li>Locate the top tether anchorage hook point on the rear shelf.</li>
<li>Attach the top tether hook to the anchorage.</li>
<li>Tighten the top tether strap according to the child restraint system manufacturer's instructions.</li>
<li>Confirm the strap is taut and the child restraint system does not move excessively.</li>
</ol>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not attach the top tether to the luggage restraint loops. These loops are designed only for securing luggage, not for child restraint systems. Using them as a top tether anchorage will not adequately restrain the child restraint system in a collision and may cause serious injury.</p>
</div>
</template>

<template id="tpl-airbags">
<h1>Supplemental Restraint System (Airbags)</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<p>This section describes the protection provided by your Maruti Suzuki vehicle's supplemental restraint system (airbags). Read and follow all instructions carefully to minimise your risk of severe injury or death in the event of a collision.</p>
</div>
<p>Your vehicle is equipped with a supplemental restraint system consisting of the following components in addition to a lap-shoulder belt at each seating position:</p>
<ol>
<li>Side curtain airbag module</li>
<li>Side crash sensor</li>
<li>Front passenger's front airbag module</li>
<li>Driver's front airbag module</li>
<li>Forward crash sensor</li>
<li>Front seat belt pretensioner</li>
<li>Side airbag module</li>
<li>Airbag controller</li>
</ol>
<h2>What is SRS Airbag System?</h2>
<p>SRS stands for "Supplemental Restraint System". This system aims to restrain passengers in their seats for safety.</p>
<p>If the airbag warning light on the instrument cluster does not blink or come on when the ignition mode is first changed to ON, or if the airbag warning light stays on or comes on while driving, the airbag system (or the seat belt pretensioner system) may not work properly. Have the airbag system inspected by a Maruti Suzuki authorised workshop as soon as possible.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>SRS airbag system is not a substitute for seat belts. SRS airbag system is the supplemental restraint system and will provide the effectiveness by using the seat belts at the same time. If you and the passengers do not fasten their seat belts, it may result in severe injury in a sudden braking or a collision. Even when you drive the vehicle equipped with SRS airbag system, make sure to fasten seat belt.</li>
<li>If the seat belts are not fastened properly, airbags may not provide the best performance. This may cause severe injury in a sudden braking and a collision. Make sure that the driver and all the passengers fasten the seat belts properly in a correct posture.</li>
</ul>
<p><strong>NOTE:</strong> Via the event data recorder (EDR) system, this vehicle records and accumulates data when the airbag is deployed.</p>
</div>
<h2>Front Airbags</h2>
<p>Front airbags are designed to inflate in severe frontal collisions when the ignition mode is ON. Front airbags are not designed to inflate in rear impacts, side impacts, rollovers, or minor frontal collisions, since they would offer no protection in those types of accidents.</p>
<p>Since an airbag deploys only one time during an accident, seat belts are needed to restrain occupants from further movements during the accident. Therefore, an airbag is not a substitute for seat belts. To maximise your protection, always fasten your seat belts.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>In a frontal angle collision, the side airbags and side curtain airbags may inflate.</p>
</div>
<h2>Side Airbags and Side Curtain Airbags</h2>
<p>Side airbags and side curtain airbags are designed to inflate in severe side impact collisions when the ignition mode is ON. They are not designed to inflate in frontal or rear collisions, rollovers, or minor side collisions, since they would offer no protection in those types of accidents. Only the side airbag and side curtain airbag on the side of the vehicle that is struck will inflate. However, in a frontal angle collision, the side airbags may inflate.</p>
<p>Since an airbag deploys only one time during an accident, seat belts are needed to restrain occupants from further movements during the accident. Therefore, an airbag is not a substitute for seat belts. To maximise your protection, always fasten your seat belts.</p>
<h2>When Driving with SRS Airbag System</h2>
<p><strong>Correct Sitting Posture</strong></p>
<p>There is a possibility of major impact from the front airbags when the airbags activate and deploy instantaneously. The driver and the passenger should sit deeply into their seats and touch their backs lightly to the seatback. In addition, the seat should be positioned so that it is not too far forward.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>SRS airbag system is not a substitute for seat belts. SRS airbag system is the supplemental restraint system and will provide the effectiveness by using the seat belts at the same time. If you and the passengers do not fasten their seat belts, it may result in severe injury in a sudden braking or a collision. Even when you drive the vehicle equipped with SRS airbag system, make sure to fasten seat belt.</li>
<li>Do not position your face, chest, etc., close to the steering wheel or instrument cluster, and do not rest your feet up into this area. Otherwise, there is the risk of serious injury due to major impact if the airbag were to be deployed.</li>
<li>If side airbags or side curtain airbags activate, you may get strong impact, resulting in severe injury. Do not put hands out of the window or lean on the door. Also, when sitting in the rear seat, do not hug the seatback of the front seat.</li>
</ul>
</div>
<h2>For Proper SRS Airbag System Operation</h2>
<p>If objects are positioned within the range where the airbag deploys, such objects might be impacted and blown off or the airbag may not deploy properly.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not modify the steering wheel, such as replacing it, placing stickers on it, painting it, or putting the cover on it.</li>
<li>Do not place stickers on the airbag units or the surrounding areas or paint them. Also, do not attach any accessories, fragrances, electronic toll control units, portable car navigation systems, etc. to this area, and do not lean umbrellas or other objects against it.</li>
<li>Do not attach accessories (except for Maruti Suzuki genuine products), etc., to the windshield or the inside rearview mirror.</li>
<li>For the vehicle with side airbags or side curtain airbags, do not attach accessories such as cup holders or hangers near the door. Also, do not lean umbrellas against the door.</li>
</ul>
</div>
<p><strong>Warning Label of SRS Airbag for Front Passenger's Seat</strong></p>
<p>You may find this label on the sun visor.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>NEVER use a rearward facing child restraint on a seat protected by an ACTIVE AIRBAG in front of it. DEATH or SERIOUS INJURY to the CHILD can occur.</p>
</div>
<h2>SRS AIRBAG Mark and Location</h2>
<p>The words "SRS AIRBAG" are marked on the airbag covers to identify the location of the airbags:</p>
<ul>
<li><strong>Driver's front airbag:</strong> Located behind the center pad of the steering wheel.</li>
<li><strong>Front passenger's front airbag:</strong> Located behind the passenger's side of the dashboard.</li>
<li><strong>Side airbags:</strong> Located in the part of the front seatbacks closest to the doors.</li>
<li><strong>Side curtain airbags:</strong> Located in the roof lining.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>If the airbag stored place is damaged or cracked, the airbag system may not work properly, which could result in serious injury in the event of a collision. Have your vehicle inspected by Maruti Suzuki authorised workshop.</li>
<li>If you smash the airbag stored place or apply a strong impact to it, the airbag may not work properly or may inflate unexpectedly, resulting in serious injury. Do not smash the airbag stored place or apply a strong impact to it.</li>
</ul>
</div>
<p><strong>Installation of Child Restraint System</strong></p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not install a child restraint system on the front passenger's seat.</p>
</div>
<p>Refer to <a onclick="navigate('seat-belts-overview')" href="javascript:void(0)">02-02 Seat Belts and Child Restraint Systems</a> for details on securing your child.</p>
<h2>Handling for Airbags</h2>
<p><strong>For Proper SRS Airbag System Operation</strong></p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>As the airbag may not provide the best performance and it may result in severe injury in case of emergency, observe the following:</li>
<li>Do not modify the suspension. If the vehicle height or the stiffness of the suspension were to change, airbag malfunction may result.</li>
<li>When installing a grille guard, etc., on the front of the vehicle, consult Maruti Suzuki authorised workshop. If you modify the front part of the vehicle, the airbag system may not work properly.</li>
<li>When installing radio equipment, etc., consult Maruti Suzuki authorised workshop. Radio waves, etc., from a radio may adversely affect the computer module used in the airbag system.</li>
<li>Even though your vehicle is damaged by a collision, it may not be severe enough to trigger front, side, or side curtain airbags to inflate. If your vehicle sustains any front-end or side damage, have the airbag system inspected by Maruti Suzuki authorised workshop to ensure that it works properly. If the original function of airbag system is damaged, airbag may not function effectively and fully in case of an emergency.</li>
<li>If the airbag-related parts are replaced or repaired in a way that has a negative impact on the airbag functions, the airbag may activate unnecessarily or may not activate when necessary. The following situations may give a negative impact to the airbag system — in these cases, consult Maruti Suzuki authorised workshop beforehand: removing the steering wheel or repairing areas around the steering wheel; center console repair; repairs around the instrument cluster; repairs under the front seat; repairs of electrical wiring; installation of audio equipment; sheet metal painting and repairs around the dashboard; replacement of the front seat and repairs around the seat; repairs around the front pillar, the back pillar, or the roof side; repairs around the center pillar.</li>
</ul>
</div>
<p><strong>Driver's Front Airbag Precautions</strong></p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Do not position your hands, face, chest, etc., close to the airbag unit area or lean on the steering wheel. Otherwise, there is the risk of serious injury due to major impact if the airbag were to be deployed.</li>
<li>Do not modify the steering wheel, such as replacing it, placing stickers on it, painting it, or putting the cover on it. Otherwise, the airbag may not deploy normally in case of emergency, resulting in severe injury.</li>
</ul>
</div>
<p><strong>Side Airbags and Side Curtain Airbags Precautions</strong></p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When riding in the front passenger's seat or when allowing a child to ride in this seat, be sure to observe the following points. Failure to do so may result in serious injury due to major impact if the airbag is deployed:</li>
<li>Do not position your hands or feet on the airbag unit area, and do not position your face, chest, etc., close to this area.</li>
<li>Do not allow a child to stand in front of the airbag unit area or sit on a passenger's lap in the front passenger's seat. Have a child ride in the rear seat wearing a seat belt.</li>
<li>For a child that is not yet big enough to wear a seat belt properly, be sure to use a child restraint system on the rear seat.</li>
<li>As the airbag may not provide the best performance and it may result in severe injury in case of emergency, observe the following:</li>
<li>Do not place stickers on the airbag units or the surrounding areas or paint them. Also, do not attach any accessories, fragrances, electronic toll control units, portable car navigation systems, etc. to this area, and do not lean umbrellas or other objects against it.</li>
<li>Do not attach accessories (except for Maruti Suzuki genuine products), etc., to the windshield or the inside rearview mirror.</li>
<li>If you attach accessories such as cup holders or hangers near the door, or if you lean umbrellas against the door, when side airbags or side curtain airbags activate, these objects may be thrown out and may not inflate properly, resulting in severe injury. Do not attach cup holders or hangers near the door. Also, do not lean umbrellas against the door.</li>
</ul>
</div>
<h2>Function of Airbags</h2>
<p><strong>How the System Works</strong></p>
<p>In a frontal collision, the collision sensors will detect rapid deceleration, and if the controller judges that the deceleration represents a severe frontal collision, the controller will trigger the inflators. The inflators inflate the appropriate airbags with nitrogen or argon gas. The inflated airbags provide a cushion for your head and upper body. The airbag inflates and deflates so quickly that you may not even realize that it has activated. The airbag will neither hinder your view nor make it harder to exit the vehicle.</p>
<p>A seat belt helps keep you in the proper position for maximum protection when an airbag inflates. Adjust your seat as far back as possible while still maintaining control of the vehicle. Sit fully back in your seat; sit up straight; do not lean over the steering wheel or dashboard. Front occupants should not lean on or sleep against the door.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>The driver should not lean over the steering wheel. The front passenger should not rest his or her body against the dashboard where a front airbag is mounted, or a child should not stand in front of the dashboard. For vehicles with side airbags and side curtain airbags, occupants should not lean on or sleep against the door. In these situations, the out-of-position occupant would be too close to an inflating airbag, and may suffer severe injury.</li>
<li>Do not attach any objects to, or place any objects over, the steering wheel or dashboard. Do not place any objects between the airbag and the driver or front passenger. These objects may interfere with airbag operation or may be propelled by the airbag in the event of a collision. Also, these objects may move when you start moving vehicle or while vehicle is moving, and may interfere with driver's view or safe driving.</li>
<li>For vehicles with side airbags, do not use non-genuine seat covers on the front seats, because non-genuine seat covers may obstruct the inflation of side airbags. Maruti Suzuki highly recommends Maruti Suzuki-genuine seat covers to be used when covering the front seats of such vehicles with side airbags. Also, near the door, do not place cup holders, hangers, or any other objects and do not lean an umbrella, as these objects could be propelled by the airbag in the event of a collision.</li>
<li>Do not strike or apply significant levels of impact to the airbag component areas. It can cause the airbags to malfunction.</li>
<li>Even though your vehicle is damaged by a collision, it may not be severe enough to trigger front, side, or side curtain airbags to inflate. If your vehicle sustains any front-end or side damage, have the airbag system inspected by Maruti Suzuki authorised workshop to ensure that it works properly.</li>
</ul>
<p><strong>CAUTION:</strong> Airbags must inflate quickly and forcefully in order to reduce the chance of serious or fatal injuries. However, an unavoidable consequence of the quick inflation is that the airbag may irritate bare skin, such as the facial area against a front airbag. Wash off any residue as soon as possible to prevent skin irritation. Also, upon inflation, a loud noise will occur and some powder and smoke will be released. These conditions are not harmful and do not indicate a fire in the vehicle. Be aware, however, that some airbag components may be hot for a while after inflation. This may cause burn injury.</p>
</div>
<p>Your vehicle is equipped with a diagnostic module which records information about the airbag system if the airbags deploy in a collision. The module records information about overall system status, and which sensors activated the deployment.</p>
<p><strong>Servicing the Airbag System</strong></p>
<p>If the airbags inflate, have the airbags and related components replaced by Maruti Suzuki authorised workshop as soon as possible.</p>
<p>If your vehicle ever gets in deep water and the driver's floor is submerged, the airbag controller could be damaged. If this happens, ask Maruti Suzuki authorised workshop to check the airbag system as soon as possible.</p>
<p>Special procedures are required for servicing or replacing an airbag. For that reason, only Maruti Suzuki authorised workshop should be allowed to service or replace your airbags. Remind anyone who services your Maruti Suzuki vehicle that it has airbags.</p>
<p>Service on or around airbag components or wiring must be performed only by Maruti Suzuki authorised workshop. Improper service could result in unintended airbag deployment or could render the airbag inoperative. Either of these two conditions may result in severe injury.</p>
<p>To prevent damage or unintended inflation of the airbag system, check that the battery is disconnected and the ignition mode has been in LOCK (OFF) for at least 90 seconds before performing any electrical service work on your Maruti Suzuki vehicle. Do not touch airbag system components or wires. The wires are wrapped with yellow tape or yellow tubing, and the couplers are yellow for easy identification.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>If you do not handle the airbags properly, they may inflate unexpectedly, resulting in personal injury. When scrapping the airbags or the vehicle that has the airbags, consult Maruti Suzuki authorised workshop.</p>
</div>
<h2>Front Airbag Deployment Conditions</h2>
<p><strong>Front airbags deploy (inflation)</strong></p>
<ul>
<li>Frontal collision with a fixed wall that does not move or deform at more than about 25 km/h.</li>
<li>Strong impact equivalent to a frontal collision at angles of about 30 degrees or less from the front of the vehicle.</li>
</ul>
<p><strong>Front airbags may inflate</strong></p>
<p>Receiving a strong impact to the lower body of the vehicle, the front airbags may inflate. Examples include hitting a curb or medial strip, falling into a deep hole or ditch, and landing hard or falling.</p>
<p><strong>Front airbags may not inflate</strong></p>
<p>The front airbags may not inflate when a strong impact has not occurred because the collision object (including living beings like animals) was easy to be deformed or moved, or the crashed portion of your vehicle was easy to be deformed. Also, front airbags may not inflate in many cases when the collision angle is greater than about 30 degrees, or in certain collisions at low speed. Examples of impacts where front airbags may not inflate include: a collision where the front of your vehicle goes under the bed of a truck; a collision with a utility pole or stumpage; a collision with a fixed wall or guardrail at left and right angles of greater than about 30 degrees from the front of your vehicle; a frontal collision with a fixed wall that does not move or deform at less than about 25 km/h; or a frontal collision with a stopped vehicle at less than about 50 km/h.</p>
<p><strong>Front airbags do not inflate</strong></p>
<p>Front airbags do not inflate in rear impacts, side impacts, or rollovers. However, these might inflate in a strong impact.</p>
<h2>Side Airbags and Side Curtain Airbags Deployment Conditions</h2>
<p><strong>Side airbags and side curtain airbags deploy (inflation)</strong></p>
<ul>
<li>Impacts from the side at about a right angle by a general passenger car to your vehicle at more than about 30 km/h or in a greater impact.</li>
</ul>
<p><strong>Side airbags and side curtain airbags may inflate in a strong impact</strong></p>
<p>Side airbags and side curtain airbags may inflate even in a frontal collision, if there is a strong impact to the lateral direction. Other situations include: frontal collision; hitting a curb or bump; falling into a deep hole or ditch; landing hard or falling.</p>
<p><strong>Side airbags and side curtain airbags may not inflate</strong></p>
<ul>
<li>Impact from the side to the vehicle body other than the passenger compartment.</li>
<li>Impact from the side at an oblique angle.</li>
<li>Impact from the side by a high hood vehicle.</li>
<li>Impact from the side by a motorcycle or bicycle.</li>
<li>Collision with a utility pole or stumpage.</li>
</ul>
<p><strong>Side airbags and side curtain airbags do not inflate</strong></p>
<p>Side airbags and side curtain airbags do not inflate in rear impacts or vehicle rollovers.</p>

<template id="tpl-when-starting-engine">
<h1>When Starting the Engine</h1>
<h2>Be Careful of Carbon Monoxide Poisoning</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Exhaust gases contain carbon monoxide, a potentially lethal gas that is colorless and odorless. If you breathe exhaust gases, you may feel drowsy, resulting in severe health problems or death in the worst case. If you start the engine, be careful of carbon monoxide poisoning.</p>
</div>
<h2>Do not Run Engine in a Poorly-ventilated Area</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Avoid breathing exhaust gases. Exhaust gases contain carbon monoxide, a potentially lethal gas that is colorless and odorless. Since carbon monoxide is difficult to detect by itself, take the following precautions to help prevent carbon monoxide from entering your vehicle. Otherwise, it may result in severe health problems or death in the worst case.</li>
<li>Do not leave the engine running in garages or confined areas, with passengers inside. This may result in accumulation of carbon monoxide in the cabin and may lead to suffocation or breathing problems and lead to death.</li>
<li>Do not park with the engine running for a long period of time, even in an open area. In case of long periods, danger of choking and death on being inside the vehicle is a possibility when the engine is running. If it is necessary to sit for a short time in a parked vehicle with the engine running, check that the air intake selector is set to "FRESH AIR" and the blower is at high speed.</li>
<li>Avoid operating the vehicle with the tailgate open. If it is necessary to do so, check that all windows are closed and the blower is at high speed with the air intake selector set to "FRESH AIR".</li>
<li>To allow proper operation of your vehicle's ventilation system, keep the air inlet grill in front of the windshield clear of snow, leaves, or other obstructions at all times.</li>
<li>Keep the exhaust tailpipe area clear of snow and other material to help reduce the buildup of exhaust gases under the vehicle. This is particularly important when parked in blizzard conditions.</li>
<li>Have the exhaust system inspected periodically for damage and leakage. Any damage or leakage should be repaired immediately.</li>
</ul>
</div>
<h2>Do not Take a Nap with Engine Running</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Do not take a nap with the engine running. Otherwise, it may result in an accident, severe health problems, or death in the worst case.</p>
<ul>
<li>Exhaust gases can enter the vehicle due to surrounding conditions and wind direction, possibly causing carbon monoxide poisoning.</li>
<li>The gearshift lever could change unintentionally, or the accelerator pedal could be depressed accidentally, causing an accident.</li>
<li>If you were to accidentally step on the accelerator pedal while asleep, the engine and exhaust system could overheat, resulting in danger of fire.</li>
</ul>
</div>
</template>

<template id="tpl-when-loading-luggage">
<h1>When Loading the Luggage</h1>
<p>Loading too much luggage in the vehicle may have negative effects to the vehicle body or driving performance.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Fuel, chemical containers, spray cans, etc. may catch fire or cause an explosion. Do not bring these objects into the vehicle.</li>
<li>If you place any objects on the instrument panel, these objects may move and interfere with the driver's view or safe driving. Also, the front passenger's front airbag may not work properly, or these objects may be thrown out when the airbag inflates in an accident. Do not place any objects on the instrument panel.</li>
</ul>
<p><strong>CAUTION:</strong></p>
<ul>
<li>If you hang any objects on the gearshift lever or use it as a handrest, the gearshift lever may not work properly, resulting in a malfunction or an accident. Do not hang any objects on the gearshift lever or use it as a handrest.</li>
<li>If you pile up luggage, it may interfere with the driver's view. Also, in a sudden braking, the luggage would jump out and it may result in an accident. Do not pile up luggage in the vehicle.</li>
<li>If animals move about in the vehicle, it may interfere with the driver's view. Also, in a sudden braking, it may result in an accident. When you bring animals into the vehicle, make sure that animals do not move about.</li>
</ul>
</div>

<template id="tpl-keys">
<h1>Keys</h1>
<p>Your vehicle comes with a pair of identical keys. Keep one key as a spare in a safe place. One key can open all of the locks on the vehicle.</p>
<h2>Key Number Plate</h2>
<p>The key identification number (1) is stamped on a metal tag (2) provided with the keys. Keep the tag in a safe place. If you lose your keys, you will need this number to have new keys made.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Carefully keep the tag in a place other than your vehicle, so that someone cannot find out about the key identification number. If you lose your key, inform the key identification number to a Maruti Suzuki authorised workshop.</li>
<li>When you resell or transfer your vehicle to a new owner or operator, give the key number plate with your vehicle to them.</li>
</ul>
</div>
<h2>Immobilizer System</h2>
<p>For details on the immobilizer system, refer to <a onclick="navigate('immobilizer')" href="javascript:void(0)">05-03 Immobilizer System</a> in the "Operating Your Vehicle" section.</p>
</template>

<template id="tpl-doors">
<h1>Doors</h1>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When a seat belt or luggage is caught by a door, the door cannot be shut properly and it may open while driving. This may cause an accident. Close a door so that no seat belt or luggage is caught in it.</li>
<li>When you keep the tailgate open with the engine running, exhaust gases will enter the vehicle and cause carbon monoxide poisoning. This may cause severe health problems or death. Do not keep the tailgate open with the engine running.</li>
<li>To prevent fire or theft, stop the engine and lock the doors when leaving the vehicle.</li>
<li>When opening a door, be careful of the surrounding area. Be very careful when opening a door especially on a windy day.</li>
</ul>
<p><strong>CAUTION:</strong></p>
<ul>
<li>When a child opens or closes a door, their hands, legs or head may be caught in the door and this may cause injury. Opening or closing a door should be performed by an adult, not a child.</li>
<li>When the tailgate is not fully opened, it may be unexpectedly closed and this may cause injury. When opening the tailgate, open it fully.</li>
<li>Opening the tailgate right behind the exhaust pipes may cause burn injury. With the engine running, do not open the tailgate right behind the exhaust pipes.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>When leaving the vehicle even for a short period of time, do not leave cash or valuables in the vehicle, to avoid risk of theft.</li>
<li>Depending on the setting conditions of the security alarm and the opening conditions of the doors, an alarm may operate. Refer to <a onclick="navigate('security-system')" href="javascript:void(0)">03-04 Security System</a> in this section.</li>
</ul>
</div>
<h2>Side Door Locks</h2>
<p>To lock a front door from outside the vehicle, insert the key and turn the top of the key toward the front of the vehicle, or turn the lock knob forward, then pull and hold the door handle as you close the door.</p>
<p>To unlock a front door from outside the vehicle, insert the key and turn the top of the key toward the rear of the vehicle.</p>
<p>To lock a door from inside the vehicle, turn the lock knob forward. Turn the lock knob rearward to unlock the door.</p>
<p>To lock a rear door from outside the vehicle, turn the lock knob forward and close the door. You do not need to pull and hold the door handle as you close the door.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>Be sure to hold the door handle when you close a locked front door, or the door will not remain locked.</p>
</div>
<h2>Central Door Locking System</h2>
<p>You can lock and unlock all doors (including the tailgate) simultaneously by using the key in the driver's door lock.</p>
<p>To lock all doors simultaneously, insert the key in the driver's door lock and turn the top of the key toward the front of the vehicle once.</p>
<p>To unlock all doors simultaneously, insert the key in the driver's door lock and turn the top of the key toward the rear of the vehicle twice.</p>
<p>To unlock the driver's door only, insert the key in that door lock and turn the top of the key toward the rear of the vehicle once.</p>
<p>You can also lock or unlock all doors by pressing the front or rear of the power door locking switch, respectively.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You can switch the function that unlocks all doors from requiring two turns/presses to requiring one, and vice versa, via the information display setting mode. Refer to <a onclick="navigate('display-settings')" href="javascript:void(0)">12-19 Setting Mode of Information Display (Type B)</a> in the "Specifications" section.</p>
<p><strong>NOTE:</strong> You can also lock or unlock all doors by operating the remote controller, or by pushing the request switch. Refer to <a onclick="navigate('remote-controller')" href="javascript:void(0)">03-03 Keyless Push Start System Remote Controller</a> in this section.</p>
</div>
<h2>Child-proof Locks (Rear Doors)</h2>
<p>Each rear door is equipped with a child-proof lock to help prevent unwanted opening from inside. When the lock lever is in the lock position, the rear door can only be opened from outside. When in the unlock position, the rear door can be opened from inside or outside.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Be sure to place the child-proof lock in the lock position whenever children are seated in the rear.</p>
<p><strong>NOTE:</strong> When you open a door from inside with the child-proof lock engaged, put your hand out of the window and use the door handle.</p>
</div>
<h2>Tailgate</h2>
<h3>Locking and Unlocking from Outside</h3>
<p>You can lock and unlock the tailgate by using the key in the driver's door lock.</p>
<p>To open the tailgate, push and hold the tailgate unlatch switch and lift the tailgate.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>When the tailgate is closed incompletely, push the tailgate unlatch switch, open the tailgate, then close it again and check that it is fully closed.</p>
<p><strong>WARNING:</strong> Always ensure that the tailgate is closed and latched securely. Completely closing the tailgate helps prevent occupants from being thrown from the vehicle in an accident and helps keep exhaust gases from entering the vehicle.</p>
<p><strong>WARNING:</strong></p>
<ul>
<li>Make sure that the tailgate is fully closed before driving. If the tailgate is not fully closed, it may open unexpectedly while driving and hit nearby objects, or luggage in the luggage compartment may be thrown out, causing an accident.</li>
<li>Do not allow children to play in the luggage compartment.</li>
<li>Keep the tailgate closed while driving.</li>
<li>Never let anyone sit in the luggage compartment.</li>
<li>When opening or closing the tailgate, thoroughly check that the surrounding area is safe.</li>
<li>Use caution when opening or closing the tailgate in windy weather as it may move abruptly.</li>
<li>Do not pull on the tailgate spindle to close the tailgate, and do not hang on it.</li>
<li>When closing the tailgate, take extra care to prevent your fingers from being caught.</li>
<li>The tailgate may suddenly shut if it is not opened fully while on a steep incline. Make sure that the tailgate is secured before using the luggage compartment.</li>
</ul>
<p><strong>CAUTION:</strong> To avoid damage and malfunction of the damper stay, do not scratch the rod part of the damper stay, do not allow foreign materials such as dirt or tape to attach to it, and do not hang any objects on it.</p>
</div>
<h3>Unlocking from Inside the Vehicle</h3>
<p>If you cannot unlock the tailgate using the key in the driver's door lock due to a discharged battery or malfunction, reach out to a Maruti Suzuki authorised workshop. In an emergency, follow the procedure below.</p>
<ol>
<li>Remove the luggage compartment cover (if equipped) and fold the rear seat forward for easier access. Refer to <a onclick="navigate('rear-seats')" href="javascript:void(0)">02-06 Rear Seats</a> in the "For Safe Driving" section.</li>
<li>Remove the cover (5) using a flat-bladed screwdriver.</li>
</ol>
<img src="tailgate-emergency-cover-removal.png" alt="Removing cover (5) from inside the tailgate">
<ol start="3">
<li>Move the emergency lever (6) in the direction of the arrow with a flat-blade screwdriver as shown in the illustration.</li>
</ol>
<img src="tailgate-emergency-with-spt.png" alt="Emergency lever (6) location — smart power tailgate vehicles">
<ol start="4">
<li>Push open the tailgate from inside. The tailgate will be latched again by simply closing it.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<p>If you release the lever immediately after unlatching, the tailgate will be half-shut. Push open the tailgate while pulling the lever. If the tailgate cannot be unlatched, have the vehicle inspected by a Maruti Suzuki authorised workshop.</p>
<p><strong>CAUTION:</strong></p>
<ul>
<li>Do not touch the edges of the holes of the tailgate when you pull or push the lever, as this may cause injury.</li>
<li>Check that there is no one near the tailgate when pushing it open from inside the vehicle.</li>
</ul>
</div>
<h3>Opening and Closing the Tailgate (Smart Power Tailgate)</h3>
<h3>Using the Remote Controller</h3>
<p>Press and hold the tailgate button (3) on the remote controller. The smart power tailgate automatically opens/closes.</p>
<p>Pressing the button while the tailgate is opening/closing stops the operation. Pressing and holding again during the halted operation reverses the direction.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>This function works only when the ignition is off.</p>
</div>
<h3>Using the Smart Power Tailgate Switch (Instrument Panel)</h3>
<p>Unlock the tailgate before operating. Press and hold the switch (1) on the instrument panel. The smart power tailgate automatically opens/closes.</p>
<p>Pressing the switch while operating stops the operation. Pressing and holding again during the halted operation reverses the direction.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If the security system is armed, use either the request switch or remote controller to unlock the tailgate before operating.</p>
</div>
<h3>Using the Switches on the Tailgate</h3>
<p>To open: Unlock the tailgate before operating. Press the switch (1) on the upper part of the tailgate. The smart power tailgate automatically opens.</p>
<p>To close: Press the switch (2) on the lower part of the tailgate. The smart power tailgate automatically closes. Pressing the switch while operating stops the operation; pressing again reverses the direction.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If the security system is armed, use either the request switch or remote controller to unlock the tailgate before operating.</p>
</div>
<h3>Using the Tailgate Handle</h3>
<p>Lower the tailgate using the tailgate handle (3). The tailgate closing assist will activate and the smart power tailgate will fully close automatically.</p>
<h3>Using Gesture Control</h3>
<ol>
<li>While carrying the remote controller, stand within the request switch operation range from the rear bumper.</li>
<li>Perform a kick operation by moving your foot to within approximately 10 cm of the rear bumper and then pulling it back. Perform the entire kick operation within 1 second.</li>
<li>When the gesture control detects that your foot is pulled back, a buzzer will sound and the tailgate will automatically fully open/close.</li>
</ol>
<p>If a foot is moved under the rear bumper while the tailgate is opening/closing, the tailgate will stop. Moving your foot under the bumper again reverses the direction.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Check the safety of the surrounding area before operating.</li>
<li>When putting your foot near the lower centre part of the rear bumper, be careful not to touch the exhaust pipes until they have cooled down sufficiently.</li>
<li>Do not leave the remote controller within the effective detection range of the luggage compartment.</li>
</ul>
</div>
<h3>Gesture Control Operating Conditions</h3>
<p>The gesture control will open/close automatically when all of the following conditions are met:</p>
<ul>
<li>The gesture control operation is enabled.</li>
<li>The remote controller is within the operational range.</li>
<li>A foot is put near the lower centre part of the rear bumper and moved away from it.</li>
</ul>
<p>The smart power tailgate may also be operated by putting a hand, elbow, knee, etc. near the lower centre part of the rear bumper and moving it away.</p>
<h3>Situations Where Gesture Control May Not Operate Properly</h3>
<ul>
<li>A foot remains under the rear bumper.</li>
<li>The rear bumper is strongly hit or touched for a while (wait a short time before trying again).</li>
<li>Someone is too close to the rear bumper during operation.</li>
<li>An external radio wave source interferes with communication between the remote controller and vehicle.</li>
<li>The vehicle is parked near an electrical noise source (pay parking, fuel station, electrically heated road, fluorescent light).</li>
<li>The vehicle is near a TV tower, power plant, radio station, large electronic display, airport, or other facility generating strong radio waves.</li>
<li>A large volume of water is applied to the rear bumper (car wash, heavy rain).</li>
<li>Mud, snow, ice, etc. is attached to the rear bumper.</li>
<li>The vehicle has been parked near moving objects that may contact the rear bumper (plants, shrubs).</li>
<li>An accessory is installed to the rear bumper. If an accessory has been installed, turn the gesture control operation setting off. Contact a Maruti Suzuki authorised workshop to do so.</li>
</ul>
<h3>Preventing Unintentional Operation of Gesture Control</h3>
<p>When a remote controller is in the operation range, the gesture control may operate unintentionally in these situations:</p>
<ul>
<li>Large volume of water applied to the rear bumper (car wash, heavy rain).</li>
<li>Wiping dirt off the rear bumper.</li>
<li>A small animal or object rolling under the rear bumper.</li>
<li>An object dragged from under the rear bumper.</li>
<li>Someone swinging their legs while sitting on the rear bumper.</li>
<li>Legs or body parts contacting the rear bumper while passing by.</li>
<li>Nearby electrical noise sources (pay parking, fuel station, electrically heated road, fluorescent light, TV tower, power plant, radio station).</li>
<li>Objects such as plants or shrubs near the rear bumper.</li>
<li>Luggage or objects set near the rear bumper.</li>
<li>Accessories or a vehicle cover installed/removed near the rear bumper.</li>
<li>When the vehicle is being towed.</li>
</ul>
<p>To prevent unintentional operation, turn the "PWR DOOR OFF" switch off to disable the smart power tailgate system.</p>
<h3>Gesture Control Precautions</h3>
<div class="box notice">
<div class="box-label">Notice</div>
<ul>
<li>Keep the lower centre part of the rear bumper clean at all times. If dirty or covered with snow, clean it, move the vehicle from the current position, and check if the gesture control operates. If it does not operate, have the vehicle inspected by a Maruti Suzuki authorised workshop.</li>
<li>Do not apply hydrophilic coatings or other coatings to the lower centre part of the rear bumper.</li>
<li>Do not park the vehicle near objects that may move and contact the lower centre part of the rear bumper (e.g. grass or plants). If this occurs, move the vehicle and re-check gesture control operation.</li>
<li>Do not subject the gesture control or its surrounding area to strong impacts. If impacted, have the vehicle inspected.</li>
<li>Do not disassemble the rear bumper.</li>
<li>Do not attach stickers to the rear bumper.</li>
<li>Do not paint the rear bumper.</li>
<li>If a bicycle carrier or similar heavy object is attached to the smart power tailgate, turn the gesture control operation setting off. Contact a Maruti Suzuki authorised workshop.</li>
<li>When the tailgate is opened using the remote controller or gesture control while the security system is armed, the tailgate will lock automatically and the security system will be re-armed once it is closed.</li>
<li>Before leaving the vehicle, ensure all doors are locked.</li>
</ul>
</div>
<h3>Canceling the Smart Power Tailgate System</h3>
<p>Turn the "PWR DOOR OFF" switch off to disable the smart power tailgate system. When the system is off, the tailgate does not operate automatically but can be opened and closed by hand.</p>
<h3>Adjusting the Open Position</h3>
<p>The open position of the smart power tailgate can be adjusted.</p>
<ol>
<li>Stop the tailgate in the desired position.</li>
<li>Press and hold the switch (1) on the lower part of the tailgate for approximately 2 seconds. When the settings are completed, the buzzer sounds 4 times.</li>
</ol>
<p>When opening the tailgate next time, it will stop at the adjusted position.</p>
<p>To cancel the adjusted position: Press and hold the switch (1) on the lower part of the tailgate for approximately 7 seconds. After the buzzer sounds 4 times, it sounds 3 more times. The tailgate will return to the initial settings position on the next open operation.</p>
<h3>Jam Protection Function</h3>
<p>Sensors are equipped on both sides of the smart power tailgate. If anything obstructs the smart power tailgate while it is closing, the tailgate will automatically operate in the opposite direction and stop.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>Never use any part of your body to intentionally activate the jam protection function.</li>
<li>The jam protection function may not work if something gets caught just before the tailgate fully closes. Be careful to keep fingers and other objects clear.</li>
<li>The jam protection function may not work depending on the shape of the object that is caught.</li>
</ul>
</div>
<h3>Fall-Down Protection Function</h3>
<p>While the smart power tailgate is opening automatically, applying excessive force to it will stop the opening operation to prevent the tailgate from suddenly shutting.</p>
<h3>Tailgate Closing Assist</h3>
<p>If the tailgate is lowered manually when stopped at an open position, the tailgate will fully close automatically.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>In the event the tailgate is left slightly open, the tailgate closer will automatically close it to the fully closed position. It takes several seconds before the tailgate closure begins to operate. Ensure that fingers or any body parts/clothes do not get stuck, as this may cause serious injuries.</p>
</div>
<h3>Smart Power Tailgate Operating Conditions</h3>
<p>The smart power tailgate can automatically open and close under the following conditions:</p>
<ul>
<li>The smart power tailgate system is "ON".</li>
<li>When the ignition mode is "ON", and additionally for opening: vehicle speed is 5 km/h or less and the parking brake is engaged, or the brake pedal is depressed, or the shift lever is in P.</li>
</ul>
<h3>Tailgate Spindle Precautions</h3>
<div class="box notice">
<div class="box-label">Notice</div>
<p>The tailgate is equipped with spindles that hold it in place. Do not attach any foreign objects such as stickers, plastic sheets, or adhesives to the spindle rod. Do not attach any accessories other than genuine Maruti Suzuki parts to the tailgate. Do not place your hand on the spindle or apply lateral forces to it.</p>
</div>
<h3>When Reconnecting the Battery or Changing a Fuse While the Tailgate Is Open</h3>
<p>To enable the smart power tailgate to operate properly, initialize the system by completely closing the tailgate manually. If the battery is reconnected or a fuse is changed while the tailgate is closed, initializing the system is not necessary.</p>
</template>

<template id="tpl-remote-controller">
<h1>Keyless Push Start System Remote Controller</h1>
<p>Your vehicle is equipped with a keyless push start system remote controller. It combines a keyless entry system and a keyless push start system, enabling the following:</p>
<ul>
<li>Lock or unlock doors using the LOCK/UNLOCK buttons.</li>
<li>Lock or unlock doors by pushing the request switch on the door handle or tailgate.</li>
<li>Start the engine without an ignition key. Refer to <a onclick="navigate('engine-switch')" href="javascript:void(0)">05-02 Engine Switch Power Switch</a> in the "Operating Your Vehicle" section.</li>
</ul>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Radio waves from the keyless push start system antenna(s) may interfere with electrical medical equipment such as pacemakers. Anyone who uses such equipment should consult their medical equipment supplier or medical advisor. If radio wave interference is a concern, have the antenna function disabled by a Maruti Suzuki authorised workshop.</p>
</div>
<p>The remote controller has three buttons:</p>
<ul>
<li><strong>(1) LOCK button</strong></li>
<li><strong>(2) UNLOCK button</strong></li>
<li><strong>(3) Smart power tailgate button</strong></li>
</ul>
<h2>Locking and Unlocking with the Remote Controller</h2>
<p>To lock or unlock all doors (including the tailgate), operate the remote controller near the vehicle.</p>
<p><strong>To lock all doors:</strong> Push LOCK button (1) once. The turn signal lights will flash once and the siren will sound once.</p>
<p><strong>To unlock only the driver's door:</strong> Push UNLOCK button (2) once. The turn signal lights will flash twice and the exterior buzzer will sound twice. If the interior light switch is in the DOOR position, the interior light will turn on for about 15 seconds and then fade out.</p>
<p><strong>To unlock all other doors:</strong> Push UNLOCK button (2) once again.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You can switch the unlock function from requiring two pushes to one push (and vice versa) via the information display setting mode. Refer to <a onclick="navigate('display-settings')" href="javascript:void(0)">12-19 Setting Mode of Information Display (Type B)</a> in the "Specifications" section.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>If no door is opened within about 30 seconds after pressing UNLOCK, the doors will automatically lock again.</li>
<li>The maximum operating distance is about 5 m, but this can vary near other transmitting devices such as radio towers.</li>
<li>The door locks cannot be operated with the remote controller if the ignition mode is other than LOCK (OFF).</li>
<li>When any door is open, pressing LOCK will cause the exterior buzzer to sound and the doors cannot be locked.</li>
<li>If you lose a remote controller, ask your Maruti Suzuki authorised workshop for a replacement and have the new transmitter code programmed so the old code is erased.</li>
</ul>
</div>
<h2>Locking and Unlocking Using the Request Switches</h2>
<p>When the remote controller is within approximately 80 cm of a front door handle or the tailgate switch, you can lock or unlock all doors (including the tailgate) by pushing the request switch (1) on the driver's door handle, front passenger's door handle, or tailgate.</p>
<p><strong>To lock all doors:</strong> Push one of the request switches once. The turn signal lights will flash once and the siren will sound once.</p>
<p><strong>To unlock only one door:</strong> Push one of the request switches once.</p>
<p><strong>To unlock all doors:</strong> Push one of the request switches twice.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>You can switch from requiring two pushes to one push (and vice versa) via the information display setting mode.</p>
</div>
<p>When the doors are unlocked, the turn signal lights will flash twice and the exterior buzzer will sound twice. If the interior light switch is in DOOR position, the interior light will turn on for about 15 seconds.</p>
<p>Check that the doors are locked after using the request switch to lock them.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The door locks cannot be operated by the request switch if any door is open or not completely closed, or if the ignition mode is anything other than LOCK (OFF).</li>
<li>If no doors are opened within about 30 seconds after unlocking, the doors will lock again automatically.</li>
<li>If the remote controller battery is low or there are strong radio waves or noise, the operating range may be reduced or the remote controller may be inoperative.</li>
<li>If the remote controller is too close to the door glass, the request switches may not operate.</li>
<li>If a spare remote controller is inside the vehicle, the request switches may not operate normally.</li>
<li>Each request switch only operates when the remote controller is within that specific switch's range. For example, the driver's door switch will not activate the tailgate switch if the remote controller is only within range of the driver's door.</li>
<li>If the remote controller is left in any of the following locations, it may be inadvertently detected and the request switch may activate, risking the remote controller being trapped inside: instrument panel, floor, luggage compartment, glove box, door pockets, or deep storage compartments.</li>
</ul>
<p><strong>NOTICE:</strong> The remote controller is a sensitive electronic instrument. Do not expose it to impacts, moisture, or high temperatures (e.g. direct sunlight on the dashboard). Keep it away from magnetic objects such as televisions.</p>
</div>
<h2>Request Switch Warning Buzzer</h2>
<p>The exterior buzzer beeps for about 2 seconds to warn you that the request switch is not working in the following conditions:</p>
<ul>
<li>The request switch is pressed after all doors are closed with the ignition mode changed to ACC or ON (by pressing the engine/power switch) when the remote controller is outside the vehicle.</li>
<li>The request switch is pressed after changing the ignition mode to LOCK (OFF) when the remote controller is left inside the vehicle, or any door (including the tailgate) is open.</li>
</ul>
<p>To resolve: bring the remote controller outside the vehicle if it is inside, and ensure all doors are completely closed, then press the request switch again.</p>
<h2>Reminder Function</h2>
<p>If the remote controller is not in the vehicle under the following condition, the buzzer sounds intermittently for about 2 seconds and the immobilizer/keyless push start system warning light on the instrument cluster blinks: when one or more doors are opened and all doors are later closed with the ignition in any other mode than LOCK (OFF).</p>
<p>The indicator light will turn off within several seconds after the remote controller is returned to an area of the vehicle other than the rear luggage area.</p>
<p>If the remote controller is left in the vehicle and you lock the driver's or front passenger's door using the lock knob or the power door locking switch, that door will be automatically unlocked.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The reminder will not operate when the remote controller is on the instrument panel, in the glove box, in a storage compartment, in the sun visor, or on the floor.</li>
<li>Always carry the remote controller. Do not leave it in the vehicle when leaving.</li>
</ul>
</div>
<h2>Stowing and Removing the Mechanical Key</h2>
<p>To stow the key into the remote controller, push the key in until you hear a click.</p>
<p>To remove the key, slide the lock knob (A) in the arrow direction and pull the key out.</p>
<p>Always check that the key is stowed in the remote controller. If the remote controller becomes unusable, you will not be able to lock or unlock the doors.</p>
<h2>General Precautions</h2>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The keyless push start system may not function correctly near strong signals from a television, power station, or cellular phone; when the remote controller is in contact with or covered by a metal object; when a radio wave type remote keyless entry is used nearby; or when placed near an electronic device such as a personal computer.</li>
<li>Always ensure the driver carries the remote controller.</li>
<li>If a remote controller is lost, contact your Maruti Suzuki authorised workshop as soon as possible for a replacement and to erase the old code.</li>
<li>Up to four remote controllers can be registered for your vehicle.</li>
<li>The battery life of the remote controller is approximately two years, but may vary depending on usage.</li>
</ul>
</div>
<h2>Battery Replacement</h2>
<div class="box warning">
<div class="box-label">Warning</div>
<p>Swallowing a lithium battery may cause serious internal injury or death. Keep lithium batteries away from children and pets. If swallowed, contact a physician immediately.</p>
<p><strong>NOTICE:</strong></p>
<ul>
<li>The remote controller is sensitive. Do not expose it to dust or moisture, and do not tamper with internal parts.</li>
<li>When replacing the battery yourself, touch a metallic part to remove static electricity before proceeding to avoid damaging the remote controller.</li>
<li>You may damage the remote controller when replacing the battery. Ask your Maruti Suzuki authorised workshop to inspect the system after replacement.</li>
</ul>
</div>
<p>If the remote controller becomes unreliable, replace the battery as follows:</p>
<ol>
<li>Cover a flat-bladed screwdriver with a soft cloth. Insert it into the slot (1) and pry open the remote controller (2). Be careful not to damage the internal unit.</li>
<li>Remove the old battery using the flat-bladed screwdriver covered with a soft cloth.</li>
<li>Place the new battery (3) — <strong>CR2032 lithium disc type or equivalent</strong> — with its <strong>+ terminal facing up</strong>.</li>
<li>Close the remote controller firmly.</li>
<li>Verify that the door locks can be operated with the remote controller.</li>
<li>Dispose of the used battery properly according to applicable rules and regulations. Do not dispose of lithium batteries with ordinary household trash. The crossed-out wheeled bin symbol on the battery indicates it must be collected separately.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Do not dispose of used batteries with ordinary household trash.</li>
<li>When purchasing a battery yourself, check the year of manufacture.</li>
<li>For more information on disposal or recycling, consult your Maruti Suzuki authorised workshop.</li>
</ul>
</div>

<template id="tpl-security-system">
<h1>Security System</h1>
<p>The security system is armed after you close and lock all doors (including the engine hood and tailgate) using the keyless push start system remote controller or request switch.</p>
<p>Once armed, any attempt to open a door by means other than the remote controller or request switch — including using the key, the lock knob on a door, the central door locking switch, or the tailgate unlatch switch — will trigger the alarm. Opening the engine hood will also trigger the alarm.</p>
<p>If the shock sensor (if equipped) is enabled and its sensitivity is set above 0, the alarm will also be triggered by any attempt to tamper with the vehicle.</p>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The security system generates alarms when any of the predetermined conditions are met, but it does not block unauthorised entry into the vehicle.</li>
<li>Always use the keyless push start system remote controller or request switch to unlock the doors when the security system is armed. Using the key instead will trigger the alarm.</li>
<li>If a person who does not know the security system is going to drive the vehicle, explain the system and its operation to them. Mistakenly triggering the alarm may cause a nuisance to others.</li>
<li>Even if the security system is armed, do not leave money or valuables in the vehicle.</li>
<li>The security system is not armed when all doors are locked using the key from outside, the door lock knobs, or the central door locking switch from inside.</li>
<li>If any door is not operated within approximately 30 seconds after the doors have been unlocked using the remote controller or request switch, the doors automatically lock again and the security system will be re-armed.</li>
<li>If the security system indicator blinks when the ignition mode is ON, there may be something wrong with the security system. Ask your Maruti Suzuki authorised workshop to inspect it.</li>
</ul>
</div>
<h2>How to Arm the Security System</h2>
<p>Lock all doors (including the engine hood and tailgate) using the keyless push start system remote controller or request switch. When the system is armed, the security system indicator continues to blink at intervals of approximately 2 seconds.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>To prevent the alarm from being accidentally triggered, avoid arming the system while anyone remains inside the vehicle. The alarm will be triggered if a person inside opens any door, tailgate, or the engine hood.</p>
</div>
<h2>How to Disarm the Security System</h2>
<p>Unlock the doors using the keyless push start system remote controller or request switch. The security system indicator will go out, indicating the system is disarmed.</p>
<h2>How to Stop the Alarm</h2>
<p>Should the alarm be triggered accidentally, stop it by either of the following:</p>
<ul>
<li>Press the engine switch or power switch to change the ignition mode to ON.</li>
<li>Unlock the doors using the keyless push start system remote controller or request switch.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>Even after the alarm has stopped, if you lock the doors using the remote controller or request switch, the security system will be re-armed.</li>
<li>If you disconnect the battery while the security system is armed or the alarm is in operation, the alarm will be re-triggered when the battery is reconnected.</li>
<li>Even after the alarm stops at the end of the predetermined operation time, it will be triggered again if any door, tailgate, or engine hood is opened without first disarming the system.</li>
</ul>
</div>
<h2>Checking Whether the Alarm Was Triggered During Parking</h2>
<p>If the alarm was triggered while you were away, when you change the ignition mode to ON the security system indicator will blink rapidly for about 8 seconds and a buzzer will beep 4 times. If this happens, check whether the vehicle has been broken into.</p>
<h2>Security System Indication</h2>
<ul>
<li>If any door or the tailgate is opened without unlocking using the remote controller or request switch, all turn signal lights start to blink and the interior buzzer beeps intermittently. After 5 seconds, the siren sounds for about 27.5 seconds. The security system indicator continues to blink during this time.</li>
<li>If the engine hood is opened, all turn signal lights blink and the siren sounds for about 27.5 seconds. The security system indicator continues to blink during this time.</li>
</ul>
<p><strong>(If shock sensor is equipped and enabled)</strong></p>
<ul>
<li>If the vehicle feels a shock above the pre-warning sensitivity level, the siren sounds for about 2 seconds (pre-warning).</li>
<li>If the vehicle feels a shock above the full blast warning sensitivity level, the siren sounds for about 5 seconds (full blast warning).</li>
<li>If the full blast warning sensitivity is set higher than the pre-warning sensitivity, or the shock is strong enough to trigger the full blast warning, the full blast warning triggers directly without a pre-warning.</li>
</ul>
<p>The security system indicator continues to blink throughout any alarm event.</p>
<h2>Shock Sensor Settings (if equipped)</h2>
<p>The shock sensor is disabled by default. To enable it and adjust the sensitivity of the pre-warning and full blast warning functions, use the setting mode of the information display or ask your Maruti Suzuki authorised workshop.</p>
</template>

<template id="tpl-windows">
<h1>Windows</h1>
<h2>Electric Window Controls</h2>
<p>The electric windows can only be operated when the ignition mode is ON.</p>
<p>The driver's door has a switch (1) to operate the driver's window, a switch (2) to operate the front passenger's window, and switches (3) and (4) to operate the rear right and left passenger windows respectively.</p>
<p>The passenger's door has a switch (5) to operate the passenger's window.</p>
<p>To open a window, push the top part of the switch. To close the window, lift up the top part of the switch.</p>
<p>The driver's window has AUTO-DOWN and AUTO-UP features. Press the driver's window switch completely down or up and release it — the window will travel to the fully open or fully closed position without holding the switch. To stop the window before it reaches the end, briefly push or pull the switch in the opposite direction.</p>
<div class="box note">
<div class="box-label">Note</div>
<p>If you drive with one of the rear windows open, you may hear a loud sound caused by air vibration. To reduce the sound, open the driver's or front passenger's window, or narrow the rear window opening.</p>
</div>
<h2>Lock Switch</h2>
<p>The driver's door also has a lock switch for the passenger's window(s). When you push in the lock switch, the passenger's window(s) cannot be raised or lowered by operating any of the switches (2), (3), (4) or (5). To restore normal operation, push the lock switch again.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<ul>
<li>When opening or closing a window, a part of the body such as hands, legs or neck may be caught and an accident may occur. Observe the following:</li>
<li>Both the driver and other passengers should be careful when opening or closing a window.</li>
<li>Do not allow a child to operate the window switches.</li>
<li>Always lock the passenger's window operation when there are children in the vehicle.</li>
<li>When you leave your vehicle, press the engine/power switch to change the ignition mode to OFF, carry your key, and take children out of the vehicle.</li>
<li>When operating the front passenger's or rear windows from the driver's side, check that other passengers do not have their hands or faces outside the vehicle, and inform them before operating.</li>
<li>Do not operate the electric window controls from outside the window. Your hands or neck may be caught.</li>
</ul>
</div>
<h2>Pinching Prevention Function</h2>
<p>The driver's window is equipped with a pinching prevention function. When closing the window using the AUTO-UP feature, if a foreign object is detected caught in the window, the window automatically stops closing to prevent damage.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The function may not detect an object depending on its shape, size, hardness and position. This may cause severe injury. Be very careful when opening or closing the windows.</p>
<p><strong>CAUTION:</strong></p>
<ul>
<li>The pinching prevention function does not operate while you are holding the window switch in the UP position.</li>
<li>The pinching prevention function may not detect an object caught in the window just before it is fully closed.</li>
</ul>
<p><strong>NOTE:</strong></p>
<ul>
<li>Even if the window cannot be closed by AUTO-UP due to a possible fault with the pinching prevention function, you can still close the window by holding the switch in the UP position.</li>
<li>If you drive in extreme off-road conditions, the pinching prevention function may operate accidentally due to vehicle jolting.</li>
</ul>
</div>
<h3>Initialising the Pinching Prevention Function</h3>
<p>When you disconnect and reconnect the battery or replace a fuse, the pinching prevention function will be deactivated. In this condition, the AUTO-DOWN feature will be deactivated while AUTO-UP may remain active. The function must be re-initialised before use.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>The pinching prevention function will not operate until initialisation is completed. Make sure to perform the initialisation.</p>
</div>
<p>To initialise:</p>
<ol>
<li>Press the engine/power switch to change the ignition mode to ON.</li>
<li>Open the driver's window fully by holding the window switch in the DOWN position.</li>
<li>Close the driver's window by holding the switch in the UP position, and keep holding it for 2 seconds after the window is fully closed.</li>
<li>Check that the AUTO-DOWN/UP feature works correctly.</li>
</ol>
<p>If the AUTO-DOWN/UP feature does not work after initialisation, there may be a fault with the pinching prevention function. Have your vehicle inspected by a Maruti Suzuki authorised workshop.</p>
</template>

<template id="tpl-lighting-control">
<h1>Lighting Control Lever</h1>
<p>Your vehicle's lighting system is controlled by the lighting switch and the auto-on headlight system (when the lighting switch is in the "AUTO" position). They work together to operate your lights as shown in the chart below.</p>
<p>To turn the lights on or off, twist the knob on the end of the lever.</p>
<img src="lighting-control-lever-table.png" alt="Lighting control lever switch positions and operation chart">
<h2>Switch Positions</h2>
<p><strong>OFF (1):</strong> All lights are off.</p>
<p><strong>AUTO (2):</strong> The position lights, tail lights, license plate light and headlights are turned on and off automatically according to the amount of outside light detected by sensor (5) on the passenger's side of the instrument panel. This function operates when the ignition mode is ON. All lights go out automatically when the ignition mode is changed to ACC or LOCK (OFF).</p>
<p><strong>Position (3):</strong> Front position lights, tail lights, license plate light, and instrument lights are on. Headlights are off.</p>
<p><strong>Headlights (4):</strong> Front position lights, tail lights, license plate light, instrument lights, and headlights are all on.</p>
<p>With the headlights on, push the lever forward to switch to high beams and pull it toward you to switch to low beams. When the high beams are on, a light on the instrument cluster will illuminate. To momentarily activate the high beams as a passing signal, pull the lever slightly toward you and release it.</p>
<div class="box caution">
<div class="box-label">Caution</div>
<p>If the light sensor area of the windshield is covered with mud, ice, or similar substances, the headlights and position lights may be turned on even when it is still light outside.</p>
<p><strong>NOTE:</strong></p>
<ul>
<li>Avoid covering the light sensor area of the windshield with a sticker, as it may impair the sensor's performance.</li>
<li>If the ignition mode is ON and "AUTO" remains selected, headlights and position lights will come on automatically as it gets dark, even with the engine not running. Leaving the lights on for a long time may fully discharge the battery.</li>
</ul>
</div>
<h2>Auto-On Headlight System</h2>
<p>The auto-on headlight system automatically turns on all lights operated by the lighting switch when all three of the following conditions are met:</p>
<ol>
<li>It is dark around the light sensor (5).</li>
<li>The lighting switch is in "AUTO" position.</li>
<li>The ignition mode is changed to ON.</li>
</ol>
<p>Do not cover sensor (5). Otherwise, the system will not work correctly.</p>
<div class="box warning">
<div class="box-label">Warning</div>
<p>It takes about 5 seconds for the light sensor to react to a change in lighting conditions. To avoid reduced visibility accidents, turn on your headlights manually before driving into a tunnel, parking structure, etc.</p>
<p><strong>NOTE:</strong> The light sensor reacts to infrared rays and may operate incorrectly when there are strong infrared rays present.</p>
</div>
<h2>Light Reminder Buzzer</h2>
<p>The interior buzzer continuously beeps if you open the driver's door without turning off the headlights and position lights. This is triggered when the headlights and/or position lights remain on after the ignition mode is changed to LOCK (OFF). A message is also displayed on the information display in the instrument cluster while the buzzer is sounding. The buzzer stops when you turn off the lights.</p>
<h2>Daytime Running Light (DRL) System</h2>
<p>When the engine is started, the daytime running lights are turned on automatically.</p>
<p><strong>Conditions for DRL operation:</strong></p>
<ol>
<li>The engine is running.</li>
<li>Headlights and front fog lights are off.</li>
</ol>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>The brightness of the daytime running lights is different from that of the position lights; this is not a malfunction.</li>
<li>When using the turn signal, the daytime running light on the signalling side goes off.</li>
</ul>
</div>
<h2>Guide Me Light</h2>
<p>Guide Me Light has two functions — "To home" and "To car" — for improving visibility in the dark.</p>
<h3>"To Home" Function</h3>
<p>After leaving the car, the ground will be illuminated for a short while. The front position lights and headlights (low beam) turn on for about 10 seconds after the ignition mode is changed to LOCK (OFF).</p>
<p><strong>To activate:</strong></p>
<ol>
<li>Turn the lighting switch to "AUTO" position.</li>
<li>Change the ignition mode to LOCK (OFF).</li>
<li>Pull the lighting control lever toward you once and open the driver's side door within 60 seconds. Alternatively, pull the lighting control lever toward you once while the driver's side door is already open.</li>
</ol>
<p><strong>To cancel:</strong></p>
<ul>
<li>Pull the lighting control lever toward you once, or</li>
<li>Change the ignition mode to ACC or ON, or</li>
<li>Turn the lighting switch to any position other than "AUTO".</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>When the "To home" function is active, the front fog lights and high beam headlights are not turned on.</li>
<li>The lighting time can be changed in the information display. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "Instrument Cluster" section.</li>
</ul>
</div>
<h3>"To Car" Function</h3>
<p>Before you get in the vehicle, the ground is illuminated to guide you to the car in the dark. When the UNLOCK button on the keyless push start system remote controller is pressed with the lighting switch in "AUTO" position, the front position lights and headlights (low beam) turn on for 10 seconds.</p>
<p>This function only operates when it is dark outside the vehicle.</p>
<p><strong>To cancel:</strong></p>
<ul>
<li>Lock the doors using the keyless push start system remote controller, request switch, or the key in the driver's door lock, or</li>
<li>Change the ignition mode to ACC or ON.</li>
</ul>
<div class="box note">
<div class="box-label">Note</div>
<ul>
<li>When the "To car" function is active, the front fog lights and high beam headlights are not turned on.</li>
<li>The lighting time can be changed in the information display. Refer to <a onclick="navigate('information-display')" href="javascript:void(0)">04-02 Information Display (Type B)</a> in the "Instrument Cluster" section.</li>
</ul>
</div>
<h2>Front Fog Light Switch</h2>
<p>Refer to <a onclick="navigate('other-controls-overview')" href="javascript:void(0)">07-00 Other Controls and Equipment</a> for the Front Fog Light Switch.</p>
</template>
